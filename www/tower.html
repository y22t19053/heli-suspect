<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>合理怀疑：审判之塔</title>
<meta name="theme-color" content="#08090B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="tower.css">
</head>
<body>
<div id="bg" aria-hidden="true">
  <div class="bg-curtain left"></div>
  <div class="bg-curtain right"></div>
  <div class="bg-arch"></div>
  <div class="bg-bench"></div>
  <div class="bg-gallery"></div>
  <div class="bg-floor"></div>
  <div class="bg-vignette"></div>
</div>

<div id="app">
  <header id="topbar" class="topbar hidden">
    <div class="brand">
      <span class="brand-mark">⚖</span>
      <div><b>合理怀疑</b><small>审判之塔</small></div>
    </div>
    <div class="run-stats">
      <span class="stat hp"><i>❤</i><b id="stat-hp">--</b></span>
      <span class="stat gold"><i>◈</i><b id="stat-gold">--</b></span>
      <span class="stat floor"><i>⌂</i><b id="stat-floor">--</b></span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" data-act="deck" title="牌组">牌组</button>
      <button class="icon-btn" data-act="menu" title="菜单">菜单</button>
    </div>
  </header>

  <main id="screen" aria-live="polite"></main>
  <div id="toast" class="toast"></div>
</div>

<script src="tower.js"></script>
</body>
</html>
