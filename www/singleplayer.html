<script>
"use strict";
/* =====================================================================
 * 《合理怀疑 · 世纪审判》单机渲染器 v2 —— 大更新版
 * 虚构"米合众国"联邦巡回法庭体系，四方法律团队对抗
 * 视觉：美漫硬边政治讽刺漫画 —— 报纸米黄底 + 粗黑描边 + 无渐变 + 大字海报
 * 动画：FX 队列引擎（翻牌/爆炸/新闻/计票柱/领奖台/阶段横幅/方向光束/数值飘字…）
 * 音效：WebAudio 合成器（无资源文件）
 * ===================================================================== */

/* ============================ 0. 工具 ============================ */
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function shuffle(arr){ for (let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return arr; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function easeOutBack(p){ const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2); }
function easeOutCubic(p){ return 1-Math.pow(1-p,3); }

/* 统一坐标系（P1-5）：不再用 1000×700 逻辑画布，画布尺寸 = 真实视口（含安全区），
 * 布局全部基于 W/H 计算（见 panelRect/rowLayout/...），与联机版同一套断点 */
let W = 0, H = 0;
const DPR = Math.min(2, window.devicePixelRatio || 1);
const canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');

/* ============================ 1. 固定配色 · 阵营 ============================ */
/* PAL / PARTY_META 唯一源 = shared/theme.js（演播室深蓝 + 金），
 * 经 _build_ui.js 内联为下方 THEME 块；渲染层直接读全局。 */
/*__THEME_START__*/
/* ============================================================
 * shared/theme.js — 合理怀疑 · 全局主题唯一源（超级更新#3/#4/#5）
 * 单主题（#5 十组配色三维分层）：
 *   包豪斯炭黑 #1A1A1D × 包豪斯红光晕 #FF3B30
 *   克莱因蓝辩论台 #012696 × 薄荷青高光 #66D4C8
 *   象牙白纸 #FFFFF0 × 柠檬黄 #FFED00 × 正红 #C01E25
 *   （删 PvZ 草地绿 / 旧报纸米黄 / 演播室深蓝风，双端共用一套）
 * ------------------------------------------------------------
 * 挂载方式（双挂载）：
 *   浏览器：window.PAL / window.PARTY_META / window.campColor ...
 *   Node：  module.exports = { PAL, PARTY_META, campColor, ... }
 * 阵营工具（campColor/campSoft/partyOf/campOf/contrast）唯一源在此，
 * 两端禁止另写副本；渲染层直接读全局（运行时自动取 view/game 数据源）。
 * ============================================================ */
(function (g) {
  'use strict';
  /* 四方法律团队：公诉方红 / 被告方蓝 / 第三方绿 / 第四方金 */
  const PARTY_META = {
    red:   { name: '公诉方律师团', short: '公诉', sym: '检', col: '#C94A3C', soft: '#E8C6B8' },
    blue:  { name: '被告方律师团', short: '被告', sym: '辩', col: '#2E5E8C', soft: '#C8D6E2' },
    green: { name: '第三方律师团', short: '第三', sym: '席', col: '#3F7D66', soft: '#C6DCCF' },
    gold:  { name: '第四方律师团', short: '第四', sym: '议', col: '#C79A4B', soft: '#E8D6B0' }
  };
  /* Ink Court：19 世纪法庭木刻 / 红丝绒 / 黄铜 / 羊皮纸 */
  const PAL = {
    bg:     { a: '#0B0D10', b: '#14120F', light: '#C94A3C' },
    court:  { a: '#1B1410', b: '#D8A84E' },
    ui:     { a: '#F0E2C6', b: '#A82E2A', gold: '#D8A84E' },
    accent: { a: '#E8D2A6', b: '#3F7D66', danger: '#B2352C' },
    paper:  { a: '#D8C39C', b: '#8FA88C', c: '#D8B0AA', d: '#B97868' },
    neutral:{ a: '#6F5A78', b: '#8FA88C' },
    fx:     { a: '#D8C39C', b: '#3F7D66' },
    events: { a: '#2E5E8C', b: '#D8A84E' },
    reward: { a: '#D8A84E', b: '#1B1410' },
    draft:  { a: '#0B0D10', b: '#D8A84E' },
    ink:    '#F0E2C6',
    grave:  '#6B6254',
    gold:      '#D8A84E',
    goldSoft:  '#E8C888',
    red:       '#C94A3C',
    blue:      '#2E5E8C',
    green:     '#3F7D66',
    partyGold: '#C79A4B',
    darkBg:    '#0B0D10',
    panel:     '#E8D8B4',
    textSoft:  '#D8CBB2',
    border:    '#6B5A3E',
    white:     '#FFFFFF',
    black:     '#17120C',
    coin:      '#D8A84E',
    deepRed:   '#8F2420',
    linkBlue:  '#7FB6C9',
    brownInk:  '#2B2015'
  };
  /* 卡纸底色兜底（旧代码把 PAL.paper 当字符串用：升级后由这里补默认档） */
  const PAPER_FALLBACK = PAL.paper.a;
  /* 未选定阵营时的兜底色板（按座位索引） */
  const FALLBACK_COL = ['#FF3B30', '#0A84FF', '#2FBF5F', '#C78A1A'];
  const FALLBACK_SOFT = ['#F6C8C8', '#C8D6F2', '#C6EAD8', '#F2E2C0'];

  /* 运行时数据源：联机渲染读 view（makeView 防作弊视图），单机读 game。
   * 两端渲染层都有同名全局，theme 函数仅在被调用时读取，故加载顺序无关。 */
  function seatsOf() {
    if (typeof view !== 'undefined' && view && view.seats) return view.seats;
    if (typeof game !== 'undefined' && game && game.seats) return game.seats;
    return null;
  }

  /* 该座位当前阵营 key（'red'/'blue'/'green'/'gold'），未选角返回 null */
  function campOf(seat) {
    const seats = seatsOf();
    if (!seats || !seats[seat] || !seats[seat].camp) return null;
    return seats[seat].camp;
  }
  /* 阵营主色：已选角取 PARTY_META.col，否则按座位兜底 */
  function campColor(seat) {
    const c = campOf(seat);
    const m = c && PARTY_META[c];
    if (m) return m.col;
    return FALLBACK_COL[seat % 4];
  }
  /* 阵营浅色（面板底/卡背等） */
  function campSoft(seat) {
    const c = campOf(seat);
    const m = c && PARTY_META[c];
    if (m) return m.soft;
    return FALLBACK_SOFT[seat % 4];
  }
  /* 阵营元信息（名称/符号），未选角返回待定 */
  function partyOf(seat) {
    const c = campOf(seat);
    const m = c && PARTY_META[c];
    return m || { name: '待定', sym: '?' };
  }
  /* 对比色：深底用白字 / 浅底用黑字（自绘文本专用） */
  function contrast(hex) {
    const c = String(hex).replace('#', '');
    if (c.length < 6) return '#ffffff';
    const r = parseInt(c.substr(0, 2), 16), gg = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
    return (r * 0.299 + gg * 0.587 + b * 0.114) > 150 ? '#1a1a1a' : '#ffffff';
  }

  g.PARTY_META = PARTY_META;
  g.PAL = PAL;
  g.PAPER_FALLBACK = PAPER_FALLBACK;
  g.campOf = campOf;
  g.campColor = campColor;
  g.campSoft = campSoft;
  g.partyOf = partyOf;
  g.contrast = contrast;
  /* Node 双挂载（超级更新#3）：server/_test 等 require 时可用 */
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = { PARTY_META, PAL, PAPER_FALLBACK, campOf, campColor, campSoft, partyOf, contrast, FALLBACK_COL, FALLBACK_SOFT };
  }
})(typeof window !== 'undefined' ? window : globalThis);

/*__THEME_END__*/
/* campColor/campSoft/partyOf/contrast 唯一源 = 上方 THEME 块（shared/theme.js，
 * 超级更新#4），渲染层直接读全局；此处不再维护副本。 */

/* ============================ 2. 基础绘制原语（唯一源 = shared/draw-primitives.js） ============================ */
/*__DRAWPRIMS_START__*/
/* ============================================================
 * shared/draw-primitives.js — 双端统一基础绘制原语（超级更新#6）
 * ------------------------------------------------------------
 * 本文件是以下基础绘制原语的【唯一源】，client.js 与 singleplayer.html
 * 均不再维护副本（singleplayer.html 经 _build_ui.js 内联本文件）。
 *   文本：textWidth / fitText / drawPixelText / drawWrapText
 *   图形：jaggedRectPath / pxRect / pxBorder / comicShadow
 *   字体表：_FONT_BASE（全局 var，供 btnFont / fontBase 等读取）
 * 依赖的全局（均运行时读取，故加载顺序无关）：
 *   ctx   —— 画布上下文（两端均以顶层 var 声明 → window.ctx）
 *   PAL   —— shared/theme.js 挂载的全局配色
 *   clamp —— 两端顶层 function 声明
 * 约定：全部为 function 声明（进 window），const 会漏（评审教训）。
 * ============================================================ */
var _FONT_BASE = '"Noto Sans SC","Microsoft YaHei","PingFang SC","Impact","Arial Black",sans-serif';
const _twCache = new Map();
const _fitCache = new Map();

/* 美漫锯齿矩形路径（miter 折线 + 手绘纸边锯齿） */
function jaggedRectPath(x, y, w, h, j) {
  j = Math.max(1, j == null ? 2 : j);
  const rnd = Math.floor(x * 13 + y * 7 + w * 3 + h * 5);
  const n = 4;
  const jx = (i, t) => x + w * t + (((rnd + i * 3) % 5) - 2) * j * 0.4;
  const jy = (i, t) => y + h * t + (((rnd + i * 7) % 3) - 1) * j * 0.5;
  ctx.beginPath();
  ctx.moveTo(x, y);
  for (let i = 1; i <= n; i++) ctx.lineTo(jx(i, i / n), jy(i, 0));
  ctx.lineTo(x + w, y);
  for (let i = 1; i <= n; i++) ctx.lineTo(jx(i, 1), jy(i, i / n));
  ctx.lineTo(x + w, y + h);
  for (let i = 1; i <= n; i++) ctx.lineTo(jx(i, 1 - i / n), jy(i, 1));
  ctx.lineTo(x, y + h);
  for (let i = 1; i <= n; i++) ctx.lineTo(jx(i, 0), jy(i, 1 - i / n));
  ctx.closePath();
}

/** 平涂纯色色块（无圆角、无渐变） */
function pxRect(x, y, w, h, col) {
  ctx.save();
  ctx.fillStyle = col;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  ctx.restore();
}

/** 美漫粗墨线边框：miter 尖角 + 外粗内细双线 */
function pxBorder(x, y, w, h, col, t) {
  t = clamp(Math.max(1.5, t || 2), 1.5, 6);
  ctx.save();
  ctx.strokeStyle = col;
  ctx.lineWidth = t;
  ctx.lineJoin = 'miter';
  ctx.lineCap = 'butt';
  jaggedRectPath(x + t / 2, y + t / 2, w - t, h - t, 2);
  ctx.stroke();
  ctx.globalAlpha = 0.4;
  ctx.lineWidth = Math.max(1, t * 0.55);
  const in2 = t * 1.9;
  jaggedRectPath(x + in2, y + in2, w - in2 * 2, h - in2 * 2, 1);
  ctx.stroke();
  ctx.restore();
}

/** 精确测量文本宽度（带缓存：字体+文本 作为 key，避免每帧重复 measureText） */
function textWidth(text, font) {
  const k = font + '\u0000' + text;
  let v = _twCache.get(k);
  if (v === undefined) {
    // 只保存/恢复 font（save/restore 会快照整个画布状态栈，成本高；本函数只改 font）
    const prev = ctx.font;
    ctx.font = font;
    v = ctx.measureText(text).width;
    ctx.font = prev;
    if (_twCache.size > 6000) _twCache.clear();
    _twCache.set(k, v);
  }
  return v;
}

/** 自动缩字/截断：文本超过 maxW 时先降字号，仍超则截断加省略号（P0-4b：下限 9px，放不下就省略号）
 * 顾问评审 8.2：同 (text,maxW,size,bold) 同帧只算一次（fitText 结果缓存，防重复循环） */
function fitText(text, maxW, size, o) {
  o = o || {};
  const key = String(text) + '|' + maxW + '|' + size + '|' + (o.bold === false ? '0' : '1');
  const hit = _fitCache.get(key);
  if (hit) return { text: hit.text, size: hit.size, w: hit.w };
  let s = Math.max(9, size), t = String(text);
  const bold = o.bold === false ? '' : '700 ';
  const fontFor = ss => bold + ss + 'px ' + _FONT_BASE;
  while (s > 9 && textWidth(t, fontFor(s)) > maxW) s -= 0.5;
  while (t.length > 1 && textWidth(t + '…', fontFor(s)) > maxW) t = t.slice(0, -1);
  if (t !== String(text) && textWidth(t + '…', fontFor(s)) <= maxW) t += '…';
  const r = { text: t, size: s, w: textWidth(t, fontFor(s)) };
  if (_fitCache.size > 2000) _fitCache.clear();
  _fitCache.set(key, r);
  return r;
}

/** 美漫矢量文字：大字 900 粗体 + 粗黑墨线描边（P0-4a：≤13px 一律无粗体无描边，靠对比色区分）
 * 返回值 w 为精确测量宽度（非估算），供后续元素流式定位 */
function drawPixelText(text, x, y, size, color, o) {
  o = o || {};
  size = Math.max(5, size);
  ctx.save();
  const small = size <= 13;
  const bold = (small || o.bold === false) ? '' : '700 ';
  ctx.font = bold + size + 'px ' + _FONT_BASE;
  ctx.textBaseline = 'middle';
  ctx.textAlign = o.align === 'center' ? 'center' : (o.align === 'right' ? 'right' : 'left');
  if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;
  if (!small && o.shadow !== false) {
    ctx.lineWidth = o.lineW !== undefined ? o.lineW : Math.max(0.8, size / 12);
    ctx.lineJoin = 'miter';
    ctx.strokeStyle = o.outline || PAL.black;
    ctx.strokeText(text, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
  return { w: Math.round(textWidth(text, bold + size + 'px ' + _FONT_BASE)), h: Math.round(size * 1.4) };
}

/** 按宽度折行的像素文字：逐字测量换行（不再按字数估算），优先在标点后断行 */
function drawWrapText(text, x, y, size, color, maxWidth, lineH, o) {
  o = o || {};
  const bold = o.bold === false ? '' : '700 ';
  const font = bold + size + 'px ' + _FONT_BASE;
  const lh = lineH || Math.round(size * 1.32);
  const maxLines = o.maxLines || 12;
  const lines = [];
  let rest = text;
  while (rest.length > 0 && lines.length < maxLines) {
    let take = rest.length;
    while (take > 1 && textWidth(rest.slice(0, take), font) > maxWidth) take--;
    if (take <= 0) take = 1;
    if (take < rest.length) {
      // 向回找最近的标点（含空格），在它后面断开
      for (let i = take - 1; i > Math.max(0, take - 8); i--) {
        if (/[，。；：、！？,.!?;: \u00b7·]/.test(rest[i])) { take = i + 1; break; }
      }
    }
    lines.push(rest.slice(0, take));
    rest = rest.slice(take);
  }
  if (rest.length > 0 && lines.length === maxLines) {
    // 超出行数：最后一行截断加省略号（自动缩字到能放下）
    const f = fitText(lines[lines.length - 1] + '…', maxWidth, size, { bold: o.bold === false ? false : true });
    lines[lines.length - 1] = f.text;
  }
  lines.forEach((ln, i) => drawPixelText(ln, x, y + i * lh - (lines.length - 1) * lh / 2, size, color, o.shadow === false ? { shadow: false } : { shadow: true }));
  return lines.length * lh;
}

/** 硬阴影：右下错位的纯黑硬色块 */
function comicShadow(x, y, w, h, dx, dy) {
  ctx.save();
  ctx.fillStyle = 'rgba(10,10,10,0.32)';
  ctx.fillRect(Math.round(x + (dx || 4)), Math.round(y + (dy || 4)), Math.round(w), Math.round(h));
  ctx.restore();
}

/*__DRAWPRIMS_END__*/
function btn(x, y, w, h, label, col, enabled){
  enabled = enabled !== false;
  return { x, y, w, h, label, col: col || PAL.ui.a, enabled };
}
/* 按钮文案自适应：label 超宽时按按钮宽度收缩字号（竖屏窄按钮防溢出） */
function btnFont(b){
  const base = b.h * 0.42;
  const font = (base <= 13 ? '' : '700 ') + base + 'px ' + _FONT_BASE;
  const tw = textWidth(b.label, font);
  if (tw <= b.w - 10) return base;
  return Math.max(9, base * (b.w - 10) / tw);
}
function drawBtn(b){
  ctx.save();
  ctx.globalAlpha = b.enabled ? 1 : 0.42;
  const hov = b.enabled && mouse.x >= b.x - 3 && mouse.x <= b.x + b.w + 3 && mouse.y >= b.y - 3 && mouse.y <= b.y + b.h + 3;
  // Ink Court 黄铜铭牌：深底 + 双线金框 + 内高光 + 切角，不再用扁平色块
  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  ctx.fillRect(Math.round(b.x + 3), Math.round(b.y + 5), Math.round(b.w), Math.round(b.h));
  const base = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
  if (b.primary) {
    base.addColorStop(0, hov ? '#C8584A' : '#A9362B');
    base.addColorStop(0.55, hov ? '#98271F' : '#7E1E18');
    base.addColorStop(1, '#4A0F0D');
  } else if (b.wood) {
    base.addColorStop(0, hov ? '#4B3A25' : '#33271A');
    base.addColorStop(0.55, hov ? '#2C2116' : '#201710');
    base.addColorStop(1, '#0C0906');
  } else {
    base.addColorStop(0, hov ? '#2F3A32' : '#202922');
    base.addColorStop(1, '#0C100D');
  }
  ctx.fillStyle = base;
  ctx.fillRect(Math.round(b.x), Math.round(b.y), Math.round(b.w), Math.round(b.h));
  // 内高光/底部暗边
  ctx.fillStyle = 'rgba(255,238,190,0.10)';
  ctx.fillRect(Math.round(b.x + 2), Math.round(b.y + 2), Math.round(b.w - 4), 1);
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.fillRect(Math.round(b.x + 2), Math.round(b.y + b.h - 3), Math.round(b.w - 4), 2);
  // 黄铜双框 + 四角切角
  pxBorder(b.x, b.y, b.w, b.h, hov ? PAL.gold : 'rgba(216,168,78,0.68)', hov ? 3 : 2);
  if (b.w > 34 && b.h > 18) {
    const cl = Math.min(9, b.w * 0.12);
    ctx.strokeStyle = hov ? 'rgba(244,216,142,0.95)' : 'rgba(216,168,78,0.55)';
    ctx.lineWidth = 1.6;
    [[b.x + 2, b.y + 2, 1, 1], [b.x + b.w - 2, b.y + 2, -1, 1], [b.x + 2, b.y + b.h - 2, 1, -1], [b.x + b.w - 2, b.y + b.h - 2, -1, -1]].forEach(function (c) {
      ctx.beginPath(); ctx.moveTo(c[0] + c[2] * cl, c[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(c[0], c[1] + c[3] * cl); ctx.stroke();
    });
  }
  const txtCol = b.primary ? '#FFE9C4' : PAL.goldSoft;
  drawPixelText(b.label, b.x + b.w / 2, b.y + b.h / 2 - (hov ? 1.5 : 0), btnFont(b), txtCol, { align: 'center', shadow: true, outline: '#120C08', lineW: 2 });
  ctx.restore();
}
function inBtn(b, x, y){ return b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }

/* 报纸网点暗纹（美漫底色）→ P0-4 法庭场景（深景渐变 + 木饰墙板 + 地板透视 + 聚光） */
function drawBg(theme){
  // 新美术：Ink Court 插画背景（红幕/立柱/法官席/旁听席/地板/聚光）
  if (window.RenderCore && RenderCore.drawCourtScene) {
    RenderCore.drawCourtScene(ctx, 'game', W, H, LOW_Q);
    return;
  }
  pxRect(0, 0, W, H, theme.a);
  // 低画质（LOW_Q）：跳过装饰，保帧率（顾问评审 8.1）
  if (LOW_Q) return;
  ctx.save();
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#101224');
  sky.addColorStop(0.55, '#171a30');
  sky.addColorStop(1, '#0b0d18');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);
  // ① 墙板：垂直木饰条 + 墙裙线（低透明度）
  ctx.strokeStyle = 'rgba(212,175,110,0.06)';
  ctx.lineWidth = 1;
  const plankW = Math.max(44, W * 0.055);
  for (let x = plankW / 2; x < W; x += plankW) {
    ctx.beginPath(); ctx.moveTo(Math.round(x), 0); ctx.lineTo(Math.round(x), H * 0.92); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(212,175,110,0.05)';
  ctx.fillRect(0, H * 0.30, W, 1.5);
  ctx.fillStyle = 'rgba(212,175,110,0.04)';
  ctx.fillRect(0, H * 0.30 + 6, W, 1);
  // ② 中央穹顶拱门轮廓
  ctx.strokeStyle = 'rgba(233,196,106,0.10)';
  ctx.lineWidth = 2;
  const archCx = W / 2, archR = Math.min(W * 0.30, H * 0.30);
  ctx.beginPath();
  ctx.arc(archCx, H * 0.30 + archR * 0.55, archR, Math.PI, 0);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(233,196,106,0.06)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(archCx, H * 0.30 + archR * 0.55, archR * 0.82, Math.PI, 0);
  ctx.stroke();
  // ③ 地板透视（下 1/4 区域）
  const floorY = H * 0.80;
  const fg = ctx.createLinearGradient(0, floorY, 0, H);
  fg.addColorStop(0, 'rgba(20,16,10,0.25)');
  fg.addColorStop(1, 'rgba(8,6,4,0.55)');
  ctx.fillStyle = fg;
  ctx.fillRect(0, floorY, W, H - floorY);
  ctx.strokeStyle = 'rgba(212,175,110,0.07)';
  ctx.lineWidth = 1;
  for (let i = 1; i <= 4; i++) {
    const fy = floorY + (H - floorY) * (i / 4);
    ctx.beginPath(); ctx.moveTo(0, fy); ctx.lineTo(W, fy); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(212,175,110,0.05)';
  for (let i = 0; i <= 4; i++) {
    const t = i / 4;
    const x0 = W / 2 + (W * 0.10 - W / 2) * t;
    const x1 = W / 2 + (W * 0.90 - W / 2) * t;
    ctx.beginPath(); ctx.moveTo(x0, floorY); ctx.lineTo(x1, H); ctx.stroke();
  }
  // ④ 法官席剪影 + 顶部聚光
  const benchY = H * 0.30 + archR * 1.05;
  ctx.fillStyle = 'rgba(12,10,8,0.5)';
  ctx.fillRect(W / 2 - archR * 0.6, benchY, archR * 1.2, 4);
  ctx.fillStyle = 'rgba(233,196,106,0.12)';
  ctx.fillRect(W / 2 - archR * 0.55, benchY + 4, archR * 1.1, 1.5);
  const lampG = ctx.createRadialGradient(W * 0.5, H * 0.06, 2, W * 0.5, H * 0.06, Math.max(W, H) * 0.34);
  lampG.addColorStop(0, 'rgba(255,238,190,0.09)');
  lampG.addColorStop(0.5, 'rgba(255,238,190,0.03)');
  lampG.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = lampG;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/* ============================ 3. 音效（WebAudio 合成） ============================ */
let AC = null;
function sfx(name){
  try {
    if (muted) return;   // P0-5 单机：M 键静音
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    const osc = (type, f0, f1, dur, vol, delay) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t + (delay||0));
      if (f1 !== undefined) o.frequency.exponentialRampToValueAtTime(Math.max(30,f1), t + (delay||0) + dur);
      g.gain.setValueAtTime(0.0001, t + (delay||0));
      g.gain.exponentialRampToValueAtTime(vol, t + (delay||0) + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (delay||0) + dur);
      o.connect(g); g.connect(AC.destination);
      o.start(t + (delay||0)); o.stop(t + (delay||0) + dur + 0.05);
    };
    const noise = (dur, vol, delay) => {
      const len = Math.max(1, Math.floor(AC.sampleRate * dur));
      const buf = AC.createBuffer(1, len, AC.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * (1 - i/len);
      const src = AC.createBufferSource(), g = AC.createGain();
      src.buffer = buf; g.gain.value = vol;
      src.connect(g); g.connect(AC.destination);
      src.start(t + (delay||0));
    };
    switch (name){
      case 'click': osc('square', 520, 300, 0.06, 0.12); break;
      case 'flip':  osc('square', 720, 260, 0.11, 0.13); noise(0.08, 0.05); break;
      case 'swoosh': noise(0.28, 0.10); osc('sawtooth', 300, 900, 0.28, 0.06); break;
      case 'boom':  noise(0.5, 0.30); osc('sine', 140, 38, 0.5, 0.35); osc('square', 90, 30, 0.5, 0.12); break;
      case 'gavel':  noise(0.16, 0.20); osc('triangle', 210, 60, 0.30, 0.30); osc('square', 120, 40, 0.28, 0.10); break;   // 法槌：低闷重击
      case 'coin':  osc('square', 1180, 1180, 0.08, 0.12); osc('square', 1568, 1568, 0.12, 0.10, 0.08); break;
      case 'news':  osc('sawtooth', 620, 880, 0.28, 0.12); osc('sawtooth', 880, 620, 0.28, 0.12, 0.30); osc('sawtooth', 620, 880, 0.28, 0.12, 0.60); break;
      case 'star':  osc('triangle', 660, 990, 0.14, 0.12); osc('triangle', 990, 1320, 0.14, 0.10, 0.12); break;
      case 'shatter': noise(0.22, 0.16); osc('square', 400, 120, 0.18, 0.08); break;
      case 'win':   [523,659,784,1046].forEach((f,i)=>osc('triangle', f, f, 0.22, 0.13, i*0.13)); break;
      case 'boo':   osc('sawtooth', 180, 120, 0.35, 0.10); noise(0.25, 0.06); break;
      case 'hover': osc('sine', 1900, 2400, 0.03, 0.035); break;   // 悬停滴答：极短、极轻
      case 'paper': noise(0.09, 0.05); osc('triangle', 500, 900, 0.08, 0.05); noise(0.13, 0.04, 0.06); break;  // 纸页翻动（刷新市场）
    }
  } catch(e){ /* 静音兜底 */ }
}
/* 移动端触觉反馈（D 类审查）：iOS 不支持 vibrate 时自动忽略；节流防连发 */
let lastHapticT = 0;
function haptic(ms){
  try {
    if (!navigator.vibrate) return;
    const now = Date.now();
    if (now - lastHapticT < 60) return;   // 节流：60ms 内最多一次
    lastHapticT = now;
    navigator.vibrate(ms || 10);
  } catch(e){ /* 触觉不可用则忽略 */ }
}

/* ============================ 4. FX 动画引擎 ============================ */
/* #60/#61：对象池复用 + 总量上限 + 高负载自动降级（低端机/移动端优化）
 * 顾问评审 8.1：主动低画质（不再等 FX 超载被动减速）——低内存（deviceMemory<=2）
 * 或低核（4 核内）移动设备，开局即降级：FX 上限减半、粒子密度减半、背景网点跳过、
 * 大字描边关闭。isMobile 在后文定义（TDZ），LOW_Q/FX_MAX 在此声明、isMobile 后评估。 */
const FX = [];
let shakeAmp = 0;
let LOW_Q = false;            // 主动低画质：在 isMobile 定义后评估（见 resize 前）
let FX_MAX = 48;              // FX 总量上限：超出丢弃最旧（防粒子爆炸拖垮低端机）
let fxLowQ = LOW_Q;           // 低质量模式：降级粒子密度/跳过重特效
const _fxPool = [];           // FX 对象池：复用对象，减少每帧 GC 压力
function recycleFx(f){ for (const k in f) delete f[k]; if (_fxPool.length < 32) _fxPool.push(f); }
let waitUntil = 0;             // 动画演出期：暂停引擎推进
function hold(ms){ waitUntil = Math.max(waitUntil, performance.now() + ms); }
function addFx(f){
  const obj = _fxPool.pop() || {};   // 从池取空对象复用，避免反复分配
  for (const k in f) obj[k] = f[k];
  obj.t = 0; obj.dur = f.dur || 800;
  if (FX.length >= FX_MAX){ const old = FX.shift(); recycleFx(old); }
  FX.push(obj);
  return obj;
}
function updateFx(dt){
  for (let i = FX.length - 1; i >= 0; i--){
    const f = FX[i];
    f.t += dt;
    if (f.t - (f.delay || 0) >= f.dur){ FX.splice(i, 1); recycleFx(f); }
  }
  shakeAmp *= 0.86;
  if (shakeAmp < 0.4) shakeAmp = 0;
  // #60：移动端 FX 高负载 → 自动降级粒子密度，保帧率（主动低画质设备恒为 true）
  fxLowQ = LOW_Q || (isMobile && FX.length > 24);
}
function ttOf(f){ return Math.max(0, f.t - (f.delay || 0)); }
function renderFx(){
  for (const f of FX) drawFx(f);
}
function drawFx(f){
  const tt = ttOf(f);
  const p = clamp(tt / f.dur, 0, 1);
  switch (f.type){
    /* ---- 卡牌翻面（reveal 逐张） ---- */
    case 'flipSeq': {
      const lay = rowLayout();
      lay.items.forEach((it, i) => {
        if (it.removed) return;
        const prog = clamp((tt - i * 140) / 300, 0, 1);
        if (prog <= 0 || prog >= 1) return;
        const cx = it.x + it.w / 2;
        const s = Math.cos(prog * Math.PI);
        ctx.save();
        ctx.translate(cx, it.y + it.h / 2);
        ctx.scale(s, 1);
        if (prog < 0.5){
          UIKit.drawCardBackAt(ctx, -it.w/2, -it.h/2, it.w, it.h, PAL.ui.b);
        } else {
          UIKit.drawCard(ctx, -it.w/2, -it.h/2, it.w, it.h, it.card, { col: (UIKit.rarityCol && UIKit.rarityCol(it.card.skill)) || '#f6e9c8' });
        }
        ctx.restore();
      });
      break;
    }
    case 'count': {
      const cx = W - 262, cy = 64, cw = 252, chh = 150;
      const a = p < 0.08 ? p/0.08 : (p > 0.9 ? (1-p)/0.1 : 1);
      ctx.save();
      ctx.globalAlpha = clamp(a, 0, 1);
      pxRect(cx, cy, cw, chh, 'rgba(10,16,28,0.94)');
      pxBorder(cx, cy, cw, chh, PAL.gold, 3);
      drawPixelText('审 议 中', cx + cw/2, cy + 18, 17, PAL.gold, { align: 'center', shadow: false });
      const votes = f.votes, mx = Math.max(1, ...votes);
      const n = votes.length;
      const bw2 = Math.min(44, (cw - 30) / n - 6);
      votes.forEach((v, i) => {
        const bx = cx + 15 + i * (bw2 + 6);
        const grow = easeOutCubic(clamp(p / 0.8, 0, 1));
        const bh2 = Math.max(6, (v / mx) * 74 * grow);
        const by = cy + chh - 42 - bh2;
        pxRect(bx, by, bw2, bh2, f.cols[i]);
        pxBorder(bx, by, bw2, bh2, PAL.black, 2);
        if (grow < 0.92){
          drawPixelText(String(Math.round(v * grow)), bx + bw2/2, by - 12, 15, PAL.white, { align: 'center', shadow: false });
        } else {
          // 计票大数字：完成后向上弹出爆出（最高票金色放大+星星）
          const pop = easeOutBack(clamp((p - 0.88) / 0.12, 0, 1));
          const isWin = v === mx && f.t > 0;
          const sz = 15 + 14 * pop;
          const py = by - 12 - pop * 30;
          drawPixelText(String(v), bx + bw2/2, py, sz, isWin ? PAL.gold : PAL.white, { align: 'center', shadow: false });
          if (isWin){
            const tw = Math.sin(f.t / 60) * 3;
            UIKit.drawSkillIcon(ctx, 'star', bx + bw2/2 - 14, py - sz - 5 + tw, 13, PAL.gold);
            drawPixelText('领先', bx + bw2/2 + 1, py - sz - 6 + tw, 11, PAL.gold, { align: 'left', shadow: false });
          }
        }
        drawPixelText(f.names[i].charAt(0), bx + bw2/2, cy + chh - 26, 13, PAL.gold, { align: 'center', shadow: false });
      });
      ctx.restore();
      break;
    }
    /* ---- 数值飘字 ---- */
    case 'float': {
      const fy = f.y - 40 * easeOutCubic(p);
      const al = p < 0.7 ? 1 : (1 - p) / 0.3;
      ctx.save();
      ctx.globalAlpha = al;
      const sc = 1 + 0.5 * Math.sin(Math.min(1, p * 3) * Math.PI) * 0.3;
      ctx.translate(f.x, fy); ctx.scale(sc, sc);
      drawPixelText(f.text, 0, 0, f.size || 22, f.col || PAL.gold, { align: 'center' });
      ctx.restore();
      break;
    }
    /* ---- 卡牌缩放入场 ---- */
    case 'cardIn': {
      const sc = easeOutBack(p);
      ctx.save();
      ctx.translate(f.x + f.w/2, f.y + f.h/2);
      ctx.scale(sc, sc);
      ctx.globalAlpha = clamp(p * 4, 0, 1);
      ctx.translate(-f.w/2, -f.h/2);
      if (f.draw) f.draw();
      ctx.restore();
      break;
    }
    /* ---- 方向光束 ---- */
    case 'beam': {
      const pr = easeOutCubic(p);
      const x = f.x0 + (f.x1 - f.x0) * pr;
      const y = f.y0 + (f.y1 - f.y0) * pr;
      ctx.save();
      ctx.globalAlpha = p < 0.85 ? 1 : (1 - p) / 0.15;
      ctx.strokeStyle = f.col || PAL.gold;
      ctx.lineWidth = 7;
      ctx.lineCap = 'butt';
      ctx.beginPath();
      ctx.moveTo(f.x0, f.y0); ctx.lineTo(x, y);
      ctx.stroke();
      ctx.strokeStyle = PAL.white;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(f.x0, f.y0); ctx.lineTo(x, y);
      ctx.stroke();
      // 箭头
      ctx.fillStyle = f.col || PAL.gold;
      const ang = Math.atan2(f.y1 - f.y0, f.x1 - f.x0);
      ctx.translate(x, y); ctx.rotate(ang);
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-8, -9); ctx.lineTo(-8, 9); ctx.closePath(); ctx.fill();
      ctx.restore();
      break;
    }
    /* ---- 阶段横幅 ---- */
    case 'phase': {
      const inP = clamp(tt / 260, 0, 1);
      const outP = clamp((tt - (f.dur - 240)) / 240, 0, 1);
      const sl = inP * (1 - outP);
      ctx.save();
      // 去横条：不再画黑底金边横幅，改为纯悬浮金色文字（保留数值/文案）
      ctx.globalAlpha = 0.96 * sl;
      drawPixelText(f.label, W/2, 34, 24, PAL.gold, { align: 'center', shadow: true, outline: PAL.black, lineW: 3 });
      ctx.restore();
      break;
    }
  }
}

  /* ---------------- 布局引擎：唯一的坐标决策点 ---------------- */
  /* P0-2 五段式：费用位→标题栏→插图区（程序化几何纹理）→效果区 ≤2 行→稀有度边框
   * mini 档（<70px 宽）：票徽+名字+技能名小字+价格（无插图区，杜绝元素重叠）
   * small 档（高瘦/过矮）：票徽+名字+紧凑插图条+技能名黑条+价格
   * normal 档（手牌/放大/行卡高卡）：完整五段式 */
  function planCard(x, y, w, h) {
    const ratio = w / h;
    const mini = w < 70 || h < 62 || ratio < 0.52;          // 迷你：名字+票数+价格
    const small = !mini && (w < 116 || h < 96 || ratio < 0.62); // 小档：高瘦或过矮才降级（150×206 手牌卡保持 normal）
    const pad = 4;
    const vbW = Math.min(48, w * 0.36);
    const vbH = Math.min(20, h * 0.2);
    const nameSize = Math.max(9, Math.min(h * (mini ? 0.10 : 0.14), 22));
    // 插图区（程序化几何纹理）：normal 占卡宽 68%、高度 30%；small 降为窄条（宽 60%、高 22%）
    const artH = mini ? 0 : Math.max(16, h * (small ? 0.22 : 0.30));
    const artW = mini ? 0 : w * (small ? 0.60 : 0.68);
    // 效果区 ≤2 行：normal/small 用技能名黑条 + 精简效果；mini 只有技能名小字
    return {
      mini, small, ratio,
      voteBadge: { x: x + pad, y: y + pad, w: vbW, h: vbH },
      name: { x: x + vbW + 8, y: y + h * (mini ? 0.04 : 0.06), w: w - vbW - 14, h: nameSize * 1.4, size: nameSize },
      art: { x: x + (w - artW) / 2, y: y + h * (small ? 0.30 : 0.30), w: artW, h: artH, icon: Math.min(34, Math.max(14, artH * 0.66)) },
      // 技能名黑条（normal/small：Lv.名 一行；mini：图标+名 左对齐小字）
      skillName: { x, y: y + h * (mini ? 0.36 : (small ? 0.56 : 0.64)), w, h: Math.max(mini ? 10 : 13, h * 0.07), size: Math.max(small ? 9 : 8, Math.min(h * 0.06, 12)) },
      // 效果区（normal ≤2 行；small 一行精简；mini 无）
      skillEff: { x: x + 4, y: y + h * (small ? 0.64 : 0.73), w: w - 8, size: Math.max(small ? 8 : 9.5, Math.min(h * 0.075, 11.5)), lineH: Math.max(10, h * 0.075) },
      cost: { x: x + w / 2 - Math.min(30, w * 0.25), y: y + h - Math.min(20, h * 0.34), w: Math.min(60, w * 0.5), h: Math.min(16, h * 0.3), size: Math.max(10, h * 0.082) },
      camp: { x, y: y + 1, w: 3, h: h - 2 }
    };

  /* ---------------- 程序化几何纹理（P0-2 插图区） ----------------
   * 由卡 uid/id/名字 hash 确定性生成图案，同一张卡每次渲染完全一致；
   * 纯几何 path，无字体依赖，低端机永远清晰。
   * 图案库 8 种：同心环 / 放射线 / 斜纹 / 棋盘 / 圆点阵 / 波浪 / 三角 / 回廊。
   * 主色 = 卡面稀有度底色（base），深/浅变体由 base 派生。 */
  function seedOf(card) {
    const s = String(card.uid || card.id || ((card.name || '') + (card.skill || '')));
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h;
  }
  /* hex → rgba 字符串（alpha 0~1），纹理叠加用 */
  function tinta(hex, a) {
    const c = parseInt(String(hex).replace('#', ''), 16);
    if (isNaN(c)) return 'rgba(0,0,0,' + a + ')';
    return 'rgba(' + ((c >> 16) & 255) + ',' + ((c >> 8) & 255) + ',' + (c & 255) + ',' + a + ')';
  }
  function artTexture(ctx, card, x, y, w, h, base) {
    if (w <= 0 || h <= 0) return;
    const seed = seedOf(card);
    const kind = seed % 8;
    const cx = x + w / 2, cy = y + h / 2;
    const R = Math.min(w, h) / 2;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const dark = tinta(base, 0.20), mid = tinta(base, 0.42), faint = tinta(base, 0.16);
    if (kind === 0) {             // 同心环
      ctx.strokeStyle = mid; ctx.lineWidth = Math.max(1.5, R * 0.09);
      for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(cx, cy, R * (0.2 + i * 0.22), 0, Math.PI * 2); ctx.stroke(); }
    } else if (kind === 1) {      // 放射线
      ctx.strokeStyle = dark; ctx.lineWidth = Math.max(1.5, R * 0.07);
      for (let i = 0; i < 12; i++) {
        const a = i * Math.PI / 6 + seed * 0.01;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); ctx.stroke();
      }
      ctx.strokeStyle = faint; ctx.lineWidth = Math.max(1.5, R * 0.05);
      for (let i = 0; i < 12; i++) {
        const a = i * Math.PI / 6 + seed * 0.01 + Math.PI / 12;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); ctx.stroke();
      }
    } else if (kind === 2) {      // 斜纹（方向 (1,1)，截距 b 平行线）
      ctx.strokeStyle = mid; ctx.lineWidth = Math.max(1.2, R * 0.06);
      const step = Math.max(7, R * 0.3);
      for (let b = -h; b <= w; b += step) {
        const x0 = x + Math.max(0, b), y0 = y + Math.max(0, -b);
        const x1 = b <= w - h ? x + b + h : x + w;
        const y1 = b <= w - h ? y + h : y + w - b;
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      }
    } else if (kind === 3) {      // 棋盘
      const n = 3 + (seed >> 3) % 2, cs = w / (n * 2);
      ctx.fillStyle = mid;
      for (let i = 0; i < n * 2; i++) for (let j = 0; j < Math.ceil(h / cs) + 1; j++) {
        if ((i + j) % 2 === 0) { ctx.fillRect(x + i * cs, y + j * cs, cs, cs); }
      }
    } else if (kind === 4) {      // 圆点阵
      ctx.fillStyle = mid;
      const dr = Math.max(2, R * 0.12), ds = Math.max(9, R * 0.36);
      for (let px2 = x + ds / 2; px2 < x + w; px2 += ds) for (let py2 = y + ds / 2; py2 < y + h; py2 += ds) {
        ctx.beginPath(); ctx.arc(px2 + ((seed >> 4) % 3 - 1) * 2, py2, dr, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(cx, cy, dr * 1.4, 0, Math.PI * 2); ctx.fill();
    } else if (kind === 5) {      // 波浪
      ctx.strokeStyle = dark; ctx.lineWidth = Math.max(1.5, R * 0.08);
      const amp = R * 0.2, ws = Math.max(10, w / 3.2);
      for (let wy = y + R * 0.4; wy < y + h; wy += R * 0.55) {
        ctx.beginPath();
        for (let wx = x; wx <= x + w; wx += 3) {
          const yy = wy + Math.sin((wx - x) / ws * Math.PI * 2 + seed * 0.05) * amp;
          if (wx === x) ctx.moveTo(wx, yy); else ctx.lineTo(wx, yy);
        }
        ctx.stroke();
      }
    } else if (kind === 6) {      // 三角拼接（斜锯齿）
      ctx.strokeStyle = dark; ctx.lineWidth = Math.max(1.2, R * 0.05);
      const th = Math.max(8, R * 0.34), tw = th * 1.15;
      for (let ty = y - th; ty < y + h + th; ty += th) {
        ctx.beginPath();
        for (let tx = x - tw; tx < x + w + tw; tx += tw) {
          const up = (((tx / tw) | 0) + ((ty / th) | 0)) % 2 === 0;
          ctx.moveTo(tx, up ? ty + th : ty);
          ctx.lineTo(tx + tw / 2, up ? ty : ty + th);
          ctx.lineTo(tx + tw, up ? ty + th : ty);
        }
        ctx.stroke();
      }
    } else {                      // 回廊（方环嵌套）
      ctx.strokeStyle = mid; ctx.lineWidth = Math.max(1.5, R * 0.09);
      for (let i = 0; i < 4; i++) {
        const m = R * (0.15 + i * 0.2);
        ctx.strokeRect(cx - m, cy - m, m * 2, m * 2);
      }
      ctx.strokeStyle = dark;
      ctx.beginPath(); ctx.moveTo(cx - R * 0.5, cy); ctx.lineTo(cx + R * 0.5, cy); ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------------- 卡背（唯一源：由双端抽入，超级更新#5） ---------------- */
  /* 卡背：机密档案封面「真相，由证据编织」（Task 4 叙事层） */
  function drawCardBackAt(ctx, x, y, w, h, col) {
    const shadow = E('comicShadow'), rect = E('pxRect'), border = E('pxBorder'), text = E('drawPixelText');
    const PAL = E('PAL') || {};
    const bc = col || (PAL.ui && PAL.ui.b) || '#D8A84E';
    shadow(x, y, w, h, 3, 3);
    rect(x, y, w, h, '#17120E');                       // 深胡桃木档案封面
    border(x, y, w, h, bc, 2.5);
    // 顶部机密条（红蜡封条 + 金线）
    const barH = Math.max(11, h * 0.11);
    rect(x + 3, y + 3, w - 6, barH, PAL.deepRed || '#8F2420');
    border(x + 3, y + 3, w - 6, barH, PAL.black, 1);
    text('机密 CONFIDENTIAL', x + w / 2, y + 3 + barH / 2, Math.max(6.5, h * 0.05), '#F4D88E', { align: 'center', shadow: false });

    const mini = w < 70 || h < 62;                     // 迷你尺寸降级：只保留封条 + 问号
    if (mini) {
      text('?', x + w / 2, y + h / 2 + 3, h * 0.30, bc, { align: 'center', shadow: false });
      return;
    }

    // 档案四角金属护片（小三角）
    const c = Math.max(6, w * 0.06), e = 3;
    ctx.fillStyle = '#B8B8B8';
    ctx.beginPath();
    ctx.moveTo(x + c, y + e); ctx.lineTo(x + e, y + e); ctx.lineTo(x + e, y + c);
    ctx.moveTo(x + w - c, y + e); ctx.lineTo(x + w - e, y + e); ctx.lineTo(x + w - e, y + c);
    ctx.moveTo(x + c, y + h - e); ctx.lineTo(x + e, y + h - e); ctx.lineTo(x + e, y + h - c);
    ctx.moveTo(x + w - c, y + h - e); ctx.lineTo(x + w - e, y + h - e); ctx.lineTo(x + w - e, y + h - c);
    ctx.fill();

    // 中央 天平 金章（圆印）：矢量图标，替换 emoji
    const cx = x + w / 2, cy = y + h * 0.40;
    const r = Math.min(w, h) * 0.22;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(232,164,24,0.12)'; ctx.fill();
    ctx.strokeStyle = PAL.coin; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.78, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(232,164,24,0.5)'; ctx.lineWidth = 1; ctx.stroke();
    drawSkillIcon(ctx, 'scale', cx, cy, r * 1.5, PAL.coin);

    // 主标题：真相，由证据编织
    text('真相', cx, y + h * 0.63, Math.min(w * 0.30, h * 0.15), '#F6E9C8', { align: 'center', shadow: false });
    text('由证据编织', cx, y + h * 0.75, Math.max(8, h * 0.065), '#9AA5B5', { align: 'center', shadow: false });

    // 底部档案底注
    const baseY = y + h - 12;
    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + 8, baseY); ctx.lineTo(x + w - 8, baseY); ctx.stroke();
    text('机密档案', x + 8, baseY + 8, Math.max(6, h * 0.045), '#6B7686', { shadow: false });
    text('CASE FILE', x + w - 8, baseY + 8, Math.max(5.5, h * 0.04), '#4E5866', { align: 'right', shadow: false });
  }

  /* 技能效果文本：卡面 desc 优先（参数化卡牌自带），否则技能库 desc；前缀精简省字（语义不变） */
  function effText(card, sk) {
    let t = (card.desc != null && card.desc !== '') ? card.desc : (sk ? sk.desc : '');
    if (!t) return '';
    t = t.replace(/^(亮出时|审议时|结算后)：/, m => m[0] === '亮' ? '亮出：' : (m[0] === '结' ? '结算：' : '审议：'));
    return t;
  }

  /* 阶段 C 技能显示修复：自适应字号——估算文本在 maxW 内放下 maxLines 行所需的最小字号
   * 保守估算：中文字宽 ≈ 字号（⊙/数字/英文更窄，实际可容纳更多，故不会低估行数） */
  function effFit(text, maxW, maxLines, start, min) {
    let size = start;
    while (size > min) {
      const per = Math.max(1, Math.floor(maxW / (size * 1.0)));
      if (Math.ceil(text.length / per) <= maxLines) return size;
      size -= 0.5;
    }
    return min;
  }

  /* ---------------- 组装：drawCard（供 drawVoterCard 薄封装调用） ---------------- */
  function drawCard(ctx, x, y, w, h, card, o) {
    o = o || {};
    const text = E('drawPixelText'), rect = E('pxRect'), border = E('pxBorder'),
          shadow = E('comicShadow'), fit = E('fitText'), camp = E('campColor'),
          wrap = E('drawWrapText'), lv = E('lvMark'), PAL = E('PAL') || {};
    const core = E('ElectionCore');
    const skills = (core && core.data) ? core.data.SKILLS : null;
    if (card.hidden) {
      drawCardBackAt(ctx, x, y, w, h, o.backCol || (PAL.ui && PAL.ui.b) || '#14213D');
      return;
    }

    const col = o.col || rarityCol(card.skill, PAL) || '#f6e9c8';
    const lay = planCard(x, y, w, h);

    shadow(x, y, w, h, 3, 3);
    // P0-2 实体感：柔和投影（硬阴影下叠一层羽化投影）＋ 卡面顶部到中部微渐变
    ctx.save();
    const gradShadow = ctx.createLinearGradient(0, y + 6, 0, y + h + 10);
    gradShadow.addColorStop(0, 'rgba(8,10,18,0.42)');
    gradShadow.addColorStop(1, 'rgba(8,10,18,0)');
    ctx.fillStyle = gradShadow;
    ctx.fillRect(Math.round(x + 2), Math.round(y + 5), Math.round(w - 4), Math.round(h + 8));
    const faceGrad = ctx.createLinearGradient(0, y, 0, y + h);
    faceGrad.addColorStop(0, 'rgba(255,255,255,0.28)');
    faceGrad.addColorStop(0.16, 'rgba(255,255,255,0.07)');
    faceGrad.addColorStop(1, 'rgba(0,0,0,0.10)');
    ctx.restore();
    rect(x, y, w, h, col);
    // P0-2 ⑤ 稀有度边框：双层（外层流派色 3px + 内层象牙细线高光），
    // 攻击粉/物证绿/程序深绿/封神玫瑰一眼可辨
    border(x, y, w, h, PAL.black, 3);
    ctx.save();
    ctx.globalAlpha = 0.85;
    border(x + 1.5, y + 1.5, w - 3, h - 3, '#FFF8E0', 1);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 0.75;
    const hz = ctx.createLinearGradient(0, y, 0, y + h * 0.30);
    hz.addColorStop(0, 'rgba(255,255,255,0.55)');
    hz.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hz;
    ctx.fillRect(Math.round(x + 1), Math.round(y + 1), Math.round(w - 2), Math.round(h * 0.30));
    ctx.globalAlpha = 0.38;
    ctx.fillStyle = PAL.white;
    ctx.fillRect(Math.round(x + 1), Math.round(y + 1), Math.round(w - 2), 1.2);
    ctx.fillRect(Math.round(x + 1), Math.round(y + 1), 1.2, Math.round(h - 2));
    ctx.restore();
    // 底部内阴影（厚度感）
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = '#000000';
    ctx.fillRect(Math.round(x + 2), Math.round(y + h - 3), Math.round(w - 4), 2.4);
    ctx.restore();

    /* Ink Court 实体感：纸纹 + 黄铜角花 + 左上装订孔 + 右上红蜡印 */
    if (w > 58 && h > 52) {
      ctx.save();
      // 纸纹（确定性短横线，不抢字）
      ctx.strokeStyle = 'rgba(70,48,28,0.075)';
      ctx.lineWidth = 1;
      const seed = (card.uid || 1) * 13 + (card.name ? card.name.length : 3);
      for (let gi = 0; gi < 5; gi++) {
        const gy = y + 6 + ((seed * (gi + 3)) % Math.max(8, h - 12));
        const gx = x + 4 + ((seed * (gi + 7)) % Math.max(4, w * 0.25));
        ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + Math.min(18, w * 0.18), gy); ctx.stroke();
      }
      // 黄铜角花（四角 L 形）
      const cl = Math.max(5, Math.min(9, w * 0.055));
      ctx.strokeStyle = 'rgba(168,118,52,0.55)';
      ctx.lineWidth = 1.4;
      [[x + 3, y + 3, 1, 1], [x + w - 3, y + 3, -1, 1], [x + 3, y + h - 3, 1, -1], [x + w - 3, y + h - 3, -1, -1]].forEach(c => {
        ctx.beginPath();
        ctx.moveTo(c[0] + c[2] * cl, c[1]);
        ctx.lineTo(c[0], c[1]);
        ctx.lineTo(c[0], c[1] + c[3] * cl);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(c[0] + c[2] * 1.5, c[1] + c[3] * 1.5, 1.3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(168,118,52,0.55)'; ctx.fill();
      });
      // 左侧装订孔
      ctx.fillStyle = 'rgba(50,32,18,0.22)';
      for (let bi = 1; bi <= 3; bi++) {
        ctx.beginPath(); ctx.arc(x + 4.5, y + h * (bi / 4), 1.5, 0, Math.PI * 2); ctx.fill();
      }
      // 右上红蜡印（只在大卡上）
      if (w > 96 && h > 80) {
        const sr = Math.max(7, Math.min(11, w * 0.065));
        const sx = x + w - sr - 3, sy = y + sr + 4;
        ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(143,36,32,0.88)'; ctx.fill();
        ctx.strokeStyle = 'rgba(224,176,90,0.65)'; ctx.lineWidth = 1.2; ctx.stroke();
        ctx.beginPath(); ctx.arc(sx, sy, sr * 0.66, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,224,160,0.35)'; ctx.lineWidth = 0.8; ctx.stroke();
        text('证', sx, sy, Math.max(6, sr * 0.92), '#F4D88E', { align: 'center', shadow: false });
      }
      ctx.restore();
    }

    // 阵营色带（o.seat 提供时）
    if (o.seat !== undefined && o.seat >= 0) {
      rect(x, y + 1, 3, h - 2, camp(o.seat));
      border(x, y + 1, 3, h - 2, PAL.black, 1);
    }

    // 超矮行卡（h<34，如手机横屏 4 人局）：只画票徽+名字，杜绝元素重叠
    const ultraTiny = h < 34;
    if (ultraTiny) {
      const vb2 = lay.voteBadge;
      rect(vb2.x, vb2.y, vb2.w, vb2.h, PAL.black);
      border(vb2.x, vb2.y, vb2.w, vb2.h, PAL.black, 1);
      drawSkillIcon(ctx, 'scale', vb2.x + vb2.h / 2, vb2.y + vb2.h / 2, vb2.h * 0.8, PAL.gold);
      text(String(card.votes || 1), vb2.x + vb2.h / 2 + 2, vb2.y + vb2.h / 2, Math.max(9, h * 0.14), PAL.gold, { align: 'left', shadow: false });
      const fN2 = fit(card.name, w - vb2.w - 14, Math.max(9, h * 0.18));
      text(fN2.text, x + vb2.w + 8 + (w - vb2.w - 14) / 2, y + h / 2, fN2.size, PAL.black, { align: 'center', shadow: false });
      return;
    }

    // ① 费用位：票数金徽（左上，StS 费用位）：矢量天平 + 票数
    const vb = lay.voteBadge;
    rect(vb.x, vb.y, vb.w, vb.h, PAL.black);
    border(vb.x, vb.y, vb.w, vb.h, PAL.black, 1);
    drawSkillIcon(ctx, 'scale', vb.x + vb.h * 0.72, vb.y + vb.h / 2, vb.h * 0.85, PAL.gold);
    text(String(card.votes || 1), vb.x + vb.h * 1.25, vb.y + vb.h / 2, Math.max(10, h * 0.085), PAL.gold, { align: 'left', shadow: false });

    // ② 标题栏：名字大字（顶部居中，避开左上徽章）
    const nm = lay.name;
    const nameW = Math.max(22, nm.w - 4);
    const fName = fit(card.name, nameW, nm.size);
    text(fName.text, nm.x + nameW / 2, nm.y + nm.h / 2, fName.size, PAL.black, { align: 'center', shadow: false });

    const sk = card.skill ? (skills ? skills[card.skill] : null) : null;
    const icon = card.skill ? (SKILL_ICON[card.skill] || 'scale') : null;
    const fxc = (SKILL_FX[card.skill] && SKILL_FX[card.skill].col) || PAL.blue;

    if (!lay.mini) {
      // ③ 插图区：程序化几何纹理（按卡 uid 确定性生成）+ 中央技能矢量图标
      //    纹理主色 = 技能触发色（与飘字同源）；无技能铁证 → 绿色天平图标
      const ar = lay.art;
      artTexture(ctx, card, ar.x, ar.y, ar.w, ar.h, fxc);
      ctx.save();
      ctx.globalAlpha = 0.16;
      rect(ar.x, ar.y, ar.w, ar.h, PAL.white);
      ctx.restore();
      border(ar.x, ar.y, ar.w, ar.h, 'rgba(17,17,17,0.35)', 1.2);
      if (icon) {
        drawSkillIcon(ctx, icon, ar.x + ar.w / 2, ar.y + ar.h / 2, ar.icon, PAL.white);
      } else {
        // 铁证：绿色 天平 图标 + 证词字样
        drawSkillIcon(ctx, 'scale', ar.x + ar.w / 2, ar.y + ar.h / 2, ar.icon, PAL.white);
        text('铁证', ar.x + ar.w / 2, ar.y + ar.h / 2 + ar.icon * 0.72, Math.max(8, ar.icon * 0.3), PAL.green, { align: 'center', shadow: false });
      }
    }
    // ④ 效果区 ≤2 行：技能名黑条（Lv.名） + 精简效果（完整 desc 只在悬停）
    if (sk) {
      const sn = lay.skillName;
      if (lay.mini) {
        drawSkillIcon(ctx, icon, x + w * 0.5 - 24, sn.y + sn.h / 2, sn.h * 1.1, PAL.brownInk);
        text(lv(sk.lv) + sk.name, x + w * 0.5 + 2, sn.y + sn.h / 2, Math.max(7.5, sn.size), PAL.brownInk, { align: 'left', shadow: false });
      } else {
        // 技能名黑条（normal/small 统一；terrorist 暗红底警示）
        rect(x + 4, sn.y, w - 8, sn.h, card.skill === 'terrorist' ? PAL.deepRed : PAL.black);
        drawSkillIcon(ctx, icon, x + w * 0.5 - 34, sn.y + sn.h / 2, sn.h * 1.0, PAL.gold);
        text(lv(sk.lv) + sk.name, x + w * 0.5 + 2, sn.y + sn.h / 2, Math.max(9, sn.size), PAL.gold, { align: 'left', shadow: false });
      }
      // 精简效果（normal 至多 2 行 / small 1 行；完整 desc 移出卡面进悬停 tooltip）
      const se = lay.skillEff;
      const effTxt = effText(card, sk);
      if (effTxt && !o.noDesc && !lay.mini) {
        const availH = lay.cost.y - se.y - 3;
        const maxLines = lay.small ? 1 : (availH >= se.lineH * 2 ? 2 : 1);
        if (availH >= se.lineH) {
          const cap = lay.small ? 14 : (maxLines >= 2 ? 26 : 13);
          const slim = effTxt.length > cap ? effTxt.slice(0, cap) + '…' : effTxt;
          wrap(slim, x + 5, se.y, se.size, '#333333', w - 10, se.lineH, { maxLines, shadow: false });
        }
      }
    }

    // ④ 底部价格金条
    const cb = lay.cost;
    rect(cb.x, cb.y, cb.w, cb.h, PAL.coin);
    border(cb.x, cb.y, cb.w, cb.h, PAL.black, 2);
    text('⊙' + card.cost, cb.x + cb.w / 2, cb.y + cb.h / 2, cb.size, PAL.brownInk, { align: 'center', shadow: false, lineW: 0 });
  }

  /* ---------------- 事件牌（报纸头条「号外」，唯一源） ---------------- */
  function drawEventCard(ctx, x, y, w, h, ev, o) {
    o = o || {};
    const text = E('drawPixelText'), rect = E('pxRect'), border = E('pxBorder'),
          shadow = E('comicShadow'), wrap = E('drawWrapText');
    if (ev.hidden) { drawCardBackAt(ctx, x, y, w, h, '#1B2C4A'); return; }
    const used = ev.used;
    // 可用性：o.usable === false → 整卡置灰半透明（"亮着但不能点"的误导；时序不符/非我方回合/等级不足/已过）
    const unusable = o.usable === false && !used;
    // 报纸：新闻纸米黄底（已用 → 陈旧灰；不可用 → 雾灰 + 半透明）
    const paper = used ? '#B9B2A0' : (unusable ? '#CFC9B8' : '#EDE3CC');
    ctx.save();
    if (unusable) ctx.globalAlpha = 0.62;
    shadow(x, y, w, h, 3, 3);
    rect(x, y, w, h, paper);
    border(x, y, w, h, used ? '#555555' : (unusable ? '#8A8A94' : PAL.black), 2);
    // 报头条：号外（红） + 报眉：庭审公报（不可用 → 灰头）
    const barH = Math.max(11, h * 0.115);
    rect(x, y, w, barH, used ? '#666666' : (unusable ? '#7C7C86' : PAL.deepRed));
    text(used ? '归档' : (unusable ? '暂不可用' : '号外'), x + 4, y + barH / 2, Math.max(8.5, h * 0.07), PAL.white, { shadow: false });
    text('庭审公报 · 卷宗' + (ev.id || ''), x + w - 4, y + barH / 2, Math.max(6.5, h * 0.055), 'rgba(255,255,255,0.85)', { align: 'right', shadow: false });
    // 头条大字：事件名（黑体）+ 红双下划线
    const tSize = Math.max(10.5, Math.min(w * 0.082, h * 0.115));
    text(ev.name, x + w / 2, y + h * 0.30, tSize, (used || unusable) ? '#666666' : PAL.black, { align: 'center', shadow: false });
    const ruleY = y + h * 0.38;
    ctx.fillStyle = (used || unusable) ? '#777777' : PAL.deepRed;
    ctx.fillRect(x + w * 0.12, ruleY, w * 0.76, 2.5);
    ctx.fillRect(x + w * 0.20, ruleY + 4.5, w * 0.60, 1.5);
    // 正文（报道）
    const evDescLines = Math.max(1, Math.floor((h * 0.50 - 20) / Math.max(8.5, h * 0.085)));
    wrap(ev.desc, x + 6, y + h * 0.55, Math.max(8, h * 0.06), (used || unusable) ? '#777777' : PAL.black, w - 12, Math.max(8.5, h * 0.085), { maxLines: evDescLines });
    // 效果章（报纸边栏小注，保留原语义）
    const effTxt = ev.eff ? (ev.eff.type === 'vote' ? (ev.eff.val > 0 ? '+票' : '−票')
      : ev.eff.type === 'money' ? (ev.eff.val > 0 ? '+⊙' : '−⊙')
      : ev.eff.type === 'support' ? '倾向'
      : ev.eff.type === 'leadSupport' ? '−倾向'
      : ev.eff.type === 'moneyAll' ? '普惠 +⊙'
      : ev.eff.type === 'richTax' ? '−⊙'
      : ev.eff.type === 'poorAid' ? '+⊙'
      : '加成') : '';
    const stampCol = ev.eff && ev.eff.val < 0 ? PAL.red : PAL.green;
    rect(x + 4, y + h - 18, 46, 14, used ? '#555555' : (unusable ? '#777781' : stampCol));
    border(x + 4, y + h - 18, 46, 14, PAL.black, 1);
    // 时序章：庭审前（蓝） / 庭审后（橙）——一眼区分前/后（不可用/已用 → 灰）
    const timingCol = used || unusable ? '#555555' : (ev.timing === 'pre' ? PAL.blue : '#B45309');
    rect(x + 4, y + h - 18, 46, 14, timingCol);
    border(x + 4, y + h - 18, 46, 14, PAL.black, 1);
    text(ev.timing === 'pre' ? '庭审前' : '庭审后', x + 27, y + h - 11, 10, PAL.white, { align: 'center', shadow: false });
    rect(x + w - 50, y + h - 18, 46, 14, used ? '#555555' : (unusable ? '#777781' : PAL.black));
    border(x + w - 50, y + h - 18, 46, 14, PAL.black, 1);
    text(effTxt, x + w - 27, y + h - 11, 10.5, used ? '#AAAAAA' : (unusable ? '#99999F' : PAL.gold), { align: 'center', shadow: false });
    ctx.restore();
  }

  /* ---------------- 角色候选卡（3 选 1，唯一源） ---------------- */
  function drawCharCard(ctx, x, y, w, h, ch, col, selected) {
    const text = E('drawPixelText'), rect = E('pxRect'), border = E('pxBorder'),
          shadow = E('comicShadow'), fit = E('fitText'), wrap = E('drawWrapText'),
          contrast = E('contrast'), jag = E('jaggedRectPath'),
          clamp = E('clamp') || ((v, a, b) => Math.max(a, Math.min(b, v))),
          PARTY_META = E('PARTY_META') || {},
          PAL = E('PAL') || { events: { a: '#14213D', b: PAL.gold }, accent: { b: PAL.black }, paper: '#F6E9C8' };
    // 美漫硬阴影
    shadow(x, y, w, h, 3, 3);
    // P0-2 实体感：柔和投影 + 顶部微渐变高光（与 drawCard 一致语言）
    ctx.save();
    const gradShadow = ctx.createLinearGradient(0, y + 6, 0, y + h + 10);
    gradShadow.addColorStop(0, 'rgba(8,10,18,0.42)');
    gradShadow.addColorStop(1, 'rgba(8,10,18,0)');
    ctx.fillStyle = gradShadow;
    ctx.fillRect(Math.round(x + 2), Math.round(y + 5), Math.round(w - 4), Math.round(h + 8));
    ctx.restore();
    rect(x, y, w, h, selected ? PAL.accent.b : ((PAL.paper && PAL.paper.a) || '#F6E9C8'));
    border(x, y, w, h, selected ? PAL.black : col, selected ? 4 : 2.5);
    ctx.save();
