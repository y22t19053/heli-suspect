<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>合理怀疑 · 世纪审判</title>
<style>
  :root {
    --gold: #E9C46A;
    --gold-hi: #FFE3A3;
    --ink: #0E0F1A;
    --ink-2: #161A2E;
    --line: rgba(233,196,106,.35);
    --text: #E8ECF6;
    --muted: #93A0B8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
    background:
      radial-gradient(ellipse at 50% -10%, rgba(233,196,106,.16), transparent 55%),
      radial-gradient(ellipse at 80% 110%, rgba(1,38,150,.25), transparent 55%),
      var(--ink);
  }
  .card { width: min(420px, 100%); text-align: center; }
  .gavel { font-size: 44px; line-height: 1; color: var(--gold); margin-bottom: 8px; }
  h1 { margin: 0; font-family: "Ma Shan Zheng", "STKaiti", serif; font-size: 44px; letter-spacing: .12em; color: var(--gold); text-shadow: 0 0 24px rgba(233,196,106,.2); }
  .sub { margin: 6px 0 24px; color: var(--muted); font-size: 12px; letter-spacing: .18em; }
  .btn {
    display: block; width: 100%; min-height: 54px; margin: 10px 0; padding: 14px 16px;
    border-radius: 10px; border: 1px solid var(--line); cursor: pointer;
    background: linear-gradient(180deg, #1E2540, #14182A); color: var(--text);
    font: 700 17px/1.2 inherit; letter-spacing: .08em;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
  }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: linear-gradient(180deg, #F0D28A, #C79B4A); border-color: #FFE3A3; color: #17120A; }
  .btn.ghost { background: transparent; color: var(--gold); }
  .field { text-align: left; margin: 22px 0 8px; }
  .field label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .field input {
    width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: rgba(0,0,0,.28); color: var(--text);
    font: 14px "Noto Sans SC", "Microsoft YaHei", sans-serif; outline: none;
  }
  .field input:focus { border-color: var(--gold); }
  .hint { color: #6F7D96; font-size: 11px; line-height: 1.6; margin: 8px 0 0; word-break: break-all; }
  .status { min-height: 20px; margin-top: 8px; font-size: 12px; color: var(--gold); }
  .footer { margin-top: 18px; color: #5D6A82; font-size: 10px; letter-spacing: .08em; }
</style>
</head>
<body>
<div class="card">
  <div class="gavel">⚖</div>
  <h1>合理怀疑</h1>
  <div class="sub">COURTROOM DRAMA · 世纪审判</div>

  <button id="btn-offline" class="btn primary">单机模式（离线）</button>
  <button id="btn-online" class="btn">联机模式</button>

  <div class="field">
    <label>联机服务器地址</label>
    <input id="server" type="url" inputmode="url" placeholder="https://heli-suspect.onrender.com" autocomplete="off">
  </div>
  <button id="btn-save" class="btn ghost">保存服务器地址</button>
  <div id="status" class="status"></div>

  <div class="hint">单机不需要网络；联机需要服务器。默认地址是 Render 免费服务，空闲后会冷启动，第一次进入可能要等 30–60 秒。</div>
  <div class="footer">v1.2.0 · Android 客户端</div>
</div>

<script>
(function () {
  'use strict';
  var KEY = 'heli_server_url';
  var DEFAULT_SERVER = 'https://heli-suspect.onrender.com';
  var input = document.getElementById('server');
  var statusEl = document.getElementById('status');
  var saved = '';
  try { saved = localStorage.getItem(KEY) || ''; } catch (e) { /* 忽略 */ }
  input.value = saved || DEFAULT_SERVER;

  function currentServer() {
    var v = (input.value || '').trim().replace(/\/+$/, '');
    return v || DEFAULT_SERVER;
  }
  function setStatus(text) { statusEl.textContent = text || ''; }

  document.getElementById('btn-save').addEventListener('click', function () {
    var v = currentServer();
    try { localStorage.setItem(KEY, v); } catch (e) { /* 忽略 */ }
    setStatus('已保存：' + v);
  });

  document.getElementById('btn-offline').addEventListener('click', function () {
    location.href = 'singleplayer.html';
  });

  document.getElementById('btn-online').addEventListener('click', function () {
    var url = currentServer();
    try { localStorage.setItem(KEY, url); } catch (e) { /* 忽略 */ }
    setStatus('正在连接 ' + url + ' …');
    location.href = url;
  });
})();
</script>
</body>
</html>
