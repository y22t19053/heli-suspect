<script>
"use strict";
/* =====================================================================
 * 《合理怀疑 · 世纪审判》单机渲染器 v2 —— 大更新版
 * 虚构"米合众国"联邦巡回法庭体系，四方法律团队对抗
 * 视觉：美漫硬边政治讽刺漫画 —— 报纸米黄底 + 粗黑描边 + 无渐变 + 大字海报
 * 动画：FX 队列引擎（翻牌/爆炸/新闻/计票柱/领奖台/阶段横幅/方向光束/数值飘字…）
 * 音效：WebAudio 合成器（无资源文件）
 * ===================================================================== */

/* ============================ 0. 工具 ============================ */
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function shuffle(arr){ for (let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return arr; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function easeOutBack(p){ const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2); }
function easeOutCubic(p){ return 1-Math.pow(1-p,3); }

/* 统一坐标系（P1-5）：不再用 1000×700 逻辑画布，画布尺寸 = 真实视口（含安全区），
 * 布局全部基于 W/H 计算（见 panelRect/rowLayout/...），与联机版同一套断点 */
let W = 0, H = 0;
const DPR = Math.min(2, window.devicePixelRatio || 1);
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

/* ============================ 1. 固定配色 · 阵营 ============================ */
/* PAL / PARTY_META 唯一源 = shared/theme.js（演播室深蓝 + 金），
 * 经 _build_ui.js 内联为下方 THEME 块；渲染层直接读全局。 */
/*__THEME_START__*/
/* ============================================================
 * shared/theme.js — 合理怀疑 · 全局主题唯一源（超级更新#3/#4）
 * 单主题：演播室深蓝 #0F1B2D + 法庭金 #FFD60A
 * （已删 PvZ 草地绿 / 旧报纸米黄风，双端共用一套）
 * ------------------------------------------------------------
 * 挂载方式（双挂载）：
 *   浏览器：window.PAL / window.PARTY_META / window.campColor ...
 *   Node：  module.exports = { PAL, PARTY_META, campColor, ... }
 * 阵营工具（campColor/campSoft/partyOf/campOf/contrast）唯一源在此，
 * 两端禁止另写副本；渲染层直接读全局（运行时自动取 view/game 数据源）。
 * ============================================================ */
(function (g) {
  'use strict';
  /* 四方法律团队：公诉方红 / 被告方蓝 / 第三方绿 / 第四方金 */
  const PARTY_META = {
    red:   { name: '公诉方律师团', sym: '检', col: '#FF3B30', soft: '#FFD9D2' },
    blue:  { name: '被告方律师团', sym: '辩', col: '#0A84FF', soft: '#CFE3FF' },
    green: { name: '第三方律师团', sym: '席', col: '#2FBF5F', soft: '#D0F5DD' },
    gold:  { name: '第四方律师团', sym: '议', col: '#FFC61A', soft: '#FFEEC9' }
  };
  const PAL = {
    bg:     { a: '#0F1B2D', b: '#1A2C44' },   // 演播室深海军蓝（对局背景 / 辩论台）
    ui:     { a: '#FFFFFF', b: '#F2E9D2' },    // 卡牌浅色（纸感，与深背景高对比）
    accent: { a: '#FFD60A', b: '#111111' },    // 金色行动按钮
    events: { a: '#14213D', b: '#FFD60A' },    // 事件牌深蓝 + 金
    reward: { a: '#FF9F0A', b: '#FFF3D0' },    // 奖励橙
    draft:  { a: '#0F1B2D', b: '#FFD60A' },    // 选角深蓝 + 金
    ink:    '#111111',
    grave:  '#5A5A5A',
    paper:  '#F6E9C8'
  };
  /* 未选定阵营时的兜底色板（按座位索引） */
  const FALLBACK_COL = ['#D82E2F', '#1E4FB5', '#0E8A5F', '#C78A1A'];
  const FALLBACK_SOFT = ['#F6C8C8', '#C8D6F2', '#C6EAD8', '#F2E2C0'];

  /* 运行时数据源：联机渲染读 view（makeView 防作弊视图），单机读 game。
   * 两端渲染层都有同名全局，theme 函数仅在被调用时读取，故加载顺序无关。 */
  function seatsOf() {
    if (typeof view !== 'undefined' && view && view.seats) return view.seats;
    if (typeof game !== 'undefined' && game && game.seats) return game.seats;
    return null;
  }

  /* 该座位当前阵营 key（'red'/'blue'/'green'/'gold'），未选角返回 null */
  function campOf(seat) {
    const seats = seatsOf();
    if (!seats || !seats[seat] || !seats[seat].camp) return null;
    return seats[seat].camp;
  }
  /* 阵营主色：已选角取 PARTY_META.col，否则按座位兜底 */
  function campColor(seat) {
    const c = campOf(seat);
    const m = c && PARTY_META[c];
    if (m) return m.col;
    return FALLBACK_COL[seat % 4];
  }
  /* 阵营浅色（面板底/卡背等） */
  function campSoft(seat) {
    const c = campOf(seat);
    const m = c && PARTY_META[c];
    if (m) return m.soft;
    return FALLBACK_SOFT[seat % 4];
  }
  /* 阵营元信息（名称/符号），未选角返回待定 */
  function partyOf(seat) {
    const c = campOf(seat);
    const m = c && PARTY_META[c];
    return m || { name: '待定', sym: '?' };
  }
  /* 对比色：深底用白字 / 浅底用黑字（自绘文本专用） */
  function contrast(hex) {
    const c = String(hex).replace('#', '');
    if (c.length < 6) return '#ffffff';
    const r = parseInt(c.substr(0, 2), 16), gg = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
    return (r * 0.299 + gg * 0.587 + b * 0.114) > 150 ? '#1a1a1a' : '#ffffff';
  }

  g.PARTY_META = PARTY_META;
  g.PAL = PAL;
  g.campOf = campOf;
  g.campColor = campColor;
  g.campSoft = campSoft;
  g.partyOf = partyOf;
  g.contrast = contrast;
  /* Node 双挂载（超级更新#3）：server/_test 等 require 时可用 */
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = { PARTY_META, PAL, campOf, campColor, campSoft, partyOf, contrast, FALLBACK_COL, FALLBACK_SOFT };
  }
})(typeof window !== 'undefined' ? window : globalThis);

/*__THEME_END__*/
/* campColor/campSoft/partyOf/contrast 唯一源 = 上方 THEME 块（shared/theme.js，
 * 超级更新#4），渲染层直接读全局；此处不再维护副本。 */

/* ============================ 2. 文字测量（P0：真实测量，取代估算） ============================ */
const _FONT_BASE = '"Microsoft YaHei","PingFang SC","Impact","Arial Black",sans-serif';
const _twCache = new Map();
const _fitCache = new Map();   // 顾问评审 8.2：fitText 同帧结果缓存（防重复循环测量）
function textWidth(text, font) {
  const k = font + '\u0000' + text;
  let v = _twCache.get(k);
  if (v === undefined) {
    // 只保存/恢复 font（save/restore 会快照整个画布状态栈，成本高；本函数只改 font）
    const prev = ctx.font;
    ctx.font = font;
    v = ctx.measureText(text).width;
    ctx.font = prev;
    if (_twCache.size > 6000) _twCache.clear();
    _twCache.set(k, v);
  }
  return v;
}
function fitText(text, maxW, size, o) {
  o = o || {};
  const key = String(text) + '|' + maxW + '|' + size + '|' + (o.bold === false ? '0' : '1');
  const hit = _fitCache.get(key);
  if (hit) return { text: hit.text, size: hit.size, w: hit.w };
  let s = Math.max(9, size), t = String(text);
  const bold = o.bold === false ? '' : '700 ';
  const fontFor = ss => bold + ss + 'px ' + _FONT_BASE;
  while (s > 9 && textWidth(t, fontFor(s)) > maxW) s -= 0.5;
  while (t.length > 1 && textWidth(t + '…', fontFor(s)) > maxW) t = t.slice(0, -1);
  if (t !== String(text) && textWidth(t + '…', fontFor(s)) <= maxW) t += '…';
  const r = { text: t, size: s, w: textWidth(t, fontFor(s)) };
  if (_fitCache.size > 2000) _fitCache.clear();
  _fitCache.set(key, r);
  return r;
}
/* ============================ 3. 绘制原语 ============================ */
function drawPixelText(text, x, y, size, color, o){
  o = o || {};
  size = Math.max(5, size);
  ctx.save();
  // 粗细统一：全部 700+，避免 600/700 跳变发虚；描边随字号精细缩放
  // P0-4a：≤13px 一律无粗体、无描边，靠对比色区分；大字保留美漫粗描边
  const small = size <= 13;
  const bold = (small || o.bold === false ? '' : '700 ');
  ctx.font = bold + size + 'px ' + _FONT_BASE;
  ctx.textBaseline = 'middle';
  ctx.textAlign = o.align === 'center' ? 'center' : (o.align === 'right' ? 'right' : 'left');
  if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;
  if (!small && o.shadow !== false){
    ctx.lineWidth = o.lineW !== undefined ? o.lineW : Math.max(0.8, size / 12);
    ctx.lineJoin = 'miter';
    ctx.strokeStyle = o.outline || '#111111';
    ctx.strokeText(text, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
  return { w: Math.round(textWidth(text, bold + size + 'px ' + _FONT_BASE)), h: Math.round(size * 1.4) };
}
function drawWrapText(text, x, y, size, color, maxWidth, lineH, o){
  o = o || {};
  const bold = o.bold === false ? '' : '700 ';
  const font = bold + size + 'px ' + _FONT_BASE;
  const lh = lineH || Math.round(size * 1.32);
  const maxLines = o.maxLines || 12;
  const lines = [];
  let rest = text;
  while (rest.length > 0 && lines.length < maxLines){
    let take = rest.length;
    while (take > 1 && textWidth(rest.slice(0, take), font) > maxWidth) take--;
    if (take <= 0) take = 1;
    if (take < rest.length){
      // 向回找最近的标点（含空格），在它后面断开
      for (let i = take - 1; i > Math.max(0, take - 8); i--){
        if (/[，。；：、！？,.!?;: \u00b7·]/.test(rest[i])){ take = i + 1; break; }
      }
    }
    lines.push(rest.slice(0, take));
    rest = rest.slice(take);
  }
  if (rest.length > 0 && lines.length === maxLines){
    const f = fitText(lines[lines.length - 1] + '…', maxWidth, size, { bold: o.bold === false ? false : true });
    lines[lines.length - 1] = f.text;
  }
  lines.forEach((ln, i) => drawPixelText(ln, x, y + i * lh - (lines.length - 1) * lh / 2, size, color, o.shadow === false ? { shadow: false } : { shadow: true }));
  return lines.length * lh;
}
function pxRect(x, y, w, h, col){
  ctx.save(); ctx.fillStyle = col; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); ctx.restore();
}
function jaggedRectPath(x, y, w, h, j){
  j = Math.max(1, j == null ? 2 : j);
  const rnd = Math.floor(x * 13 + y * 7 + w * 3 + h * 5);
  const n = 4;
  const jx = (i, t) => x + w * t + (((rnd + i * 3) % 5) - 2) * j * 0.4;
  const jy = (i, t) => y + h * t + (((rnd + i * 7) % 3) - 1) * j * 0.5;
  ctx.beginPath();
  ctx.moveTo(x, y);
  for (let i = 1; i <= n; i++) ctx.lineTo(jx(i, i / n), jy(i, 0));
  ctx.lineTo(x + w, y);
  for (let i = 1; i <= n; i++) ctx.lineTo(jx(i, 1), jy(i, i / n));
  ctx.lineTo(x + w, y + h);
  for (let i = 1; i <= n; i++) ctx.lineTo(jx(i, 1 - i / n), jy(i, 1));
  ctx.lineTo(x, y + h);
  for (let i = 1; i <= n; i++) ctx.lineTo(jx(i, 0), jy(i, 1 - i / n));
  ctx.closePath();
}
function pxBorder(x, y, w, h, col, t){
  t = clamp(Math.max(1.5, t || 2), 1.5, 6);
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = t; ctx.lineJoin = 'miter'; ctx.lineCap = 'butt';
  jaggedRectPath(x + t/2, y + t/2, w - t, h - t, 2); ctx.stroke();
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = Math.max(1, t * 0.55);
  const in2 = t * 1.9;
  jaggedRectPath(x + in2, y + in2, w - in2 * 2, h - in2 * 2, 1); ctx.stroke();
  ctx.restore();
}
function comicShadow(x, y, w, h, dx, dy){
  ctx.save(); ctx.fillStyle = 'rgba(10,10,10,0.28)'; ctx.fillRect(Math.round(x + (dx||4)), Math.round(y + (dy||4)), Math.round(w), Math.round(h)); ctx.restore();
}
function btn(x, y, w, h, label, col, enabled){
  enabled = enabled !== false;
  return { x, y, w, h, label, col: col || PAL.ui.a, enabled };
}
function drawBtn(b){
  ctx.save();
  ctx.globalAlpha = b.enabled ? 1 : 0.42;
  // 三态：常态 / 悬停（金色边框+微光+上浮）/ 禁用（透明灰）
  const hov = b.enabled && mouse.x >= b.x - 3 && mouse.x <= b.x + b.w + 3 && mouse.y >= b.y - 3 && mouse.y <= b.y + b.h + 3;
  comicShadow(b.x, b.y, b.w, b.h, hov ? 5 : 3, hov ? 5 : 3);
  if (b.primary){
    // 演播室主按钮：法庭红渐变（开庭审理）
    const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    g.addColorStop(0, '#FF5A4E'); g.addColorStop(1, '#D63A2B');
    ctx.fillStyle = g;
    ctx.fillRect(Math.round(b.x), Math.round(b.y), Math.round(b.w), Math.round(b.h));
    if (hov){ ctx.globalAlpha = 0.22; pxRect(b.x, b.y, b.w, b.h, '#FFFFFF'); ctx.globalAlpha = b.enabled ? 1 : 0.42; }
    pxBorder(b.x, b.y, b.w, b.h, hov ? '#FFD60A' : '#111111', hov ? 4 : 3);
    drawPixelText(b.label, b.x + b.w/2, b.y + b.h/2 - (hov ? 1.5 : 0), b.h * 0.42, '#FFFFFF', { align: 'center', shadow: false });
  } else if (b.wood){
    // 演播室金按钮：金色渐变（主菜单常规操作）
    const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    g.addColorStop(0, hov ? '#FFF3B0' : '#FFD60A'); g.addColorStop(1, '#E8B33E');
    ctx.fillStyle = g;
    ctx.fillRect(Math.round(b.x), Math.round(b.y), Math.round(b.w), Math.round(b.h));
    if (hov){ ctx.globalAlpha = 0.22; pxRect(b.x, b.y, b.w, b.h, '#FFFFFF'); ctx.globalAlpha = b.enabled ? 1 : 0.42; }
    pxBorder(b.x, b.y, b.w, b.h, hov ? '#FFFFFF' : '#111111', hov ? 4 : 3);
    drawPixelText(b.label, b.x + b.w/2, b.y + b.h/2 - (hov ? 1.5 : 0), b.h * 0.42, '#111111', { align: 'center', shadow: false });
  } else {
    pxRect(b.x, b.y, b.w, b.h, b.col);
    if (hov){ ctx.globalAlpha = 0.22; pxRect(b.x, b.y, b.w, b.h, '#FFFFFF'); ctx.globalAlpha = 1; }
    pxBorder(b.x, b.y, b.w, b.h, hov ? '#FFD60A' : '#111111', hov ? 4 : 2.5);
    drawPixelText(b.label, b.x + b.w/2, b.y + b.h/2 - (hov ? 1.5 : 0), b.h * 0.42, contrast(b.col), { align: 'center', shadow: false });
  }
  ctx.restore();
}
function inBtn(b, x, y){ return b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }

/* 报纸网点暗纹（美漫底色） */
function drawBg(theme){
  pxRect(0, 0, W, H, theme.a);
  // 低画质（LOW_Q）：跳过网点装饰，保帧率（顾问评审 8.1）
  if (LOW_Q) return;
  ctx.save();
  ctx.fillStyle = theme.b;
  ctx.globalAlpha = 0.35;
  // 对角斜块装饰
  ctx.fillRect(0, 0, W, 8);
  ctx.fillRect(0, H - 8, W, 8);
  // 网点
  ctx.globalAlpha = 0.10;
  ctx.fillStyle = '#111111';
  for (let gy = 20; gy < H; gy += 34){
    for (let gx = 14; gx < W; gx += 30){
      ctx.fillRect(gx, gy, 2, 2);
    }
  }
  ctx.restore();
}

/* ============================ 3. 音效（WebAudio 合成） ============================ */
let AC = null;
function sfx(name){
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    const osc = (type, f0, f1, dur, vol, delay) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t + (delay||0));
      if (f1 !== undefined) o.frequency.exponentialRampToValueAtTime(Math.max(30,f1), t + (delay||0) + dur);
      g.gain.setValueAtTime(0.0001, t + (delay||0));
      g.gain.exponentialRampToValueAtTime(vol, t + (delay||0) + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (delay||0) + dur);
      o.connect(g); g.connect(AC.destination);
      o.start(t + (delay||0)); o.stop(t + (delay||0) + dur + 0.05);
    };
    const noise = (dur, vol, delay) => {
      const len = Math.max(1, Math.floor(AC.sampleRate * dur));
      const buf = AC.createBuffer(1, len, AC.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * (1 - i/len);
      const src = AC.createBufferSource(), g = AC.createGain();
      src.buffer = buf; g.gain.value = vol;
      src.connect(g); g.connect(AC.destination);
      src.start(t + (delay||0));
    };
    switch (name){
      case 'click': osc('square', 520, 300, 0.06, 0.12); break;
      case 'flip':  osc('square', 720, 260, 0.11, 0.13); noise(0.08, 0.05); break;
      case 'swoosh': noise(0.28, 0.10); osc('sawtooth', 300, 900, 0.28, 0.06); break;
      case 'boom':  noise(0.5, 0.30); osc('sine', 140, 38, 0.5, 0.35); osc('square', 90, 30, 0.5, 0.12); break;
      case 'gavel':  noise(0.16, 0.20); osc('triangle', 210, 60, 0.30, 0.30); osc('square', 120, 40, 0.28, 0.10); break;   // 法槌：低闷重击
      case 'coin':  osc('square', 1180, 1180, 0.08, 0.12); osc('square', 1568, 1568, 0.12, 0.10, 0.08); break;
      case 'news':  osc('sawtooth', 620, 880, 0.28, 0.12); osc('sawtooth', 880, 620, 0.28, 0.12, 0.30); osc('sawtooth', 620, 880, 0.28, 0.12, 0.60); break;
      case 'star':  osc('triangle', 660, 990, 0.14, 0.12); osc('triangle', 990, 1320, 0.14, 0.10, 0.12); break;
      case 'shatter': noise(0.22, 0.16); osc('square', 400, 120, 0.18, 0.08); break;
      case 'win':   [523,659,784,1046].forEach((f,i)=>osc('triangle', f, f, 0.22, 0.13, i*0.13)); break;
      case 'boo':   osc('sawtooth', 180, 120, 0.35, 0.10); noise(0.25, 0.06); break;
      case 'hover': osc('sine', 1900, 2400, 0.03, 0.035); break;   // 悬停滴答：极短、极轻
      case 'paper': noise(0.09, 0.05); osc('triangle', 500, 900, 0.08, 0.05); noise(0.13, 0.04, 0.06); break;  // 纸页翻动（刷新市场）
    }
  } catch(e){ /* 静音兜底 */ }

/* 移动端触觉反馈（D 类审查）：iOS 不支持 vibrate 时自动忽略；节流防连发 */
let lastHapticT = 0;
function haptic(ms){
  try {
    if (!navigator.vibrate) return;
    const now = Date.now();
    if (now - lastHapticT < 60) return;   // 节流：60ms 内最多一次
    lastHapticT = now;
    navigator.vibrate(ms || 10);
  } catch(e){ /* 触觉不可用则忽略 */ }
}

/* ============================ 4. FX 动画引擎 ============================ */
/* #60/#61：对象池复用 + 总量上限 + 高负载自动降级（低端机/移动端优化）
 * 顾问评审 8.1：主动低画质（不再等 FX 超载被动减速）——低内存（deviceMemory<=2）
 * 或低核（4 核内）移动设备，开局即降级：FX 上限减半、粒子密度减半、背景网点跳过、
 * 大字描边关闭。isMobile 在后文定义（TDZ），LOW_Q/FX_MAX 在此声明、isMobile 后评估。 */
const FX = [];
let shakeAmp = 0;
let LOW_Q = false;            // 主动低画质：在 isMobile 定义后评估（见 resize 前）
let FX_MAX = 48;              // FX 总量上限：超出丢弃最旧（防粒子爆炸拖垮低端机）
let fxLowQ = LOW_Q;           // 低质量模式：降级粒子密度/跳过重特效
const _fxPool = [];           // FX 对象池：复用对象，减少每帧 GC 压力
function recycleFx(f){ for (const k in f) delete f[k]; if (_fxPool.length < 32) _fxPool.push(f); }
let waitUntil = 0;             // 动画演出期：暂停引擎推进
function hold(ms){ waitUntil = Math.max(waitUntil, performance.now() + ms); }
function addFx(f){
  const obj = _fxPool.pop() || {};   // 从池取空对象复用，避免反复分配
  for (const k in f) obj[k] = f[k];
  obj.t = 0; obj.dur = f.dur || 800;
  if (FX.length >= FX_MAX){ const old = FX.shift(); recycleFx(old); }
  FX.push(obj);
  return obj;
}
function updateFx(dt){
  for (let i = FX.length - 1; i >= 0; i--){
    const f = FX[i];
    f.t += dt;
    if (f.t - (f.delay || 0) >= f.dur){ FX.splice(i, 1); recycleFx(f); }
  }
  shakeAmp *= 0.86;
  if (shakeAmp < 0.4) shakeAmp = 0;
  // #60：移动端 FX 高负载 → 自动降级粒子密度，保帧率（主动低画质设备恒为 true）
  fxLowQ = LOW_Q || (isMobile && FX.length > 24);
}
function ttOf(f){ return Math.max(0, f.t - (f.delay || 0)); }
function renderFx(){
  for (const f of FX) drawFx(f);
}
function drawFx(f){
  const tt = ttOf(f);
  const p = clamp(tt / f.dur, 0, 1);

    case 'flipSeq': {

        const prog = clamp((tt - i * 140) / 300, 0, 1);
        if (prog <= 0 || prog >= 1) return;
        const cx = it.x + it.w / 2;
        const s = Math.cos(prog * Math.PI);

        ctx.translate(cx, it.y + it.h / 2);
        ctx.scale(s, 1);
        if (prog < 0.5){

        } else {
          UIKit.drawCard(ctx, -it.w/2, -it.h/2, it.w, it.h, it.card, { col: it.seat === mySeat ? campSoft(it.seat) : '#f6e9c8' });
        }
        ctx.restore();
      });
      break;
    }
    /* ---- 作废爆炸（证据排除） ---- */
    case 'boom': {
      const cx = f.x + f.w/2, cy = f.y + f.h/2;
      const R = f.w * 0.9 * easeOutCubic(p);

    case 'news': {

      pxRect(-20, by, bw, bh, '#FFD60A');
      ctx.save();
      ctx.beginPath(); ctx.rect(-20, by, bw, bh); ctx.clip();
      for (let i = -2; i < 20; i += 2){

        ctx.beginPath();
        ctx.moveTo(i * 46, by - 20); ctx.lineTo(i * 46 + 23, by + bh + 20); ctx.lineTo(i * 46 + 46, by + bh + 20); ctx.lineTo(i * 46 + 23, by - 20);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
      pxBorder(-20, by, bw, bh, '#111111', 3);
      drawPixelText('⚡ BREAKING NEWS ⚡', W/2, by + bh/2, 26, '#111111', { align: 'center', shadow: false });
      // 标题砸入

        ctx.translate(W/2, ty); ctx.scale(sc, sc);

        pxBorder(-W/2, -26, W, 52, '#FFD60A', 3);
        drawPixelText(f.title, 0, 2, 30, '#FFFFFF', { align: 'center' });

      else if (p > 0.45 && p < 0.6){ ctx.save(); ctx.globalAlpha = (0.6 - p) / 0.15 * 0.22; pxRect(0, 0, W, H, '#E6392F'); ctx.restore(); }
      pxRect(0, 0, W, H, 'rgba(10,12,20,0.42)');
      ctx.translate(W/2, H * 0.32);
      ctx.scale(easeOutBack(inP), easeOutBack(inP));

      pxBorder(-W * 0.38, -36, W * 0.76, 72, '#FFD60A', 5);

      const cx = W - 262, cy = 64, cw = 252, chh = 150;

    }

    case 'podium': {

      const a = p < 0.08 ? p/0.08 : (p > 0.9 ? (1-p)/0.1 : 1);

      drawPixelText('本轮排名', cx + cw/2, cy + 16, 17, '#FFD60A', { align: 'center', shadow: false });
      const order = f.order; // [{seat,name,partyCol}]

      order.forEach((o, i) => {

    case 'rollNum': {

      let sx = 0;
      g.seats.forEach((s, i) => {
        const w2 = Math.max(2, Math.round(W * ((s.support || 0) / tot)));
        pxRect(sx, tY, w2, tH, env.campColor(i));
        sx += w2;
      });
    } else if (copy.trackElse) {
      copy.trackElse(tY, tH);
    } else {
      pxRect(0, tY, W * 0.5, tH, '#FF3B30');
      pxRect(W * 0.5, tY, W * 0.5, tH, '#0A84FF');
    }
    // 观战守卫：旁观者跳过玩家侧信息
    if (copy.isSpectator && copy.isSpectator()) {
      drawPixelText('👁 旁观中', W - 14, HUD_H / 2, 16, '#5AC8FA', { align: 'right', shadow: false });
      return;
    }
    // 起始玩家
    const sp = copy.startPos || { x: W - 14, y: HUD_H / 2, size: 16 };
    drawPixelText(copy.startTxt ? copy.startTxt(g) : '', sp.x, sp.y, sp.size, '#FFD60A', { align: 'right', shadow: false });
    // 单机排名横幅
    if (copy.rankBanner) copy.rankBanner(g);
    // 联机行动倒计时
    if (copy.countdown) copy.countdown();
    // 阶段进度条
    const steps = env.PHASE_STEPS || [];
    const idx = steps.findIndex(s => s[0] === g.phase);
    if (idx >= 0) {
      const sb = copy.stepBar || {};
      const maxW = sb.maxW || 30, baseW = sb.baseW || 320;
      let stepW = sb.mobile ? sb.mobile : Math.min(maxW, (W - baseW) / steps.length - 3);
      stepW = clamp(stepW, 2, maxW);
      let sx = sb.sx0 ? sb.sx0() : Math.max(76, 148);
      const availR = sb.availR ? sb.availR() : (W - 88);
      if (sx + steps.length * (stepW + 3) > availR) {
        stepW = Math.max(2, (availR - sx - (steps.length - 1) * 3) / steps.length);
      }
      steps.forEach((s, i) => {
        const active = i === idx;
        pxRect(sx, HUD_H - 16, stepW, 9, active ? '#FFD60A' : i < idx ? '#4A9A5A' : '#39425A');
        pxBorder(sx, HUD_H - 16, stepW, 9, '#111111', 1);
        sx += stepW + 3;
      });
      if (idx < steps.length - 1 && (!sb.nextGuard || sb.nextGuard(sx))) {
        drawPixelText('下一步：' + steps[idx + 1][1], sx + (sb.nextDX || 6), HUD_H - 11, sb.nextSize ? sb.nextSize() : 12, sb.nextCol || '#DCE6F5', { shadow: false });
      }
    }
  };

  /* 顶部座位面板（统一两端 renderPanels，P1-7 双端合一）
   * 骨架唯一：vm 投影 → 逐座位画面板 → 紧凑/非紧凑两布局 → 数值流(panelFlow) → 事件目标/起始选择
   * 差异经 copy 注入：
   *   panelBg     —— 面板底色（联机 '#F2E9D2' / 单机 '#efe6cd'）
   *   panelBorder —— 边框 (isAct)=>{col,w}（联机恒黑 2 / 单机活动红边 3）
   *   screenGuard —— 联机需 screen==='game' 前置（联机 true / 单机 false）
   *   charBrief(s)—— 非紧凑角色文本（联机 '检方·名' / 单机 '检方·名 · 技能简述'）
   *   charSize/charCol —— 角色名字号/颜色（联机 10.5 '#C0392B' / 单机 10 '#D82E2F'）
   *   scandalZero —— 丑闻 0 值是否显示灰标（联机 true / 单机 false 仅 >0）
   *   scandalCol  —— 丑闻红（联机 '#E04343' / 单机 '#E6392F'）
   *   actCol      —— ⚡举证中/▶行动中（联机 '#FF5A4E' / 单机 '#E6392F'）
   *   lockShow    —— 🔒门控 (s,isMe,g)（联机 UI.show.locked&&count / 单机 count&&(isMe||phase!=='buy')）
   *   lockCol     —— 🔒色（联机 '#0A84FF' / 单机 '#1E4FB5'）
   *   scandalBar  —— 丑闻条门控 (s,sc)（联机 UI.show.scandalBar / 单机 sc>0）
   *   pickCol     —— 事件目标边框（联机 '#FF5A4E' / 单机 '#E6392F'）
   *   starterGuard—— chooseStarter 需 !g.starterChosen（联机 true / 单机 false）
   *   pickBtn(x,y,w,h,kind,data) —— 选择点击注册（联机仅 hoverCards / 单机 btn+buttons） */
  RC.renderPanelsOf = function (env) {
    const ctx = env.ctx, W = env.W;
    const vm = env.vm();
    if (!vm) return;
    const g = vm.meta;
    const seats = vm.seats;
    const n = seats.length;
    const ph = env.panelHeight();
    const act = RC.currentActSeatOf(env);
    const copy = env.copy || {};
    const show = env.UI.show;
    const fontBase = env.fontBase || '"Microsoft YaHei","PingFang SC",sans-serif';
    for (let i = 0; i < n; i++) {
      const s = seats[i];
      const pr = env.panelRect(i);
      if (!pr) continue;
      const { x, y, w } = pr;
      const isMe = i === env.mySeat;
      const crown = vm.hud.leader === i ? ' 👑' : '';
      const focusPhase = g.phase === 'buy' || g.phase === 'play' || g.phase === 'discard' || g.phase === 'preEvent' || g.phase === 'postEvent';
      const focusDim = (copy.screenGuard === false || env.screen === 'game') && focusPhase && !RC.myTurnOf(env) && !isMe && act !== i;
      if (focusDim) { ctx.save(); ctx.globalAlpha = 0.4; }
      pxRect(x, y, w, ph - 4, isMe ? campSoft(i) : (copy.panelBg || '#F2E9D2'));
      const brd = copy.panelBorder ? copy.panelBorder(act === i) : { col: '#111111', w: 2 };
      pxBorder(x, y, w, ph - 4, brd.col, brd.w);
      const sc = s.scandal || 0;
      const isActing = act === i;
      const isPlayAct = isActing && g.phase === 'play';
      const inPlay = g.phase === 'play' && g.playLastSeat === i;
      /* 数值流（行2）：钱/支持/丑闻/手牌/锁（状态标签独立绘制，不再挤入文字流防遮挡） */
      const flow = [];
      flow.push({ txt: '⊙' + s.money, col: '#B8860B' });
      flow.push({ txt: '⚖' + s.support, col: '#111111' });
      if (sc > 0 || copy.scandalZero) flow.push({ txt: '😈' + sc, col: sc > 0 ? (copy.scandalCol || '#E04343') : '#8A8A8A' });
      if (show.handN && isMe) flow.push({ txt: '手牌' + s.handCount, col: '#333333' });
      if (copy.lockShow ? copy.lockShow(s, isMe, g) : (show.locked && s.lockedCount)) flow.push({ txt: '🔒' + s.lockedCount, col: copy.lockCol || '#0A84FF' });
      if (env.compact) {
        const av = 14, avY = y + 1;
        const pt = partyOf(i);
        pxRect(x + 6, avY, av, av, campColor(i));
        pxBorder(x + 6, avY, av, av, '#111111', 2);
        drawPixelText(pt.sym, x + 6 + av / 2, avY + av / 2, 9, contrast(campColor(i)), { align: 'center', shadow: false });
        // 行1：名字（大）+ 阵营
        let nx1 = x + 24;
        const nmR1 = drawPixelText(s.name + (isMe ? '（你）' : '') + crown, nx1, y + 12, 12, '#111111', { shadow: false });
        nx1 += nmR1.w + 4;
        if (s.side) drawPixelText(s.side === 'prosecutor' ? '·检方' : '·辩护方', nx1, y + 12, 9, s.side === 'prosecutor' ? '#D82E2F' : '#2F6FD8', { shadow: false });
        // 行2：角色名（红）→ 数值流 → 状态标签
        let nx2 = x + 8;
        if (s.char) {
          const fCh = fitText(copy.charBrief ? copy.charBrief(s) : ((s.side === 'prosecutor' ? '检方·' : '辩方·') + s.char.name), Math.max(30, w * 0.22), 10);
          drawPixelText(fCh.text, nx2, y + ph - 6, fCh.size, copy.charCol || '#C0392B', { shadow: false });
          nx2 += fCh.w + 12;
          env.hoverCards.push({ x: nx2 - fCh.w - 12, y: y + 10, w: Math.min(170, w * 0.34), h: 16, kind: 'charSkill', data: { ch: s.char } });
        }
        const nxF = RC._panelFlowOf(env, nx2, y + ph - 6, Math.max(9.5, env.UI.fs.num - 1), flow);
        if (isActing) RC._statusTagOf(env, nxF + 4, y + ph - 6, isPlayAct ? '⚡ 举证中' : '▶ 行动中', 9.5);
      } else {
        const av = 18, avY = y + 2;
        const pt = partyOf(i);
        pxRect(x + 6, avY, av, av, campColor(i));
        pxBorder(x + 6, avY, av, av, '#111111', 2);
        drawPixelText(pt.sym, x + 6 + av / 2, avY + av / 2, 10.5, contrast(campColor(i)), { align: 'center', shadow: false });
        // 行1：头像 + 名字（大粗）+ 阵营 + 角色名（红）
        let nx1 = x + 30;
        const nmR2 = drawPixelText(s.name + (isMe ? '（你）' : '') + crown, nx1, y + 15, Math.min(16, env.UI.fs.name + 1), '#111111', { shadow: false });
        nx1 += nmR2.w + 6;
        if (s.side) drawPixelText(s.side === 'prosecutor' ? '·检方' : '·辩护方', nx1, y + 15, 11, s.side === 'prosecutor' ? '#D82E2F' : '#2F6FD8', { shadow: false });
        if (s.char) {
          const fCh2 = fitText(copy.charBrief ? copy.charBrief(s) : ((s.side === 'prosecutor' ? '检方·' : '辩方·') + s.char.name), Math.max(30, w * 0.26), 11.5);
          drawPixelText(fCh2.text, x + 30, y + 15, fCh2.size, copy.charCol || '#C0392B', { shadow: false });
          env.hoverCards.push({ x: x + 30, y: y + 8, w: Math.min(170, w * 0.34), h: 16, kind: 'charSkill', data: { ch: s.char } });
        }
        // 行1 右侧徽章：陪审 / 先例（右对齐）
        let rx = x + w - 10;
        if (show.jury && s.juryTokens > 0) {
          const t1 = '🕊' + s.juryTokens + '/3';
          rx -= textWidth(t1, '700 12px ' + fontBase) + 10;
          drawPixelText(t1, rx, y + 15, 12, '#7B4FC9', { shadow: false });
        }
        if (show.prev && g.precedentSeat === i) {
          const t2 = '⚖️先例';
          rx -= textWidth(t2, '700 12px ' + fontBase) + 10;
          drawPixelText(t2, rx, y + 15, 12, '#7B4FC9', { shadow: false });
        }
        // 行2：数值流（大粗）→ 状态标签（红底白字，醒目）
        const nx2 = RC._panelFlowOf(env, x + 8, y + ph - 6, 13, flow);
        if (isActing) RC._statusTagOf(env, nx2 + 6, y + ph - 6, isPlayAct ? '⚡ 举证中' : '▶ 行动中', 11);
        // 行2 右侧：丑闻条（右对齐，不再压数值流）+ 结案陈词
        if (copy.scandalBar ? copy.scandalBar(s, sc) : show.scandalBar) {
          const sbx = x + w - (inPlay ? 116 : 62);
          pxRect(sbx, y + ph - 16, 46, 7, '#3A2A2A');
          pxBorder(sbx, y + ph - 16, 46, 7, '#111111', 1);
          if (sc > 0) {
            const scCol = sc <= 1 ? '#7DCEA0' : (sc <= 3 ? '#F1C40F' : (copy.scandalCol || '#E04343'));
            pxRect(sbx + 2, y + ph - 14, Math.max(2, 42 * Math.min(1, sc / 5)), 3, scCol);
          }
        }
        if (inPlay) drawPixelText('🎙 结案陈词', x + w - 14, y + ph - 6, 12, '#B8860B', { align: 'right', shadow: false });
      }
      // 事件目标选择 / 选择起始玩家（点击头像）
      const avX = 6, avY2 = env.compact ? y + 1 : y + 2, avSz = env.compact ? 14 : 18;
      if ((g.phase === 'preEvent' || g.phase === 'postEvent') && env.eventPick && env.eventPick.seat === env.mySeat && i !== env.mySeat) {
        pxBorder(x + 4, y + 2, avSz + 4, avSz + 4, copy.pickCol || '#FF5A4E', 4);
        env.hoverCards.push({ x: x + avX, y: avY2, w: avSz, h: avSz, kind: 'eventTarget', data: { targetSeat: i } });
        if (copy.pickBtn) copy.pickBtn(x + avX, avY2, avSz, avSz, 'eventTarget', i);
      }
      if (g.phase === 'chooseStarter' && g.starterPicker === env.mySeat && (copy.starterGuard === false || !g.starterChosen)) {
        pxBorder(x + 4, y + 2, avSz + 4, avSz + 4, '#FFD60A', 4);
        env.hoverCards.push({ x: x + avX, y: avY2, w: avSz, h: avSz, kind: 'starter', data: { starterSeat: i } });
        if (copy.pickBtn) copy.pickBtn(x + avX, avY2, avSz, avSz, 'starter', i);
      }
      if (focusDim) ctx.restore();
    }
  };

  /* 状态标签：红底白字（▶ 行动中 / ⚡ 举证中 醒目；替代挤进文字流易被遮挡的方案） */
  RC._statusTagOf = function (env, tx, ty, txt, size) {
    const ctx = env.ctx;
    const fontBase = env.fontBase || '"Microsoft YaHei","PingFang SC",sans-serif';
    const tw = textWidth(txt, '700 ' + size + 'px ' + fontBase) + 10;
    pxRect(tx, ty - size - 1, tw, size * 2 + 3, '#E04343');
    pxBorder(tx, ty - size - 1, tw, size * 2 + 3, '#111111', 1);
    drawPixelText(txt, tx + tw / 2, ty, size, '#FFFFFF', { align: 'center', shadow: false });
    return tw + 6;
  };

  /* 数值流式布局（原联机本地 panelFlow，P1-7 收敛至此；单机经 copy 保持固定坐标差异由 flow 内容表达） */
  RC._panelFlowOf = function (env, nx, y, size, items) {
    const W = env.W;
    const bold = '700 ';
    const gap = 12;
    for (const it of items) {
      const w2 = textWidth(it.txt, bold + size + 'px ' + env.fontBase) + gap;
      if (nx + w2 > W - 14) break;
      drawPixelText(it.txt, nx, y, size, it.col, { shadow: false });
      nx += w2;
    }
    return nx;
  };

  /* 底部大卡牌区（统一两端 renderBottom，P1-7 双端合一）
   * 骨架唯一：底台 → 观战守卫 → buy/事件/手牌三分支 → renderActionButtons
   * 差异经 env/copy 注入：
   *   env.marketSlots(me)  —— 证物架槽（联机 marketSlotRects / 单机 marketLayout）
   *   env.eventSlots()     —— 事件卡槽（联机 eventSlotRects / 单机 eventLayout）
   *   env.navBtn(id,x,y,w,h,text,enabled) —— 翻页按钮（联机 addButton / 单机 btn+drawBtn）
   *   env.canClickHand(c)/isEventUsable(ev)/renderActionButtons(me) —— 行为双端各自
   *   copy.marketTitleCol/pageCol/emptyCol/handTitleCol/handTitleSize/handSelCol/handEmptyCol/handEmptySize
   *   copy.marketCardAnim/eventCardAnim/handCardAnim —— 单机入场动画包裹（联机无）
   *   copy.marketBtn/eventBtn/handBtn —— 单机按钮注册（联机无）
   *   copy.hoverAll —— hoverCards 恒 push（单机 true / 联机仅可用时）
   *   copy.handMinH —— 手牌区最小高度（联机 64 / 单机 compact?64:100）
   *   copy.flexReserve —— flexRects 右侧预留（联机 0 / 单机 bottomReserve()） */
  RC.renderBottomOf = function (env) {
    const ctx = env.ctx, W = env.W, H = env.H;
    const g = env.G();
    if (!g) return;
    const me = g.seats[env.mySeat];
    const y0 = H - env.HAND_AREA_H;
    pxRect(6, y0 + 2, W - 12, env.HAND_AREA_H - 8, 'rgba(16,20,28,0.88)');
    pxBorder(6, y0 + 2, W - 12, env.HAND_AREA_H - 8, '#3A4258', 2);
    if (!me) {
      drawPixelText('👁 观战中 · 不参与对局', W / 2, y0 + env.HAND_AREA_H / 2 - 12, 24, '#FFD60A', { align: 'center', shadow: false });
      drawPixelText('当前阶段：' + (g.phaseLabel || g.phase), W / 2, y0 + env.HAND_AREA_H / 2 + 18, 15, '#CDD8E8', { align: 'center', shadow: false });
      return;
    }
    const showEvents = g.phase === 'preEvent' || g.phase === 'postEvent';
    const showHand = g.phase === 'play' || g.phase === 'discard';
    if (g.phase === 'buy') {
      RC._renderMarketOf(env, me, y0);
    } else if (showEvents) {
      RC._renderEventsOf(env, me, y0);
    } else if (showHand) {
      RC._renderHandOf(env, me, y0);
    }
    if (env.renderActionButtons) env.renderActionButtons(me);
  };

  /* 证物架：标题 + 槽位卡片（点牌传唤/留证）
   * actH（Task 5 竖屏固定操作栏高）：内容区下移让位 */
  RC._renderMarketOf = function (env, me, y0) {
    const ctx = env.ctx, W = env.W;
    const copy = env.copy || {};
    const actH = env.actH || 0;
    const x = 10, y = y0 + 28 + actH, w = env.portraitMode ? W - 20 : W - 260, h = env.HAND_AREA_H - 40 - actH;
    drawPixelText(env.buyMode === 'lock' ? '🔒 留证模式（点牌留证）' : '证物架 · 点牌传唤（⊙' + me.money + '）', 10, y0 + 12 + actH, 14, copy.marketTitleCol || '#FFD60A', { shadow: false });
    (env.marketSlots ? env.marketSlots(me) : []).forEach(r => {
      const card = r.card;
      const locked = me.lockedUids.indexOf(card.uid) >= 0;
      const cost = ElectionCore.buyCostOf(me, card);
      const afford = me.money >= cost;
      const draw = () => {
        ctx.save();
        // *= 而非 =：单机 marketCardAnim 先设入场淡入 alpha，此处相乘保留淡入效果
        ctx.globalAlpha *= (locked ? 1 : (afford ? 1 : 0.55));
        UIKit.drawCard(ctx, r.x, r.y, r.w, r.h, card, { col: locked ? '#cfc3f2' : '#f6e9c8' });
        ctx.restore();
      };
      if (copy.marketCardAnim) copy.marketCardAnim(r.x, r.y, r.w, r.h, card, draw);
      else draw();
      if (locked) drawPixelText('🔒', r.x + r.w / 2, r.y + r.h * 0.4, 18, '#1E4FB5', { align: 'center', shadow: false });
      env.hoverCards.push({ x: r.x, y: r.y, w: r.w, h: r.h, kind: 'market', data: { card, uid: card.uid } });
      if (copy.marketBtn) copy.marketBtn(r.x, r.y, r.w, r.h, card);
    });
  };

  /* 事件牌区：翻页 + 事件卡（可用于目标选择）
   * actH（Task 5 竖屏固定操作栏高）：内容区下移让位 */
  RC._renderEventsOf = function (env, me, y0) {
    const ctx = env.ctx, W = env.W;
    const copy = env.copy || {};
    const actH = env.actH || 0;
    const evs = me.events || [];
    const maxPage = Math.max(0, Math.ceil(evs.length / 4) - 1);
    let ep = env.eventPage();
    if (ep > maxPage) { ep = maxPage; env.setEventPage(ep); }
    drawPixelText('事件牌（' + evs.length + '）', 10, y0 + 14 + actH, 14, '#FFD60A', { shadow: false });
    if (maxPage > 0) {
      if (env.navBtn) {
        env.navBtn('evPrev', 118, y0 + 3 + actH, 40, 26, '◀', ep > 0);
        env.navBtn('evNext', 162, y0 + 3 + actH, 40, 26, '▶', ep < maxPage);
      }
      drawPixelText((ep + 1) + '/' + (maxPage + 1), 210, y0 + 16 + actH, 11, copy.pageCol || '#C9D6EA', { shadow: false });
    }
    (env.eventSlots ? env.eventSlots() : []).forEach(r => {
      const ev = r.ev;
      const usable = env.isEventUsable ? env.isEventUsable(ev) : true;
      const draw = () => UIKit.drawEventCard(ctx, r.x, r.y, r.w, r.h, ev, { col: usable ? env.PAL.events.a : '#8a8a9a' });
      if (copy.eventCardAnim) copy.eventCardAnim(r.x, r.y, r.w, r.h, ev, draw);
      else draw();
      if (usable || copy.hoverAll) env.hoverCards.push({ x: r.x, y: r.y, w: r.w, h: r.h, kind: 'event', data: { ev, uid: ev.uid } });
      if (copy.eventBtn) copy.eventBtn(r.x, r.y, r.w, r.h, ev, usable);
      if (ev.used) drawPixelText('✓ 已使用', r.x + r.w / 2, r.y + r.h - 12, 11, '#5AC8FA', { align: 'center', shadow: false });
    });
    if (!evs.length) drawPixelText('（暂无事件牌）', 10, y0 + 60 + actH, 13, copy.emptyCol || '#7E93B0', { shadow: false });
  };

  /* 手牌区：分页/横排 + 卡牌（选择举证/保留）
   * actH（Task 5 竖屏固定操作栏高）：内容区下移让位 */
  RC._renderHandOf = function (env, me, y0) {
    const ctx = env.ctx, W = env.W;
    const copy = env.copy || {};
    const actH = env.actH || 0;
    const handY = y0 + 28 + actH;
    const hh = env.HAND_AREA_H - 40 - actH;
    const minH = copy.handMinH ? copy.handMinH() : 64;
    if (hh >= minH && me.hand.length) {
      if (env.portraitMode) {
        const rects = handGridRects(me.hand.length, handY, hh);
        const perPage = env.portraitPerPage || 6;
        const pages = Math.max(1, Math.ceil(rects.length / perPage));
        let hs = env.handScroll();
        if (hs > pages - 1) hs = pages - 1;
        if (hs < 0) hs = 0;
        env.setHandScroll(hs);
        const from = hs * perPage, to = Math.min(rects.length, from + perPage);
        drawPixelText(copy.handTitle ? copy.handTitle(me, from, to, rects.length) : ('手牌 ' + me.hand.length + ' 张'), 12, y0 + 13 + actH, copy.handTitleSize || 12.5, copy.handTitleCol || '#FFD60A', { shadow: false });
        if (pages > 1) {
          drawPixelText((hs + 1) + '/' + pages, W / 2, y0 + 13 + actH, 12.5, copy.pageCol || '#C9D6EA', { align: 'center', shadow: false });
          if (env.navBtn) {

    for (let i = 0; i < env.hoverCards.length; i++) {

      if (env.mouse.x >= h.x && env.mouse.x <= h.x + h.w && env.mouse.y >= h.y && env.mouse.y <= h.y + h.h) { hit = h; break; }

        && (env.hoverAnim.card.data === hit.data) && (env.hoverAnim.card.card === hit.card);
      env.hoverAnim.card = hit;
      if (!same) { env.hoverAnim.t0 = now; env.hoverAnim.dir = 1; }
      else env.hoverAnim.t0 = now;   // 持续悬停：淡入保持满值
    } else if (env.hoverAnim.card) {
      // 兜底：鼠标停在放大卡上（放大卡不参与命中检测）→ 保持悬停，防止闪烁

      else if (env.hoverAnim.dir === 1) { env.hoverAnim.t0 = now; env.hoverAnim.dir = 0; }

/* 通用卡牌槽位（P0 根因修复）：均分可用宽 = W - 20 - 右预留，左对齐，永不溢出。 */
function flexRects(n, y, h, gap, maxW, reserveR) {
  if (n <= 0) return [];
  gap = gap || 12; maxW = maxW || 200; reserveR = reserveR || 0;
  const avail = Math.max(40, W - 20 - reserveR);
  let cw = clamp((avail - (n - 1) * gap) / n, 16, maxW);
  if (n * cw + (n - 1) * gap > avail) cw = Math.max(10, (avail - (n - 1) * gap) / n);
  const out = [];
  for (let i = 0; i < n; i++) out.push({ x: 10 + i * (cw + gap), y, w: cw, h });
  return out;
}

let HAND_AREA_H = isMobile ? 190 : 230;
/* 四档屏幕断点（P1-5，与联机版一致）：wide(>1280) / normal(≥800) / narrow(≥600) / tiny(<600) */
const UI = {
  size: 'normal', hudH: 52, panelY: 56, handH: 230, panelH: 30,

  show: { scandalBar: true, handN: true, locked: true, act: true, prev: true, jury: true }

function screenSize() {
  if (W > 1280) return 'wide';
  if (W >= 800) return 'normal';
  if (W >= 600) return 'narrow';
  return 'tiny';
}
function applyUI() {
  const ph = screenSize();
  const s = UI;
  s.size = ph;
  s.hudH = compact ? (ph === 'tiny' ? 34 : 40) : (ph === 'narrow' || ph === 'tiny' ? 44 : 52);
  s.panelY = s.hudH + 4;
  s.handH = portraitMode ? (ph === 'tiny' ? 300 : 270)
    : compact ? (ph === 'tiny' ? 118 : 140)
    : (ph === 'narrow' ? 168 : (ph === 'tiny' ? 132 : (isMobile ? 190 : 230)));
  s.panelH = compact ? 26 : (portraitMode ? 32 : (ph === 'tiny' ? 28 : (ph === 'narrow' ? 30 : 36)));
  s.fs.name = compact ? (ph === 'tiny' ? 10 : 11) : (ph === 'tiny' ? 11.5 : (ph === 'narrow' ? 12.5 : 14));
  s.fs.num = compact ? (ph === 'tiny' ? 9.5 : 11) : (ph === 'tiny' ? 12 : (ph === 'narrow' ? 13 : 15));
  s.fs.stat = compact ? (ph === 'tiny' ? 8.5 : 9.5) : (ph === 'tiny' ? 10.5 : (ph === 'narrow' ? 11.5 : 12.5));
  s.fs.small = compact ? 9 : (ph === 'tiny' ? 9.5 : 10.5);
  // 窄屏信息降级：tiny 隐藏丑闻条/锁/先例/陪审徽章（hover 或面板仍可查看数值）
  s.show.scandalBar = ph !== 'tiny';
  s.show.handN = ph !== 'tiny';
  s.show.locked = ph !== 'tiny';
  s.show.act = true;
  s.show.prev = ph !== 'tiny';
  s.show.jury = ph !== 'tiny';
  HUD_H = s.hudH; PANEL_Y = s.panelY; HAND_AREA_H = s.handH;
  if (!portraitMode) handScroll = 0;   // 切回横屏/桌面时重置抽屉页
}
let eventPage = 0;      // 事件牌分批翻页（每页 4 张）

function panelHeight(){
  // 顶部紧凑信息条：桌面 30 / 横屏触屏 20（由四档断点 UI.panelH 决定，P1-5）
  return UI.panelH;
}
/* P1-6：布局唯一源在 UIPresenter.layouts()（双端收口），以下均为薄封装 */
function _layouts() {
  if (!game) return null;
  return UIPresenter.layouts(game, { W, H, compact, isMobile, portraitMode, mySeat, eventPage, HAND_AREA_H, PANEL_Y, panelH: panelHeight(), reserveR: bottomReserve(), portraitActH: portraitMode ? PORTRAIT_ACT_H : 0 });
}
function panelRect(seat){
  const L = _layouts();
  return L ? L.panelRects[seat] : { x: 10, y: PANEL_Y, w: W - 20, h: panelHeight() - 4 };
}
function rowLayout(){
  const L = _layouts();
  return L ? L.row : { items: [], rw: 80, rh: 100, cy: 0 };
}
function marketLayout(seat){
  const L = _layouts();
  if (!L) return [];
  if (seat == null || seat === mySeat) return L.marketItems;
  // 非我方市场（单机全可见）：同一 flexRects 公式本地兜底
  const s = game.seats[seat];
  const k = s.market.length;
  if (!k) return [];
  const ch = HAND_AREA_H - 40;
  const cy = H - HAND_AREA_H + 28;
  const rects = flexRects(k, cy, ch, 12, 200, bottomReserve());
  return s.market.map((card, i) => Object.assign({ card }, rects[i]));
}
function eventLayout(){
  const L = _layouts();
  return L ? L.eventItems : [];
}
function handLayout(){
  const L = _layouts();
  return L ? L.handItems : [];
}

    renderToast();

    if (settleOverlay > 0){
      ctx.save();
      ctx.fillStyle = 'rgba(10,14,25,' + clamp(settleOverlay / 900, 0, 0.85) + ')';
      ctx.fillRect(0, 0, W, H);

      const dw = 560, dh = 150;

function currentActSeat(){ return RenderCore.currentActSeatOf(renderEnv()); }
function canClickHand(card){
  if (!game) return false;
  const g = game;
  if (g.phase === 'play' && g.turn === mySeat && !g.seats[mySeat].playDone) return true;
  if (g.phase === 'discard' && g.discardSeat === mySeat && !g.seats[mySeat].keepDone){
    return selected.indexOf(card.uid) >= 0 || selected.length < keepMax();
  }
  return false;
}
function keepMax(){ return RenderCore.keepMaxOf(renderEnv()); }
function isEventUsable(ev){
  if (!game || ev.used) return false;
  if (game.eventTurnSeat !== mySeat) return false;   // 非我方回合事件牌不可点（避免误引导）
  const s = game.seats[mySeat];
  if (s.eventPassed || s.eventCount >= 2) return false;
  if ((game.phase === 'preEvent' && ev.timing !== 'pre') || (game.phase === 'postEvent' && ev.timing !== 'post')) return false;
  return ev.lv <= ElectionCore.eventLvMax(game.round);
}
function renderActionButtons(me){
  // 操作按钮：双列大按钮，挂底部大卡牌区右侧
  const g = game;
  /* Task 5 竖屏重设计：底部固定操作栏（阶段化通栏大按钮）
   * 1~3 个按钮横贯底栏顶部，底栏内容区（手牌/市场/事件网格）下移 PORTRAIT_ACT_H 让位；
   * 提示类文本（政治操盘/揭示/选起始）居中显示于操作条位置。 */
  if (portraitMode){
    const actH = PORTRAIT_ACT_H, gap = 8;
    const yAct = H - HAND_AREA_H + 8, hBtn = actH - 14;
    const hint = (t, col) => drawPixelText(t, W / 2, yAct + hBtn / 2, 13, col, { align: 'center', shadow: false });
    const acts = [];
    switch (g.phase){
      case 'buy':
        if (!me.buyDone){
          acts.push({ label: '换证 ⊙' + ElectionCore.refreshCostOf(me), act: 'refresh', enabled: me.money >= ElectionCore.refreshCostOf(me), col: PAL.accent.a });
          acts.push({ label: buyMode === 'lock' ? '切到传唤' : '切到留证', act: 'toggleBuyMode', enabled: true, col: PAL.ui.a });
          acts.push({ label: '结束取证', act: 'endBuy', enabled: true, col: PAL.ui.a });
        } else {
          hint('已结束取证', '#4A3820');
        }
        break;
      case 'play':
        if (g.turn === mySeat && !me.playDone){
          acts.push({ label: '举证（' + selected.length + '/1）', act: 'playSel', enabled: selected.length === 1, col: PAL.accent.a });
          acts.push({ label: '结束举证', act: 'finishPlay', enabled: true, col: PAL.ui.a });
          hint('每回合举证 1 份', '#7A4A10');
        } else if (g.playLastSeat === mySeat && !me.playDone){
          acts.push({ label: '结束举证', act: 'finishPlay', enabled: true, col: PAL.ui.a });
        }
        break;
      case 'preEvent': case 'postEvent':
        if (g.eventTurnSeat === mySeat){
          acts.push({ label: '打出选中事件', act: 'playEventSel', enabled: eventPick !== null && eventPick.seat === mySeat, col: PAL.accent.a });
          acts.push({ label: '不打出', act: 'passEvent', enabled: true, col: PAL.ui.a });
          hint('最多连续 2 张 · 点事件牌', '#7A4A10');
        }
        break;
      case 'discard':
        if (g.discardSeat === mySeat && !me.keepDone){
          acts.push({ label: '确认保留（' + selected.length + '/' + Math.min(keepMax(), me.hand.length) + '）', act: 'finishKeep', enabled: selected.length >= Math.min(keepMax(), me.hand.length), col: PAL.accent.a });
          hint('保留最多 ' + keepMax() + ' 张', '#7A4A10');
        }
        break;
      case 'count':
        if (g.swapPending && g.swapPending.owner === mySeat) hint('政治操盘：点击场上任意其他牌互换', '#A9B8CC');
        break;
      case 'reveal':
        if (g.revealPending && g.revealPending.owner === mySeat) hint('点击对手已亮出的证据', '#E6392F');
        break;
      case 'chooseStarter':
        if (g.starterPicker === mySeat) hint('点击选择本轮起始玩家', '#FFD60A');
        break;
      case 'gameover':
        acts.push({ label: '再来一局', act: 'restart', enabled: true, col: PAL.accent.a });
        break;
    }
    if (acts.length){
      const n = acts.length;
      const bw = (W - 20 - (n - 1) * gap) / n;
      acts.forEach((A, i) => {
        const b = btn(10 + i * (bw + gap), yAct, bw, hBtn, A.label, A.col, A.enabled);
        b.act = A.act;
        buttons.push(b);
        drawBtn(b);
      });
    }
    return;
  }
  // 非竖屏（桌面/横屏触屏）：原双列按钮保留
  const cw = 96, chh = compact ? 38 : (isMobile ? 50 : 44), gap = compact ? 6 : 8;
  // P0：窄屏（横屏手机）时按钮右移贴近右侧，防止 W<212 出屏
  const btnColX = Math.max(12, W - 212);
  const x1 = btnColX, x2 = btnColX + 104;
  let y = H - HAND_AREA_H + (compact ? 12 : 16), col = 0;
  const mk = (label, act, enabled, col2) => {
    const b = btn(col === 0 ? x1 : x2, y, cw, chh, label, col2 || PAL.accent.a, enabled !== false);
    b.act = act;
    buttons.push(b);
    drawBtn(b);
    col = 1 - col;
    if (col === 0) y += chh + gap;
  };
  const tip = (t) => drawPixelText(t, x1 + cw + 4, y + chh / 2, 12.5, '#4A3820', { shadow: false });
  switch (g.phase){
    case 'buy':
      if (!me.buyDone){
        mk('换证 ⊙' + ElectionCore.refreshCostOf(me), 'refresh', me.money >= ElectionCore.refreshCostOf(me), PAL.accent.a);
        if (game.leaderStreak >= 2 && game.prevFirst === mySeat) tip('👑 连胜税 +1⊙');
        mk(buyMode === 'lock' ? '切到传唤' : '切到留证', 'toggleBuyMode', true, PAL.ui.a);
        mk('结束取证', 'endBuy', true, PAL.ui.a);
      } else {
        drawPixelText('已结束取证', x1, y + 12, 15, '#4A3820', { shadow: false });
      }
      break;
    case 'play':
      if (g.turn === mySeat && !me.playDone){
        mk('举证（' + selected.length + '/1）', 'playSel', selected.length === 1, PAL.accent.a);
        mk('结束举证', 'finishPlay', true, PAL.ui.a);
        tip('每回合举证 1 份');
      } else if (g.playLastSeat === mySeat && !me.playDone){
        mk('结束举证', 'finishPlay', true, PAL.ui.a);
      }
      break;
    case 'preEvent': case 'postEvent':
      if (g.eventTurnSeat === mySeat){
        mk('打出选中事件', 'playEventSel', eventPick !== null && eventPick.seat === mySeat, PAL.accent.a);
        mk('不打出', 'passEvent', true, PAL.ui.a);
        tip('最多连续 2 张 · 点事件牌');
      }
      break;
    case 'discard':
      if (g.discardSeat === mySeat && !me.keepDone){
        mk('确认保留', 'finishKeep', selected.length >= Math.min(keepMax(), me.hand.length), PAL.accent.a);
        tip('保留最多 ' + keepMax() + ' 张');
      }
      break;
    case 'count':
      if (g.swapPending && g.swapPending.owner === mySeat){
        drawPixelText('政治操盘：点击场上任意其他牌互换', x1, y + 12, 12, '#A9B8CC', { shadow: false });
      }
      break;
    case 'reveal':
      if (g.revealPending && g.revealPending.owner === mySeat){
        drawPixelText('点击对手已亮出的证据', x1, y + 12, 13, '#E6392F', { shadow: false });
      }
      break;
    case 'chooseStarter':
      if (g.starterPicker === mySeat){
        drawPixelText('点击选择本轮起始玩家', x1, y + 12, 13, '#FFD60A', { shadow: false });
      }
      break;
    case 'gameover':
      mk('再来一局', 'restart', true, PAL.accent.a);
      break;
  }
}

function drawCourthouse(x, y, s){

// #13 战绩复制：纯文本战报 → 剪贴板（clipboard API + execCommand 兜底）
function buildReportSP(g){
  const seats = g.seats;
  const order = seats.slice().sort((a, b) => b.support - a.support || a.seat - b.seat);
  const win = order[0];
  const winSide2 = win.side ? (win.side === 'prosecutor' ? '检方' : '辩护方') : '';
  const wt = g.winType === 'precedent' ? '⚖️ 先例胜利' : (g.winType === 'juryNull' ? '🕊️ 陪审团否决' : '最终陪审团倾向');
  const lines = [
    '【合理怀疑 · 世纪审判】战报',
    '胜诉方：' + win.name + (winSide2 ? '（' + winSide2 + '）' : ''),
    '胜诉方式：' + wt,
    '进行轮次：' + (g.round != null ? g.round : '-') + ' / 5',
    '种子码：' + (g.seedRaw != null ? g.seedRaw : (g.seed != null ? g.seed : '随机')),
    '—— 最终陪审团倾向 ——'
  ];
  order.forEach((s, i) => lines.push((i + 1) + '. ' + s.name + ' — ' + s.support));
  return lines.join('\n');
}
function copyReport(){
  if (!game) return;
  const txt = buildReportSP(game);
  const done = () => flash('✅ 战绩已复制，可粘贴分享');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) done(); else flash('复制失败，请手动复制');
    } catch (e) { flash('复制失败，请手动复制'); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(fallback);
  } else fallback();
}

}
function onMouseMove(e){
  const p = toInternal(e);
  mouse.x = p.x; mouse.y = p.y;
  const wasHover = hover;
  hover = findButton(p.x, p.y);
  if (hover && hover !== wasHover && performance.now() - hoverTickT > 180){ hoverTickT = performance.now(); sfx('hover'); }  // 悬停滴答（节流）
}

  const hit = b => {
    if (isMobile){
      const tw = Math.max(44, b.w), th = Math.max(44, b.h);
      return x >= b.x - (tw - b.w) / 2 && x <= b.x + b.w + (tw - b.w) / 2 &&
             y >= b.y - (th - b.h) / 2 && y <= b.y + b.h + (th - b.h) / 2;
    }

/* ============================ 11. FX 差异检测（diff 触发） ============================ */
let lastV = 0;
let lastPhase = '';
let lastRowSig = '';
let lastVotesSig = '';
let lastRankSig = '';
let lastMoney = [];
let lastSupport = [];
let lastHandN = [];
let lastEventsN = [];
let lastMarketSig = [];
let lastLogN = 0;
let overFxDone = false;
let lastFxSig = '';           // 8.3 字段级快速签名：显示字段全未变时跳过全量扫描
function sigOf(arr){ return arr.map(x => x.card.uid + (x.removed ? ':R' : '') + (x.revealed ? ':V' : '')).join(','); }
/* 8.3 字段级 diff：覆盖 checkFxDiffs 全部触发字段（阶段/行/票/排名/财务/手牌/事件/市场/日志/结束）
 * 一次拼接完成比较——版本号变化可能源于无显示影响的内部操作，签名未变则完全跳过全量扫描。 */
function fxSigOf(){
  const seats = game.seats;
  let s = game.phase + '|' + game.startingSeat + '|' + game.gameOver + '|' +
    sigOf(game.row) + '|' + (game.votes || []).join(',') + '|' + (game.roundRank || []).join(',') + '|';
  for (let i = 0; i < seats.length; i++){
    const se = seats[i];
    s += se.money + ',' + se.support + ',' + se.hand.length + ',' + se.events.length + ',' + se.market.map(c => c.uid).join('+') + ';';
  }
  s += '|' + game.logs.length;
  return s;
}
function checkFxDiffs(){
  if (!game) return;
  if (game.version === lastV) return;
  lastV = game.version;
  // 8.3 字段级短路：显示字段全未变（版本变化源于无显示影响操作）→ 跳过全量扫描
  const fxSig = fxSigOf();
  if (fxSig === lastFxSig) return;
  lastFxSig = fxSig;
  const n = game.seatCount;
  // —— 阶段变化 ——
  if (game.phase !== lastPhase){
    const prev = lastPhase;
    lastPhase = game.phase;
    if (game.phase === 'preEvent'){
      addFx({ type: 'phase', dur: 1100, label: '庭审前 · 事件' });
      sfx('swoosh');
    } else if (game.phase === 'postEvent'){
      addFx({ type: 'phase', dur: 1100, label: '庭审后 · 事件' });
      sfx('swoosh');
    } else if (game.phase === 'discard'){
      addFx({ type: 'phase', dur: 1100, label: '整理阶段' });
      sfx('swoosh');
    } else if (game.phase === 'income'){
      addFx({ type: 'phase', dur: 1100, label: '分发 ⊙' });
      sfx('coin');
    } else if (game.phase === 'gameover'){
      // 直接结算屏
    } else if (prev !== '' && game.phase !== 'buy' && game.phase !== 'play' && game.phase !== 'chooseStarter' && game.phase !== 'reveal'){
      addFx({ type: 'phase', dur: 1100, label: ElectionCore.phaseLabel(game) });
      sfx('swoosh');
    }
  }
  // —— 行牌：新增（暗置落下）/ 翻面 / 移除（爆炸） ——
  const rsig = sigOf(game.row);
  if (rsig !== lastRowSig){
    if (lastRowSig){
      const prevMap = {};
      (lastRowSig.split(',')).forEach(s2 => { const p2 = s2.split(':'); prevMap[p2[0]] = s2; });
      // 翻面检测：某牌从未亮(:V)变为已亮
      const prevRevealed = lastRowSig.split(',').filter(s2 => s2.includes(':V')).map(s2 => s2.split(':')[0]);
      const newRevealed = game.row.filter(r => r.revealed && !r.removed && !prevRevealed.includes(String(r.card.uid)));
      if (newRevealed.length){
        const cnt = game.row.filter(r => r.revealed && !r.removed).length;
        const dur = Math.max(1200, cnt * 140 + 300);
        addFx({ type: 'flipSeq', dur });

function pumpAI(){
  if (!game || screen !== 'game') return;
  if (performance.now() < waitUntil) return;
  if (aiQueue.length === 0){
    const need = ElectionCore.needsAIAction(game);
    if (need.length){ aiQueue = need; }
    else { ElectionCore.advance(game); return; }
  }
  aiTimer++;
  if (aiTimer < 8) return;
  aiTimer = 0;
  const seat = aiQueue.shift();
  // D2：AI 行动前设置思考锁屏（仅当是 AI 且非自己）
  if (game.seats[seat] && game.seats[seat].isAI && seat !== mySeat) thinkSeat = seat;
  ElectionCore.aiAct(game, seat);
  // D2：AI 行动完成后清锁屏（短暂保留让玩家看到是谁在行动）
  const stillNeed = ElectionCore.needsAIAction(game).includes(seat);
  if (!stillNeed){
    const keep = thinkSeat;
    setTimeout(() => { if (thinkSeat === keep) thinkSeat = -1; }, 650);
  }
}

/* 诊断日志黑匣子（程序意见3）：记录阶段流转，渲染异常时输出快照 */
const DIAG = [];
const DIAG_MAX = 200;
function diagLog(ev){ DIAG.push(Object.assign({ t: Date.now() }, ev)); if (DIAG.length > DIAG_MAX) DIAG.shift(); }
function diagOut(reason){
  try { console.warn('[diag] ' + reason + '\n' + DIAG.slice(-40).map(d => '[' + new Date(d.t).toISOString().slice(11, 23) + '] ' + (d.msg || d.type || '')).join('\n')); } catch(e){ /* 忽略 */ }
}
let lastDiagPhase = null;
let lastT = 0;
/* 渲染错误隔离（B 类审查）：连续 ERROR_FREEZE_THRESHOLD 帧抛错则冻结画面并显示错误屏，
 * 避免"每帧 try-catch 吞掉、画面假活但 rAF 空转"。 */
const ERROR_FREEZE_THRESHOLD = 5;
let renderErrCount = 0;
let renderFrozen = false;
function freezeRender(err){
  renderFrozen = true;
  if (console && console.error) console.error('[render] 连续异常，已冻结画面：', err);
  try {
    ctx.save();
    ctx.fillStyle = '#0e1117'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff5a5a'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('渲染异常，已暂停', W / 2, H / 2 - 18);
    ctx.fillStyle = '#e6e6e6'; ctx.font = '13px sans-serif';
    ctx.fillText(String(err && err.message || err).slice(0, 120), W / 2, H / 2 + 6);
    ctx.fillText('请刷新页面重试', W / 2, H / 2 + 26);
    ctx.restore();
  } catch (e2){ /* 连错误屏都画不出就算了 */ }
  diagOut('渲染连续异常已冻结，最近事件黑匣子：');
}
function loop(t){
  if (!lastT) lastT = t;
  const dt = Math.min(50, t - lastT);
  lastT = t;
  try {
    if (game && game.phase !== lastDiagPhase){ lastDiagPhase = game.phase; diagLog({ type: 'phase', msg: 'phase→' + game.phase + ' round ' + (game.round || 0) }); }
    update(dt);
    render();
    renderErrCount = 0;   // 成功一帧即清零
  } catch (e){
    renderErrCount++;
    if (renderErrCount >= ERROR_FREEZE_THRESHOLD){ freezeRender(e); return; }   // 冻结：不再 requestAnimationFrame
    if (console && console.error) console.error('[render]', e);
    diagOut('渲染异常，最近事件黑匣子：');
  }
  requestAnimationFrame(loop);
}

  SAFE = safeArea();
  const vv = window.visualViewport;
  const vw = Math.round(vv ? vv.width : window.innerWidth);
  const vh = Math.round(vv ? vv.height : window.innerHeight);
  const portrait = vh > vw;
  compact = isMobile && !portrait;
  portraitMode = isMobile && portrait;
  // Task 5 键盘识别：可视视口比布局视口矮 120px+ → 键盘/工具栏占据（允许画布更矮，避免内容被遮）
  keyboardOpen = !!(vv && window.innerHeight - vv.height > 120);
  W = Math.max(340, vw - SAFE.left - SAFE.right);
  H = Math.max(keyboardOpen ? 300 : 480, vh - SAFE.top - SAFE.bottom);
  // 画布 CSS 尺寸跟随逻辑尺寸并平移到安全区内（刘海/Home 条不再遮 HUD 与底栏按钮）；
  // 键盘弹出时 visualViewport.offsetTop 变化 → 画布随可视区上移/恢复
  canvas.style.position = 'fixed';
  canvas.style.left = SAFE.left + 'px';
  canvas.style.top = (SAFE.top + (vv ? vv.offsetTop : 0)) + 'px';
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  applyUI();
}
window.addEventListener('resize', resize);
// Task 5 键盘弹出画布上移：visualViewport resize/scroll（键盘弹出不触发 window resize）
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', resize);
  window.visualViewport.addEventListener('scroll', resize);
}
canvas.addEventListener('mousemove', onMouseMove);
canvas.addEventListener('click', e => {
  if (Date.now() - lastTouchTime < 600) return;   // 触屏合成 click：touchend 已处理
  onClick(e);
});
let touchStart = null;   // 触摸起点（touchstart 记录，位移>10px 或长按取消点击）
let lastTouchTime = 0;   // 最近一次 touchend 时间 → 屏蔽系统随后合成的 click
canvas.addEventListener('touchstart', e => {
  const touch = e.touches && e.touches[0];
  if (!touch) return;
  const r = canvas.getBoundingClientRect();
  touchStart = { x: touch.clientX, y: touch.clientY, t: Date.now() };
  mouse.x = (touch.clientX - r.left) * W / r.width;
  mouse.y = (touch.clientY - r.top) * H / r.height;
  const b = findButton(mouse.x, mouse.y);
  if (b) sfx('click');
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const touch = e.touches && e.touches[0];
  if (!touch || !touchStart) return;
  const dy = touch.clientY - touchStart.y;
  const dx = touch.clientX - touchStart.x;
  if (Math.hypot(dx, dy) > 10){
    // 竖屏手牌抽屉：纵向滑动翻页（超级更新#37）；普通点击流程取消
    if (portraitMode && Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 24){
      const me0 = game && game.seats && game.seats[mySeat];
      const showHand = game && (game.phase === 'play' || game.phase === 'discard') && me0 && me0.hand && me0.hand.length;
      if (showHand){
        const maxPage = Math.max(0, Math.ceil(me0.hand.length / PORTRAIT_PER_PAGE) - 1);
        if (dy < 0) handScroll = Math.min(maxPage, handScroll + 1);
        else handScroll = Math.max(0, handScroll - 1);
        touchStart = null;   // 已作为滑动处理，不触发点击
        return;
      }
    }
    touchStart = null;
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const wasTap = !!touchStart;   // 滑动过（touchmove 已置 null）→ 不算点击
  const dt = wasTap ? Date.now() - touchStart.t : 0;
  touchStart = null;
  lastTouchTime = Date.now();    // 滑动后也更新 → 屏蔽系统随后合成的 click（滑动不再误触）
  if (!wasTap) return;
  if (dt > 700) return;          // 长按：留给系统手势
  onClick();
}, { passive: false });
// P1：长按禁用系统菜单
canvas.addEventListener('contextmenu', e => e.preventDefault());
// iOS 系统手势（双击缩放/捏合）禁用
if ('ongesturestart' in window){
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
}
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
