<script>
"use strict";
/* =====================================================================
 * 《合理怀疑 · 世纪审判》单机渲染器 v2 —— 大更新版
 * 虚构"米合众国"联邦巡回法庭体系，四方法律团队对抗
 * 视觉：美漫硬边政治讽刺漫画 —— 报纸米黄底 + 粗黑描边 + 无渐变 + 大字海报
 * 动画：FX 队列引擎（翻牌/爆炸/新闻/计票柱/领奖台/阶段横幅/方向光束/数值飘字…）
 * 音效：WebAudio 合成器（无资源文件）
 * ===================================================================== */

/* ============================ 0. 工具 ============================ */
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function shuffle(arr){ for (let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return arr; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function easeOutBack(p){ const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2); }
function easeOutCubic(p){ return 1-Math.pow(1-p,3); }

/* 统一坐标系（P1-5）：不再用 1000×700 逻辑画布，画布尺寸 = 真实视口（含安全区），
 * 布局全部基于 W/H 计算（见 panelRect/rowLayout/...），与联机版同一套断点 */
let W = 0, H = 0;
const DPR = Math.min(2, window.devicePixelRatio || 1);
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

/* ============================ 1. 固定配色 · 阵营 ============================ */
/* PAL / PARTY_META 唯一源 = shared/theme.js（演播室深蓝 + 金），
 * 经 _build_ui.js 内联为下方 THEME 块；渲染层直接读全局。 */
/*__THEME_START__*/
/* ============================================================
 * shared/theme.js — 合理怀疑 · 全局主题唯一源（超级更新#3/#4）
 * 单主题：演播室深蓝 #0F1B2D + 法庭金 #FFD60A
 * （已删 PvZ 草地绿 / 旧报纸米黄风，双端共用一套）
 * ------------------------------------------------------------
 * 挂载方式（双挂载）：
 *   浏览器：window.PAL / window.PARTY_META / window.campColor ...
 *   Node：  module.exports = { PAL, PARTY_META, campColor, ... }
 * 阵营工具（campColor/campSoft/partyOf/campOf/contrast）唯一源在此，
 * 两端禁止另写副本；渲染层直接读全局（运行时自动取 view/game 数据源）。
 * ============================================================ */
(function (g) {
  'use strict';
  /* 四方法律团队：公诉方红 / 被告方蓝 / 第三方绿 / 第四方金 */
  const PARTY_META = {
    red:   { name: '公诉方律师团', sym: '检', col: '#FF3B30', soft: '#FFD9D2' },
    blue:  { name: '被告方律师团', sym: '辩', col: '#0A84FF', soft: '#CFE3FF' },
    green: { name: '第三方律师团', sym: '席', col: '#2FBF5F', soft: '#D0F5DD' },
    gold:  { name: '第四方律师团', sym: '议', col: '#FFC61A', soft: '#FFEEC9' }
  };
  const PAL = {
    bg:     { a: '#0F1B2D', b: '#1A2C44' },   // 演播室深海军蓝（对局背景 / 辩论台）
    ui:     { a: '#FFFFFF', b: '#F2E9D2' },    // 卡牌浅色（纸感，与深背景高对比）
    accent: { a: '#FFD60A', b: '#111111' },    // 金色行动按钮
    events: { a: '#14213D', b: '#FFD60A' },    // 事件牌深蓝 + 金
    reward: { a: '#FF9F0A', b: '#FFF3D0' },    // 奖励橙
    draft:  { a: '#0F1B2D', b: '#FFD60A' },    // 选角深蓝 + 金
    ink:    '#111111',
    grave:  '#5A5A5A',
    paper:  '#F6E9C8'
  };
  /* 未选定阵营时的兜底色板（按座位索引） */
  const FALLBACK_COL = ['#D82E2F', '#1E4FB5', '#0E8A5F', '#C78A1A'];
  const FALLBACK_SOFT = ['#F6C8C8', '#C8D6F2', '#C6EAD8', '#F2E2C0'];

  /* 运行时数据源：联机渲染读 view（makeView 防作弊视图），单机读 game。
   * 两端渲染层都有同名全局，theme 函数仅在被调用时读取，故加载顺序无关。 */
  function seatsOf() {
    if (typeof view !== 'undefined' && view && view.seats) return view.seats;
    if (typeof game !== 'undefined' && game && game.seats) return game.seats;
    return null;
  }

  /* 该座位当前阵营 key（'red'/'blue'/'green'/'gold'），未选角返回 null */
  function campOf(seat) {
    const seats = seatsOf();
    if (!seats || !seats[seat] || !seats[seat].camp) return null;
    return seats[seat].camp;
  }
  /* 阵营主色：已选角取 PARTY_META.col，否则按座位兜底 */
  function campColor(seat) {
    const c = campOf(seat);
    const m = c && PARTY_META[c];
    if (m) return m.col;
    return FALLBACK_COL[seat % 4];
  }
  /* 阵营浅色（面板底/卡背等） */
  function campSoft(seat) {
    const c = campOf(seat);
    const m = c && PARTY_META[c];
    if (m) return m.soft;
    return FALLBACK_SOFT[seat % 4];
  }
  /* 阵营元信息（名称/符号），未选角返回待定 */
  function partyOf(seat) {
    const c = campOf(seat);
    const m = c && PARTY_META[c];
    return m || { name: '待定', sym: '?' };
  }
  /* 对比色：深底用白字 / 浅底用黑字（自绘文本专用） */
  function contrast(hex) {
    const c = String(hex).replace('#', '');
    if (c.length < 6) return '#ffffff';
    const r = parseInt(c.substr(0, 2), 16), gg = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
    return (r * 0.299 + gg * 0.587 + b * 0.114) > 150 ? '#1a1a1a' : '#ffffff';
  }

  g.PARTY_META = PARTY_META;
  g.PAL = PAL;
  g.campOf = campOf;
  g.campColor = campColor;
  g.campSoft = campSoft;
  g.partyOf = partyOf;
  g.contrast = contrast;
  /* Node 双挂载（超级更新#3）：server/_test 等 require 时可用 */
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = { PARTY_META, PAL, campOf, campColor, campSoft, partyOf, contrast, FALLBACK_COL, FALLBACK_SOFT };
  }
})(typeof window !== 'undefined' ? window : globalThis);

/*__THEME_END__*/
/* campColor/campSoft/partyOf/contrast 唯一源 = 上方 THEME 块（shared/theme.js，
 * 超级更新#4），渲染层直接读全局；此处不再维护副本。 */

/* ============================ 2. 文字测量（P0：真实测量，取代估算） ============================ */
const _FONT_BASE = '"Microsoft YaHei","PingFang SC","Impact","Arial Black",sans-serif';
const _twCache = new Map();
function textWidth(text, font) {
  const k = font + '\u0000' + text;
  let v = _twCache.get(k);
  if (v === undefined) {
    ctx.save(); ctx.font = font;
    v = ctx.measureText(text).width;
    ctx.restore();
    if (_twCache.size > 6000) _twCache.clear();
    _twCache.set(k, v);
  }
  return v;
}
function fitText(text, maxW, size, o) {
  o = o || {};
  let s = Math.max(9, size), t = String(text);
  const bold = o.bold === false ? '' : '700 ';
  const fontFor = ss => bold + ss + 'px ' + _FONT_BASE;
  while (s > 9 && textWidth(t, fontFor(s)) > maxW) s -= 0.5;
  while (t.length > 1 && textWidth(t + '…', fontFor(s)) > maxW) t = t.slice(0, -1);
  if (t !== String(text) && textWidth(t + '…', fontFor(s)) <= maxW) t += '…';
  return { text: t, size: s, w: textWidth(t, fontFor(s)) };
}
/* ============================ 3. 绘制原语 ============================ */
function drawPixelText(text, x, y, size, color, o){
  o = o || {};
  size = Math.max(5, size);
  ctx.save();
  // 粗细统一：全部 700+，避免 600/700 跳变发虚；描边随字号精细缩放
  // P0-4a：≤13px 一律无粗体、无描边，靠对比色区分；大字保留美漫粗描边
  const small = size <= 13;
  const bold = (small || o.bold === false ? '' : '700 ');
  ctx.font = bold + size + 'px ' + _FONT_BASE;
  ctx.textBaseline = 'middle';
  ctx.textAlign = o.align === 'center' ? 'center' : (o.align === 'right' ? 'right' : 'left');
  if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;
  if (!small && o.shadow !== false){
    ctx.lineWidth = o.lineW !== undefined ? o.lineW : Math.max(0.8, size / 12);
    ctx.lineJoin = 'miter';
    ctx.strokeStyle = o.outline || '#111111';
    ctx.strokeText(text, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
  return { w: Math.round(textWidth(text, bold + size + 'px ' + _FONT_BASE)), h: Math.round(size * 1.4) };
}
function drawWrapText(text, x, y, size, color, maxWidth, lineH, o){
  o = o || {};
  const bold = o.bold === false ? '' : '700 ';
  const font = bold + size + 'px ' + _FONT_BASE;
  const lh = lineH || Math.round(size * 1.32);
  const maxLines = o.maxLines || 12;
  const lines = [];
  let rest = text;
  while (rest.length > 0 && lines.length < maxLines){
    let take = rest.length;
    while (take > 1 && textWidth(rest.slice(0, take), font) > maxWidth) take--;
    if (take <= 0) take = 1;
    if (take < rest.length){
      // 向回找最近的标点（含空格），在它后面断开
      for (let i = take - 1; i > Math.max(0, take - 8); i--){
        if (/[，。；：、！？,.!?;: \u00b7·]/.test(rest[i])){ take = i + 1; break; }
      }
    }
    lines.push(rest.slice(0, take));
    rest = rest.slice(take);
  }
  if (rest.length > 0 && lines.length === maxLines){
    const f = fitText(lines[lines.length - 1] + '…', maxWidth, size, { bold: o.bold === false ? false : true });
    lines[lines.length - 1] = f.text;
  }
  lines.forEach((ln, i) => drawPixelText(ln, x, y + i * lh - (lines.length - 1) * lh / 2, size, color, o.shadow === false ? { shadow: false } : { shadow: true }));
  return lines.length * lh;
}
function pxRect(x, y, w, h, col){
  ctx.save(); ctx.fillStyle = col; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); ctx.restore();
}
function jaggedRectPath(x, y, w, h, j){
  j = Math.max(1, j == null ? 2 : j);
  const rnd = Math.floor(x * 13 + y * 7 + w * 3 + h * 5);
  const n = 4;
  const jx = (i, t) => x + w * t + (((rnd + i * 3) % 5) - 2) * j * 0.4;
  const jy = (i, t) => y + h * t + (((rnd + i * 7) % 3) - 1) * j * 0.5;
  ctx.beginPath();
  ctx.moveTo(x, y);
  for (let i = 1; i <= n; i++) ctx.lineTo(jx(i, i / n), jy(i, 0));
  ctx.lineTo(x + w, y);
  for (let i = 1; i <= n; i++) ctx.lineTo(jx(i, 1), jy(i, i / n));
  ctx.lineTo(x + w, y + h);
  for (let i = 1; i <= n; i++) ctx.lineTo(jx(i, 1 - i / n), jy(i, 1));
  ctx.lineTo(x, y + h);
  for (let i = 1; i <= n; i++) ctx.lineTo(jx(i, 0), jy(i, 1 - i / n));
  ctx.closePath();
}
function pxBorder(x, y, w, h, col, t){
  t = clamp(Math.max(1.5, t || 2), 1.5, 6);
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = t; ctx.lineJoin = 'miter'; ctx.lineCap = 'butt';
  jaggedRectPath(x + t/2, y + t/2, w - t, h - t, 2); ctx.stroke();
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = Math.max(1, t * 0.55);
  const in2 = t * 1.9;
  jaggedRectPath(x + in2, y + in2, w - in2 * 2, h - in2 * 2, 1); ctx.stroke();
  ctx.restore();
}
function comicShadow(x, y, w, h, dx, dy){
  ctx.save(); ctx.fillStyle = 'rgba(10,10,10,0.28)'; ctx.fillRect(Math.round(x + (dx||4)), Math.round(y + (dy||4)), Math.round(w), Math.round(h)); ctx.restore();
}
function btn(x, y, w, h, label, col, enabled){
  enabled = enabled !== false;
  return { x, y, w, h, label, col: col || PAL.ui.a, enabled };
}
function drawBtn(b){
  ctx.save();
  ctx.globalAlpha = b.enabled ? 1 : 0.42;
  // 三态：常态 / 悬停（金色边框+微光+上浮）/ 禁用（透明灰）
  const hov = b.enabled && mouse.x >= b.x - 3 && mouse.x <= b.x + b.w + 3 && mouse.y >= b.y - 3 && mouse.y <= b.y + b.h + 3;
  comicShadow(b.x, b.y, b.w, b.h, hov ? 5 : 3, hov ? 5 : 3);
  if (b.primary){
    // 演播室主按钮：法庭红渐变（开庭审理）
    const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    g.addColorStop(0, '#FF5A4E'); g.addColorStop(1, '#D63A2B');
    ctx.fillStyle = g;
    ctx.fillRect(Math.round(b.x), Math.round(b.y), Math.round(b.w), Math.round(b.h));
    if (hov){ ctx.globalAlpha = 0.22; pxRect(b.x, b.y, b.w, b.h, '#FFFFFF'); ctx.globalAlpha = b.enabled ? 1 : 0.42; }
    pxBorder(b.x, b.y, b.w, b.h, hov ? '#FFD60A' : '#111111', hov ? 4 : 3);
    drawPixelText(b.label, b.x + b.w/2, b.y + b.h/2 - (hov ? 1.5 : 0), b.h * 0.42, '#FFFFFF', { align: 'center', shadow: false });
  } else if (b.wood){
    // 演播室金按钮：金色渐变（主菜单常规操作）
    const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    g.addColorStop(0, hov ? '#FFF3B0' : '#FFD60A'); g.addColorStop(1, '#E8B33E');
    ctx.fillStyle = g;
    ctx.fillRect(Math.round(b.x), Math.round(b.y), Math.round(b.w), Math.round(b.h));
    if (hov){ ctx.globalAlpha = 0.22; pxRect(b.x, b.y, b.w, b.h, '#FFFFFF'); ctx.globalAlpha = b.enabled ? 1 : 0.42; }
    pxBorder(b.x, b.y, b.w, b.h, hov ? '#FFFFFF' : '#111111', hov ? 4 : 3);
    drawPixelText(b.label, b.x + b.w/2, b.y + b.h/2 - (hov ? 1.5 : 0), b.h * 0.42, '#111111', { align: 'center', shadow: false });
  } else {
    pxRect(b.x, b.y, b.w, b.h, b.col);
    if (hov){ ctx.globalAlpha = 0.22; pxRect(b.x, b.y, b.w, b.h, '#FFFFFF'); ctx.globalAlpha = 1; }
    pxBorder(b.x, b.y, b.w, b.h, hov ? '#FFD60A' : '#111111', hov ? 4 : 2.5);
    drawPixelText(b.label, b.x + b.w/2, b.y + b.h/2 - (hov ? 1.5 : 0), b.h * 0.42, contrast(b.col), { align: 'center', shadow: false });
  }
  ctx.restore();
}
function inBtn(b, x, y){ return b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }

/* 报纸网点暗纹（美漫底色） */
function drawBg(theme){
  pxRect(0, 0, W, H, theme.a);
  ctx.save();
  ctx.fillStyle = theme.b;
  ctx.globalAlpha = 0.35;
  // 对角斜块装饰
  ctx.fillRect(0, 0, W, 8);
  ctx.fillRect(0, H - 8, W, 8);
  // 网点
  ctx.globalAlpha = 0.10;
  ctx.fillStyle = '#111111';
  for (let gy = 20; gy < H; gy += 34){
    for (let gx = 14; gx < W; gx += 30){
      ctx.fillRect(gx, gy, 2, 2);
    }
  }
  ctx.restore();
}

/* ============================ 3. 音效（WebAudio 合成） ============================ */
let AC = null;
function sfx(name){
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    const osc = (type, f0, f1, dur, vol, delay) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t + (delay||0));
      if (f1 !== undefined) o.frequency.exponentialRampToValueAtTime(Math.max(30,f1), t + (delay||0) + dur);
      g.gain.setValueAtTime(0.0001, t + (delay||0));
      g.gain.exponentialRampToValueAtTime(vol, t + (delay||0) + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (delay||0) + dur);
      o.connect(g); g.connect(AC.destination);
      o.start(t + (delay||0)); o.stop(t + (delay||0) + dur + 0.05);
    };
    const noise = (dur, vol, delay) => {
      const len = Math.max(1, Math.floor(AC.sampleRate * dur));
      const buf = AC.createBuffer(1, len, AC.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * (1 - i/len);
      const src = AC.createBufferSource(), g = AC.createGain();
      src.buffer = buf; g.gain.value = vol;
      src.connect(g); g.connect(AC.destination);
      src.start(t + (delay||0));
    };
    switch (name){
      case 'click': osc('square', 520, 300, 0.06, 0.12); break;
      case 'flip':  osc('square', 720, 260, 0.11, 0.13); noise(0.08, 0.05); break;
      case 'swoosh': noise(0.28, 0.10); osc('sawtooth', 300, 900, 0.28, 0.06); break;
      case 'boom':  noise(0.5, 0.30); osc('sine', 140, 38, 0.5, 0.35); osc('square', 90, 30, 0.5, 0.12); break;
      case 'gavel':  noise(0.16, 0.20); osc('triangle', 210, 60, 0.30, 0.30); osc('square', 120, 40, 0.28, 0.10); break;   // 法槌：低闷重击
      case 'coin':  osc('square', 1180, 1180, 0.08, 0.12); osc('square', 1568, 1568, 0.12, 0.10, 0.08); break;
      case 'news':  osc('sawtooth', 620, 880, 0.28, 0.12); osc('sawtooth', 880, 620, 0.28, 0.12, 0.30); osc('sawtooth', 620, 880, 0.28, 0.12, 0.60); break;
      case 'star':  osc('triangle', 660, 990, 0.14, 0.12); osc('triangle', 990, 1320, 0.14, 0.10, 0.12); break;
      case 'shatter': noise(0.22, 0.16); osc('square', 400, 120, 0.18, 0.08); break;
      case 'win':   [523,659,784,1046].forEach((f,i)=>osc('triangle', f, f, 0.22, 0.13, i*0.13)); break;
      case 'boo':   osc('sawtooth', 180, 120, 0.35, 0.10); noise(0.25, 0.06); break;
      case 'hover': osc('sine', 1900, 2400, 0.03, 0.035); break;   // 悬停滴答：极短、极轻
      case 'paper': noise(0.09, 0.05); osc('triangle', 500, 900, 0.08, 0.05); noise(0.13, 0.04, 0.06); break;  // 纸页翻动（刷新市场）
    }
  } catch(e){ /* 静音兜底 */ }
}

/* ============================ 4. FX 动画引擎 ============================ */
/* #60/#61：对象池复用 + 总量上限 + 高负载自动降级（低端机/移动端优化） */
const FX = [];
let shakeAmp = 0;
const FX_MAX = 48;            // FX 总量上限：超出丢弃最旧（防粒子爆炸拖垮低端机）
let fxLowQ = false;           // 低质量模式：降级粒子密度/跳过重特效
const _fxPool = [];           // FX 对象池：复用对象，减少每帧 GC 压力
function recycleFx(f){ for (const k in f) delete f[k]; if (_fxPool.length < 32) _fxPool.push(f); }
let waitUntil = 0;             // 动画演出期：暂停引擎推进
function hold(ms){ waitUntil = Math.max(waitUntil, performance.now() + ms); }
function addFx(f){
  const obj = _fxPool.pop() || {};   // 从池取空对象复用，避免反复分配
  for (const k in f) obj[k] = f[k];
  obj.t = 0; obj.dur = f.dur || 800;
  if (FX.length >= FX_MAX){ const old = FX.shift(); recycleFx(old); }
  FX.push(obj);
  return obj;
}
function updateFx(dt){
  for (let i = FX.length - 1; i >= 0; i--){
    const f = FX[i];
    f.t += dt;
    if (f.t - (f.delay || 0) >= f.dur){ FX.splice(i, 1); recycleFx(f); }
  }
  shakeAmp *= 0.86;
  if (shakeAmp < 0.4) shakeAmp = 0;
  // #60：移动端 FX 高负载 → 自动降级粒子密度，保帧率
  fxLowQ = isMobile && FX.length > 24;
}
function ttOf(f){ return Math.max(0, f.t - (f.delay || 0)); }
function renderFx(){
  for (const f of FX) drawFx(f);
}
function drawFx(f){
  const tt = ttOf(f);
  const p = clamp(tt / f.dur, 0, 1);
  switch (f.type){
    /* ---- 卡牌翻面（reveal 逐张） ---- */
    case 'flipSeq': {
      const lay = rowLayout();
      lay.items.forEach((it, i) => {
        if (it.removed) return;
        const prog = clamp((tt - i * 140) / 300, 0, 1);
        if (prog <= 0 || prog >= 1) return;
        const cx = it.x + it.w / 2;
        const s = Math.cos(prog * Math.PI);
        ctx.save();
        ctx.translate(cx, it.y + it.h / 2);
        ctx.scale(s, 1);
        if (prog < 0.5){
          UIKit.drawCardBackAt(ctx, -it.w/2, -it.h/2, it.w, it.h, PAL.ui.b);
        } else {
          UIKit.drawCard(ctx, -it.w/2, -it.h/2, it.w, it.h, it.card, { col: it.seat === mySeat ? campSoft(it.seat) : '#f6e9c8' });
        }
        ctx.restore();
      });
      break;
    }
    /* ---- 作废爆炸（证据排除） ---- */
    case 'boom': {
      const cx = f.x + f.w/2, cy = f.y + f.h/2;
      const R = f.w * 0.9 * easeOutCubic(p);
      const a = p < 0.65 ? 1 : 1 - (p - 0.65) / 0.35;
      ctx.save();
      ctx.globalAlpha = Math.max(0, a);
      // 放射锯齿
      ctx.fillStyle = p < 0.4 ? '#FFD60A' : '#E6392F';
      ctx.beginPath();
      const seg = 12;
      for (let i = 0; i <= seg; i++){
        const ang = i / seg * Math.PI * 2;
        const r = R * (0.72 + 0.28 * Math.abs(Math.sin(i * 2.7 + f.t * 0.02)));
        const x = cx + Math.cos(ang) * r, y = cy + Math.sin(ang) * r;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#111'; ctx.lineWidth = 3; ctx.stroke();
      // 浓烟
      ctx.fillStyle = 'rgba(30,30,30,0.8)';
      ctx.beginPath(); ctx.arc(cx + f.w*0.2, cy - f.w*0.15, R*0.4*easeOutCubic(p), 0, 7); ctx.fill();
      // BOOM
      if (p > 0.15 && p < 0.7){
        const s2 = 1 + 0.6 * Math.sin(p * 9);
        drawPixelText('BOOM!', cx, cy, 40 * s2 * (p < 0.3 ? p/0.3 : 1), '#FFD60A', { align: 'center' });
      }
      ctx.restore();
      break;
    }
    /* ---- BREAKING NEWS 全屏横幅 ---- */
    case 'news': {
      const inP = clamp(tt / 220, 0, 1);
      const outP = clamp((tt - (f.dur - 200)) / 200, 0, 1);
      const slide = inP * (1 - outP);
      ctx.save();
      // 斜纹横幅
      const bw = W * 1.2, bh = 64, by = -50 + slide * 12;
      ctx.translate(-(1 - slide) * 60, 0);
      pxRect(-20, by, bw, bh, '#FFD60A');
      ctx.save();
      ctx.beginPath(); ctx.rect(-20, by, bw, bh); ctx.clip();
      for (let i = -2; i < 20; i += 2){
        ctx.fillStyle = '#1A1A1A'; ctx.globalAlpha = 0.16;
        ctx.beginPath();
        ctx.moveTo(i * 46, by - 20); ctx.lineTo(i * 46 + 23, by + bh + 20); ctx.lineTo(i * 46 + 46, by + bh + 20); ctx.lineTo(i * 46 + 23, by - 20);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
      pxBorder(-20, by, bw, bh, '#111111', 3);
      drawPixelText('⚡ BREAKING NEWS ⚡', W/2, by + bh/2, 26, '#111111', { align: 'center', shadow: false });
      // 标题砸入
      const tIn = clamp((tt - 260) / 240, 0, 1);
      if (tIn > 0 && p < 0.94){
        const ty = by + bh + 34 + (1 - easeOutBack(tIn)) * 60;
        const sc = easeOutBack(tIn);
        ctx.save();
        ctx.translate(W/2, ty); ctx.scale(sc, sc);
        pxRect(-W/2, -26, W, 52, '#111111');
        pxBorder(-W/2, -26, W, 52, '#FFD60A', 3);
        drawPixelText(f.title, 0, 2, 30, '#FFFFFF', { align: 'center' });
        ctx.restore();
        if (f.sub) drawPixelText(f.sub, W/2, ty + 58, 15, '#E6392F', { align: 'center' });
      }
      ctx.restore();
      break;
    }
    /* ---- 计票柱状图 ---- */
    case 'objection': {   // 法庭高潮：事件生效瞬间的全屏反对
      const inP = clamp(tt / 140, 0, 1);
      const outP = clamp((tt - (f.dur - 200)) / 200, 0, 1);
      const a = clamp(Math.min(inP, 1 - outP), 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      if (p < 0.1){ ctx.save(); ctx.globalAlpha = (0.1 - p) / 0.1 * 0.5; pxRect(0, 0, W, H, '#FFFFFF'); ctx.restore(); }
      else if (p > 0.45 && p < 0.6){ ctx.save(); ctx.globalAlpha = (0.6 - p) / 0.15 * 0.22; pxRect(0, 0, W, H, '#E6392F'); ctx.restore(); }
      pxRect(0, 0, W, H, 'rgba(10,12,20,0.42)');
      ctx.translate(W/2, H * 0.32);
      ctx.scale(easeOutBack(inP), easeOutBack(inP));
      pxRect(-W * 0.38, -36, W * 0.76, 72, '#111111');
      pxBorder(-W * 0.38, -36, W * 0.76, 72, '#FFD60A', 5);
      drawPixelText('OBJECTION!', 0, 2, 46, '#FFD60A', { align: 'center', shadow: false });
      if (f.sub) drawPixelText(f.sub, 0, 66, 17, '#FFFFFF', { align: 'center' });
      ctx.restore();
      break;
    }
    case 'count': {
      const cx = W - 262, cy = 64, cw = 252, chh = 150;
      const a = p < 0.08 ? p/0.08 : (p > 0.9 ? (1-p)/0.1 : 1);
      ctx.save();
      ctx.globalAlpha = clamp(a, 0, 1);
      pxRect(cx, cy, cw, chh, 'rgba(20,25,40,0.92)');
      pxBorder(cx, cy, cw, chh, '#FFD60A', 3);
      drawPixelText('审 议 中', cx + cw/2, cy + 18, 17, '#FFD60A', { align: 'center', shadow: false });
      const votes = f.votes, mx = Math.max(1, ...votes);
      const n = votes.length;
      const bw2 = Math.min(44, (cw - 30) / n - 6);
      votes.forEach((v, i) => {
        const bx = cx + 15 + i * (bw2 + 6);
        const grow = easeOutCubic(clamp(p / 0.8, 0, 1));
        const bh2 = Math.max(6, (v / mx) * 74 * grow);
        const by = cy + chh - 42 - bh2;
        pxRect(bx, by, bw2, bh2, f.cols[i]);
        pxBorder(bx, by, bw2, bh2, '#111111', 2);
        if (grow < 0.92){
          drawPixelText(String(Math.round(v * grow)), bx + bw2/2, by - 12, 15, '#FFFFFF', { align: 'center', shadow: false });
        } else {
          // 计票大数字：完成后向上弹出爆出（最高票金色放大+星星）
          const pop = easeOutBack(clamp((p - 0.88) / 0.12, 0, 1));
          const isWin = v === mx && f.t > 0;
          const sz = 15 + 14 * pop;
          const py = by - 12 - pop * 30;
          drawPixelText(String(v), bx + bw2/2, py, sz, isWin ? '#FFD60A' : '#FFFFFF', { align: 'center', shadow: false });
          if (isWin){
            const tw = Math.sin(f.t / 60) * 3;
            drawPixelText('★ 领先', bx + bw2/2, py - sz - 6 + tw, 11, '#FFD60A', { align: 'center', shadow: false });
          }
        }
        drawPixelText(f.names[i].charAt(0), bx + bw2/2, cy + chh - 26, 13, '#FFD60A', { align: 'center', shadow: false });
      });
      ctx.restore();
      break;
    }
    /* ---- 领奖台 ---- */
    case 'podium': {
      const cx = W - 262, cy = 64, cw = 252, chh = 150;
      const a = p < 0.08 ? p/0.08 : (p > 0.9 ? (1-p)/0.1 : 1);
      ctx.save();
      ctx.globalAlpha = clamp(a, 0, 1);
      pxRect(cx, cy, cw, chh, 'rgba(20,25,40,0.92)');
      pxBorder(cx, cy, cw, chh, '#FFD60A', 3);
      drawPixelText('本轮排名', cx + cw/2, cy + 16, 17, '#FFD60A', { align: 'center', shadow: false });
      const order = f.order; // [{seat,name,partyCol}]
      const hs = [52, 34, 20];
      order.forEach((o, i) => {
        const px = cx + 22 + i * 70;
        const base = cy + chh - 26;
        const hh = hs[i] * easeOutBack(clamp((tt - i * 160) / 400, 0, 1));
        pxRect(px, base - hh, 58, hh, o.col);
        pxBorder(px, base - hh, 58, hh, '#111111', 2);
        drawPixelText(String(i + 1), px + 10, base - hh + 10, 12, contrast(o.col), { shadow: false });
        pxRect(px + 8, base - hh - 22, 42, 22, o.col);
        pxBorder(px + 8, base - hh - 22, 42, 22, '#111111', 2);
        drawPixelText(o.name.charAt(0), px + 29, base - hh - 11, 12, contrast(o.col), { align: 'center', shadow: false });
      });
      if (p > 0.35 && p < 0.8){
        drawPixelText('🏆 领先', cx + cw - 58, cy + 44, 14, '#FFD60A', { align: 'center', shadow: false });
      }
      ctx.restore();
      break;
    }
    /* ---- 数值飘字 ---- */
    case 'float': {
      const fy = f.y - 40 * easeOutCubic(p);
      const al = p < 0.7 ? 1 : (1 - p) / 0.3;
      ctx.save();
      ctx.globalAlpha = al;
      const sc = 1 + 0.5 * Math.sin(Math.min(1, p * 3) * Math.PI) * 0.3;
      ctx.translate(f.x, fy); ctx.scale(sc, sc);
      drawPixelText(f.text, 0, 0, f.size || 22, f.col || '#FFD60A', { align: 'center' });
      ctx.restore();
      break;
    }
    /* ---- 金币 ---- */
    case 'coin': {
      const al = p < 0.7 ? 1 : (1 - p) / 0.3;
      ctx.save();
      ctx.globalAlpha = al;
      ctx.translate(f.x, f.y - 26 * easeOutCubic(p));
      pxRect(-14, -14, 28, 28, '#E8A418');
      pxBorder(-14, -14, 28, 28, '#111111', 3);
      drawPixelText('⊙', 0, 1, 16, '#4A3100', { align: 'center', shadow: false, lineW: 0 });
      drawPixelText(f.text, 22, 4, 18, '#E8A418', { shadow: false });
      ctx.restore();
      break;
    }
    /* ---- 卡牌缩放入场 ---- */
    case 'cardIn': {
      const sc = easeOutBack(p);
      ctx.save();
      ctx.translate(f.x + f.w/2, f.y + f.h/2);
      ctx.scale(sc, sc);
      ctx.globalAlpha = clamp(p * 4, 0, 1);
      ctx.translate(-f.w/2, -f.h/2);
      if (f.draw) f.draw();
      ctx.restore();
      break;
    }
    /* ---- 碎裂 ---- */
    case 'shatter': {
      ctx.save();
      ctx.globalAlpha = 1 - p;
      const cx = f.x + f.w/2, cy = f.y + f.h/2;
      const rnd = f.seed || 7;
      for (let i = 0; i < (fxLowQ ? 7 : 14); i++){
        const ang = ((rnd * (i + 1) * 1.7) % 6.28) + 0.15;
        const dist = p * 90 * (0.4 + ((rnd * i) % 10) / 12);
        const px = cx + Math.cos(ang) * dist, py = cy + Math.sin(ang) * dist;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(ang + p * 3);
        const s = 6 + ((rnd * (i + 3)) % 8);
        pxRect(-s/2, -s/3, s, s * 0.66, f.col || '#FFFFFF');
        ctx.restore();
      }
      ctx.restore();
      break;
    }
    /* ---- 卡牌蓄力闪光 ---- */
    case 'pulse': {
      const on = Math.sin(tt / 90) > 0 ? 0.85 : 0.25;
      ctx.save();
      ctx.globalAlpha = on * (1 - p * 0.5);
      pxRect(f.x - 3, f.y - 3, f.w + 6, f.h + 6, f.col || '#FFD60A');
      ctx.restore();
      break;
    }
    /* ---- 方向光束 ---- */
    case 'beam': {
      const pr = easeOutCubic(p);
      const x = f.x0 + (f.x1 - f.x0) * pr;
      const y = f.y0 + (f.y1 - f.y0) * pr;
      ctx.save();
      ctx.globalAlpha = p < 0.85 ? 1 : (1 - p) / 0.15;
      ctx.strokeStyle = f.col || '#FFD60A';
      ctx.lineWidth = 7;
      ctx.lineCap = 'butt';
      ctx.beginPath();
      ctx.moveTo(f.x0, f.y0); ctx.lineTo(x, y);
      ctx.stroke();
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(f.x0, f.y0); ctx.lineTo(x, y);
      ctx.stroke();
      // 箭头
      ctx.fillStyle = f.col || '#FFD60A';
      const ang = Math.atan2(f.y1 - f.y0, f.x1 - f.x0);
      ctx.translate(x, y); ctx.rotate(ang);
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-8, -9); ctx.lineTo(-8, 9); ctx.closePath(); ctx.fill();
      ctx.restore();
      break;
    }
    /* ---- 阶段横幅 ---- */
    case 'phase': {
      const inP = clamp(tt / 260, 0, 1);
      const outP = clamp((tt - (f.dur - 240)) / 240, 0, 1);
      const sl = inP * (1 - outP);
      const bw = 420, bh = 46;
      const bx = W/2 - bw/2, by = 6;
      ctx.save();
      ctx.globalAlpha = 0.96;
      pxRect(bx + (1 - sl) * 40, by, bw, bh, '#111111');
      pxBorder(bx + (1 - sl) * 40, by, bw, bh, '#FFD60A', 3);
      drawPixelText(f.label, bx + (1 - sl) * 40 + bw/2, by + bh/2, 22, '#FFD60A', { align: 'center', shadow: false });
      ctx.restore();
      break;
    }
    /* ---- 纸屑 ---- */
    case 'confetti': {
      ctx.save();
      ctx.globalAlpha = 1 - Math.max(0, p - 0.85) / 0.15;
      const rnd = f.seed || 3;
      const n = Math.min(f.n || 40, fxLowQ ? 18 : 40);   // #60：fxLowQ 减半；修复原 `i < f.n || 40` 无限循环 bug
      for (let i = 0; i < n; i++){
        const ang = ((rnd * (i + 1) * 2.3) % 6.28);
        const dist = easeOutCubic(p) * (40 + ((rnd * i) % 60));
        const px = f.x + Math.cos(ang) * dist;
        const py = f.y + Math.sin(ang) * dist + p * 26;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(p * 4 + i);
        pxRect(-4, -3, 8, 6, ['#FFD60A','#D82E2F','#1E4FB5','#0E8A5F','#E8A418','#FFFFFF'][i % 6]);
        ctx.restore();
      }
      ctx.restore();
      break;
    }
    /* ---- 烟火 ---- */
    case 'firework': {
      const burstDur = 420;
      const nb = Math.floor(tt / burstDur);
      const bt = tt - nb * burstDur;
      if (bt < burstDur - 40){
        const pr2 = bt / burstDur;
        ctx.save();
        ctx.globalAlpha = 1 - pr2;
        const rnd = (f.seed || 11) + nb * 17;
        for (let i = 0; i < (fxLowQ ? 13 : 26); i++){
          const ang = (i / 26) * 6.283;
          const sp = 46 + ((rnd * i) % 30) / 2;
          const px = f.x + Math.cos(ang) * sp * pr2;
          const py = f.y + Math.sin(ang) * sp * pr2 + pr2 * pr2 * 34;
          ctx.fillStyle = i % 3 === 0 ? '#FFFFFF' : f.col;
          ctx.fillRect(px - 2, py - 2, 4, 4);
        }
        ctx.restore();
      }
      break;
    }
    /* ---- 支持度星星 ---- */
    case 'star': {
      const al = p < 0.75 ? 1 : (1 - p) / 0.25;
      ctx.save();
      ctx.globalAlpha = al;
      ctx.translate(f.x, f.y - 30 * easeOutCubic(p));
      const sc = 1 + 0.45 * Math.sin(Math.min(1, p * 3.2) * Math.PI);
      ctx.scale(sc, sc);
      drawPixelText('★ ' + f.text, 0, 0, f.size || 26, '#E8A418', { align: 'center' });
      ctx.restore();
      break;
    }
    /* ---- 恐怖目标红框闪烁 ---- */
    case 'targetPulse': {
      const on = Math.sin(tt / 140) > 0;
      if (on){
        ctx.save();
        ctx.strokeStyle = '#E6392F';
        ctx.lineWidth = 5;
        ctx.lineJoin = 'miter';
        jaggedRectPath(f.x - 4, f.y - 4, f.w + 8, f.h + 8, 2);
        ctx.stroke();
        ctx.restore();
      }
      break;
    }
    /* ---- 飞牌轨迹（C1：手牌区 → 辩论台） ---- */
    case 'flyTo': {
      const x0 = f.x0, y0 = f.y0, x1 = f.x1, y1 = f.y1;
      const cx = x0 + (x1 - x0) * p, cy = y0 + (y1 - y0) * p;
      const arc = Math.sin(p * Math.PI) * (f.arc || -46);
      const sc = 1 + 0.25 * Math.sin(p * Math.PI);
      ctx.save();
      ctx.globalAlpha = p < 0.08 ? p / 0.08 : (p > 0.92 ? (1 - p) / 0.08 : 1);
      ctx.translate(cx, cy + arc);
      ctx.rotate((f.rot || 0) * (1 - p));
      ctx.scale(sc, sc);
      if (f.draw){ f.draw(); }
      else UIKit.drawCardBackAt(ctx, -f.w/2, -f.h/2, f.w, f.h, PAL.ui.b);
      ctx.restore();
      // 落台高亮：即将到位时金色脉冲描边
      if (f.landGlow && p > 0.88){
        const gl = clamp((p - 0.88) / 0.12, 0, 1) * (0.5 + 0.5 * Math.sin(f.t / 70));
        ctx.save();
        ctx.globalAlpha = gl;
        pxBorder(x1 - f.w/2 - 5, y1 - f.h/2 - 5, f.w + 10, f.h + 10, '#FFD60A', 4);
        ctx.restore();
      }
      break;
    }
    /* ---- 数字滚动（C2：⊙/支持度 变化时在面板上滚动） ---- */
    case 'rollNum': {
      const pr = f.pr;
      const txt = String(Math.round(f.from + (f.to - f.from) * easeOutCubic(p)));
      const col = f.to > f.from ? (f.kind === 'money' ? '#B8860B' : '#0E8A5F') : '#E6392F';
      const sx = f.kind === 'money' ? pr.x + pr.w * 0.16 : pr.x + pr.w * 0.16;
      const sy = f.kind === 'money' ? pr.y + pr.h/2 - 10 : pr.y + pr.h/2 + 10;
      const al = p < 0.1 ? p/0.1 : (p > 0.85 ? (1 - p) / 0.15 : 1);
      ctx.save();
      ctx.globalAlpha = Math.max(0, al);
      pxRect(sx - 22, sy - 13, 70, 26, 'rgba(255,212,0,0.35)');
      pxBorder(sx - 22, sy - 13, 70, 26, '#111111', 1.5);
      drawPixelText((f.to > f.from ? '+' : '') + txt, sx + 13, sy, 15, col, { shadow: false });
      ctx.restore();
      break;
    }
  }
}
/* 画布坐标卡牌绘制（供翻牌/入场在变换后调用） */
/* ============================ 5. 风味名池（24 组 × 18 = 432 名） ============================ */
const VOTER_FLAVOR = {

  /* ---------------- 布局引擎：唯一的坐标决策点 ---------------- */
  function planCard(x, y, w, h) {
    const ratio = w / h;
    const mini = w < 70 || h < 62 || ratio < 0.52;          // 迷你：名字+票数+价格
    const small = !mini && (w < 116 || h < 96 || ratio < 0.8); // 小档：技能图标小字+条
    const pad = 4;
    const vbW = Math.min(48, w * 0.36);
    const vbH = Math.min(20, h * 0.2);
    const nameSize = Math.max(9, Math.min(h * (mini ? 0.10 : 0.14), 22));
    const badgeSize = Math.max(14, Math.min(h * 0.28, 40));
    return {
      mini, small, ratio,
      voteBadge: { x: x + pad, y: y + pad, w: vbW, h: vbH },
      name: { x: x + vbW + 8, y: y + h * (mini ? 0.04 : 0.06), w: w - vbW - 14, h: nameSize * 1.4, size: nameSize },
      skillBadge: { x, y: y + h * (mini ? 0.5 : 0.34), w, h: badgeSize * 1.6, size: badgeSize },
      skillName: { x, y: y + h * (small ? 0.52 : 0.74), w, h: Math.max(14, h * 0.08), size: Math.max(8, Math.min(h * 0.07, 13)) },
      cost: { x: x + w / 2 - Math.min(30, w * 0.25), y: y + h - 20, w: Math.min(60, w * 0.5), h: 16, size: Math.max(10, h * 0.082) },
      camp: { x, y: y + 1, w: 3, h: h - 2 }
    };
  }

  /* ---------------- 卡背（唯一源：由双端抽入，超级更新#5） ---------------- */
  function drawCardBackAt(ctx, x, y, w, h, col) {
    const shadow = E('comicShadow'), rect = E('pxRect'), border = E('pxBorder'), text = E('drawPixelText');
    const PAL = E('PAL') || {};
    const bc = col || (PAL.ui && PAL.ui.b) || '#14213D';
    shadow(x, y, w, h, 3, 3);
    rect(x, y, w, h, '#222222');
    border(x, y, w, h, bc, 2.5);
    rect(x + w * 0.18, y + h * 0.16, w * 0.64, h * 0.68, 'rgba(255,255,255,0.08)');
    text('?', x + w / 2, y + h / 2, h * 0.36, bc, { align: 'center', shadow: false });
  }

  /* ---------------- 组装：drawCard（供 drawVoterCard 薄封装调用） ---------------- */
  function drawCard(ctx, x, y, w, h, card, o) {

      return;
    }

    const col = o.col || '#f6e9c8';
    const lay = planCard(x, y, w, h);

    shadow(x, y, w, h, 3, 3);
    rect(x, y, w, h, col);
    border(x, y, w, h, '#111111', 2);

    // 阵营色带（o.seat 提供时）

      rect(x, y + 1, 3, h - 2, camp(o.seat));
      border(x, y + 1, 3, h - 2, '#111111', 1);
    }

    // ① 票数金徽（左上，StS 费用位）
    const vb = lay.voteBadge;
    rect(vb.x, vb.y, vb.w, vb.h, '#111111');
    border(vb.x, vb.y, vb.w, vb.h, '#111111', 1);
    text('⚖' + (card.votes || 1), vb.x + vb.w / 2, vb.y + vb.h / 2, Math.max(10, h * 0.085), '#FFD60A', { align: 'center', shadow: false });

    // ② 名字大字（顶部居中，避开左上徽章）
    const nm = lay.name;

    text(fName.text, nm.x + nameW / 2, nm.y + nm.h / 2, fName.size, '#111111', { align: 'center', shadow: false });

    const sk = card.skill ? (skills ? skills[card.skill] : null) : null;
    const icon = card.skill ? (SKILL_ICON[card.skill] || '⚖') : null;

    if (!lay.mini) {
      // ③ 身份标签（两字小字：名字与技能徽章之间）
      const tag = card.id ? VOTER_TAG[card.id] : null;
      if (tag && !lay.small) {
        text(tag, x + w / 2, y + h * 0.30, Math.max(8, h * 0.055), '#8a7a52', { align: 'center', shadow: false });
      }
      const sb = lay.skillBadge;
      if (icon && !lay.small) {
        // ③ 中央大徽章（技能图标，占卡宽 64%）
        const fxc = (SKILL_FX[card.skill] && SKILL_FX[card.skill].col) || '#1E4FB5';
        rect(sb.x + sb.w * 0.18, sb.y, sb.w * 0.64, sb.h, fxc + '44');
        border(sb.x + sb.w * 0.18, sb.y, sb.w * 0.64, sb.h, fxc, 2.5);
        text(icon, sb.x + sb.w / 2, sb.y + sb.h / 2, sb.size, '#FFFFFF', { align: 'center' });
      } else if (icon && lay.small) {
        // 小档：技能图标（无大徽章底，居中偏上）
        const fxc = (SKILL_FX[card.skill] && SKILL_FX[card.skill].col) || '#1E4FB5';
        text(icon, sb.x + sb.w / 2, sb.y + sb.h / 2, Math.max(12, sb.size * 0.6), fxc, { align: 'center', shadow: false });
      } else if (!sk && !lay.small) {
        // 铁证：绿色 ⚖ 徽章
        rect(sb.x + sb.w * 0.18, sb.y, sb.w * 0.64, sb.h, 'rgba(14,138,95,0.5)');
        border(sb.x + sb.w * 0.18, sb.y, sb.w * 0.64, sb.h, '#0E8A5F', 2.5);
        text('⚖', sb.x + sb.w / 2, sb.y + sb.h / 2, sb.size, '#FFFFFF', { align: 'center' });
        text('铁证', sb.x + sb.w / 2, sb.y + sb.h * 0.82, Math.max(9, sb.size * 0.3), '#0E8A5F', { align: 'center', shadow: false });
      }
      // 技能名小字（normal：徽章下方深棕；small：黑底黄字条）
      if (sk) {
        const sn = lay.skillName;
        if (lay.small) {
          rect(x + 4, sn.y, w - 8, sn.h, card.skill === 'terrorist' ? '#7A0E0E' : '#111111');
          text(lv(sk.lv) + sk.name, x + w / 2, sn.y + sn.h / 2, Math.max(9, sn.size), '#FFD60A', { align: 'center', shadow: false });
        } else {
          text(lv(sk.lv) + sk.name, x + w / 2, sn.y + sn.h / 2, sn.size, '#4A3100', { align: 'center', shadow: false });
        }
      }
    }

    // ④ 底部价格金条
    const cb = lay.cost;
    rect(cb.x, cb.y, cb.w, cb.h, '#E8A418');
    border(cb.x, cb.y, cb.w, cb.h, '#111111', 2);
    text('⊙' + card.cost, cb.x + cb.w / 2, cb.y + cb.h / 2, cb.size, '#4A3100', { align: 'center', shadow: false, lineW: 0 });
  }

/* 通用卡牌槽位（P0 根因修复）：均分可用宽 = W - 20 - 右预留，左对齐，永不溢出。 */
function flexRects(n, y, h, gap, maxW, reserveR) {
  if (n <= 0) return [];
  gap = gap || 12; maxW = maxW || 200; reserveR = reserveR || 0;
  const avail = Math.max(40, W - 20 - reserveR);
  let cw = clamp((avail - (n - 1) * gap) / n, 16, maxW);
  if (n * cw + (n - 1) * gap > avail) cw = Math.max(10, (avail - (n - 1) * gap) / n);
  const out = [];
  for (let i = 0; i < n; i++) out.push({ x: 10 + i * (cw + gap), y, w: cw, h });
  return out;
}

function renderGame(){
  // 渲染骨架收敛至 shared/render-core.js（renderScene）：清屏+背景+六段+尾部
  const env = renderEnv();

    renderToast();

      ctx.save();
      ctx.fillStyle = 'rgba(10,14,25,' + clamp(settleOverlay / 900, 0, 0.85) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
      drawPixelText('🏛 审议结算中…', W/2, H/2, 30, '#FFD60A', { align: 'center' });
    }
    // D1：连续事件"是否继续打出第二张？[是][否]"弹窗
    if (secondEventAsk && !game.gameOver){
      const dw = 560, dh = 150;
      const dx = W/2 - dw/2, dy = H/2 - dh/2;
      ctx.save();
      ctx.fillStyle = 'rgba(10,14,25,0.6)';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
      pxRect(dx, dy, dw, dh, '#F2E9D2');
      pxBorder(dx, dy, dw, dh, '#111111', 4);
      drawPixelText('是否继续打出第二张事件牌？', W/2, dy + 38, 22, '#111111', { align: 'center' });
      drawPixelText('最多连续 2 张 · 第 ' + game.seats[mySeat].eventCount + ' 张已打出', W/2, dy + 70, 14, '#6E5B3E', { align: 'center', shadow: false });
      const yb = btn(dx + 60, dy + dh - 58, 200, 44, '是 · 继续打出', PAL.accent.a);
      yb.act = 'eventYes';
      buttons.push(yb); drawBtn(yb);
      const nb = btn(dx + dw - 260, dy + dh - 58, 200, 44, '否 · 不再打出', PAL.ui.a);
      nb.act = 'eventNo';

  };
  RenderCore.renderScene(env);
}
function renderHud(){
  pxRect(0, 0, W, HUD_H, '#111111');
  pxBorder(0, 0, W, HUD_H, '#FFD60A', 2.5);
  const rMax = 5;
  drawPixelText('第 ' + game.round + '/' + rMax + ' 轮', 14, 16, compact ? 14 : 17, '#FFD60A', { shadow: false });
  // 轮次进度条标签（A4：第 X/5 轮 · 可视化进度；紧凑模式隐藏避免溢出 HUD）
  if (!compact){
    const pbW = 76, pbH = 9, pbX = 14, pbY = 34;
    pxRect(pbX, pbY, pbW, pbH, '#2A2A2A');
    pxBorder(pbX, pbY, pbW, pbH, '#FFD60A', 1);
    pxRect(pbX + 1, pbY + 1, Math.max(2, (pbW - 2) * Math.min(1, game.round / rMax)), pbH - 2, '#FFD60A');
    for (let i = 1; i < rMax; i++){
      const dx = pbX + (pbW - 2) * i / rMax;
      pxRect(dx, pbY + 1, 1, pbH - 2, '#111111');
    }
  }
  const ph = ElectionCore.phaseLabel(game);
  drawPixelText(ph, W/2, 22, compact ? 18 : 22, '#FFFFFF', { align: 'center' });
  drawPixelText('起始：' + game.seats[game.startingSeat].name, W - 14, 22, compact ? 12 : 15, '#FFD60A', { align: 'right', shadow: false });
  // 上轮排名横幅（A3：1/2/3/4 名次常驻显示）
  if (game.round > 1 && game.roundRank && game.roundRank.length){
    const medals = ['🥇', '🥈', '🥉', '4'];
    const rx0 = compact ? W - 260 : W - 320;
    let rtx = rx0;
    game.roundRank.slice(0, 4).forEach((si, ri) => {
      const nm = game.seats[si] ? game.seats[si].name : '';
      drawPixelText(medals[ri] + nm, rtx, 16, compact ? 11 : 13, ri === 0 ? '#FFD60A' : '#FFFFFF', { shadow: false });
      rtx += (compact ? 10 : 13) * (String(medals[ri]).length * 0.9 + nm.length * 0.62) + 14;
    });
    drawPixelText('上轮', compact ? W - 276 : W - 336, 16, compact ? 10 : 12, '#D9BE8B', { shadow: false });
  }
  // 底部：支持度竞逐轨道（按支持度占比着色，实时反映排名）
  if (game.round > 0 && game.seats.length){
    const tot = Math.max(1, game.seats.reduce((a, b) => a + b.support, 0));
    let sx = 0;
    game.seats.forEach((s, i) => {
      const w2 = Math.max(2, Math.round(W * (s.support / tot)));
      pxRect(sx, HUD_H - 4, w2, 4, campColor(i));
      sx += w2;
    });
  } else {
    pxRect(0, HUD_H - 4, W, 4, '#FFD60A');
  }
  // 阶段进度条：当前高亮 + 下一步提示（回合进程状态条）
  const steps = PHASE_STEPS;
  const idx = steps.findIndex(s => s[0] === game.phase);
  if (idx >= 0){
    let stepW = Math.min(24, (W - 380) / steps.length - 3);
    stepW = clamp(stepW, 2, 24);   // P0：窄屏下限 2
    let sx = Math.max(20, W - 330);
    if (sx + steps.length * (stepW + 3) > W - 40) {
      stepW = Math.max(2, (W - 40 - sx - (steps.length - 1) * 3) / steps.length);
    }
    steps.forEach((s, i) => {
      const active = i === idx;
      pxRect(sx, HUD_H - 16, stepW, 9, active ? '#FFD60A' : i < idx ? '#4A9A5A' : '#39425A');
      pxBorder(sx, HUD_H - 16, stepW, 9, '#111111', 1);
      sx += stepW + 3;
    });
    if (idx < steps.length - 1){
      drawPixelText('下一步：' + steps[idx + 1][1], sx + 4, HUD_H - 11, 10, '#C3D1E2', { shadow: false });
    }
  }
}
/* ===== 共享渲染模块接入（shared/render-core.js）：env 组装 + 薄封装 =====

function renderRowArea(){
  const row = game.row || [];
  const lay = rowLayout();
  const cy = lay.cy, rh = lay.rh;
  drawPixelText('证据 · 已亮出', 12, cy - 16, 13, '#6E5B3E', { shadow: false });
  // 审议阶段：行左/右半区分隔线 + 行首/行尾标记（位置博弈技能可读性）
  if (game.phase === 'count') {
    const act = lay.items.filter(it => it.revealed === true && it.removed !== true);
    if (act.length >= 2) {
      const x0 = act[0].x, x1 = act[act.length - 1].x + act[act.length - 1].w;
      const midX = (x0 + x1) / 2;
      ctx.save();
      ctx.strokeStyle = 'rgba(200,150,50,0.45)';
      ctx.lineWidth = 1;
      ctx.setLineDash([6, 6]);
      ctx.beginPath(); ctx.moveTo(midX, cy - 24); ctx.lineTo(midX, cy + rh + 10); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 0.9;
      drawPixelText('◀ 左半区', x0 + 4, cy - 16, 10, '#7A4A10', { shadow: false });
      drawPixelText('右半区 ▶', x1 - 48, cy - 16, 10, '#7A4A10', { shadow: false });
      ctx.restore();
      drawPixelText('👈 行首', act[0].x + act[0].w / 2, act[0].y - 15, 10, '#7A4A10', { align: 'center', shadow: false });
      drawPixelText('行尾 👉', act[act.length - 1].x + act[act.length - 1].w / 2, act[act.length - 1].y - 15, 10, '#7A4A10', { align: 'center', shadow: false });
    }
  }
  lay.items.forEach(it => {
    const { card, x, y, w, h } = it;
    // 入场动画（新出的暗置牌落下）
    const ci = FX.find(f => f.type === 'cardIn' && f.area === 'row' && f.uid === card.uid);
    if (ci){
      const sc = easeOutBack(clamp(ttOf(ci) / ci.dur, 0, 1));
      ctx.save();
      ctx.translate(x + w/2, y + h/2); ctx.scale(sc, sc);
      ctx.globalAlpha = clamp(ttOf(ci) * 4, 0, 1);
      ctx.translate(-w/2, -h/2);
      drawRowCard(it);
      ctx.restore();
    } else {
      drawRowCard(it);
    }
  });
  if (!row.length){
    drawPixelText('（尚未举证）', W/2, cy + rh/2, 14, '#D9BE8B', { align: 'center', shadow: false });
  }
}
function drawRowCard(it){
  const { card, x, y, w, h, seat } = it;
  const revealed = it.revealed === true;
  const removed = it.removed === true;
  if (revealed && !removed){
    UIKit.drawCard(ctx, x, y, w, h, card, { col: seat === mySeat ? campSoft(seat) : '#f6e9c8', seat, noDesc: true });
    // 阵营小标
    const pt = partyOf(seat);
    pxRect(x + w/2 - 20, y - 9, 40, 18, campColor(seat));
    pxBorder(x + w/2 - 20, y - 9, 40, 18, '#111111', 1.5);
    drawPixelText(pt.sym, x + w/2, y, 11, contrast(campColor(seat)), { align: 'center', shadow: false });
    // 技能风暴闪光（计票时）
    if (card.skill && SKILL_FX[card.skill]){
      const pu = FX.find(f => f.type === 'pulse' && f.uid === card.uid);
      if (pu){
        ctx.save();
        const on = Math.sin(ttOf(pu) / 90) > 0 ? 0.8 : 0.2;
        ctx.globalAlpha = on;
        pxRect(x - 3, y - 3, w + 6, h + 6, SKILL_FX[card.skill].col);
        ctx.restore();
      }
    }
  } else if (removed){
    ctx.save();
    ctx.globalAlpha = 0.55;
    UIKit.drawCardBackAt(ctx, x, y, w, h, '#555555');
    ctx.restore();
    drawPixelText('✕ 档案', x + w/2, y + h/2, 13, '#E6392F', { align: 'center' });
  } else {
    UIKit.drawCardBackAt(ctx, x, y, w, h, PAL.ui.b);
    drawPixelText('暗置', x + w/2, y + h/2, 12, '#D9BE8B', { align: 'center', shadow: false });
  }
  if (game.revealPending && game.revealPending.owner === mySeat && !removed && seat !== mySeat){
    pxBorder(x - 4, y - 4, w + 8, h + 8, '#E6392F', 4);
    const b = btn(x, y, w, h, '', '', true);

function currentActSeat(){
  const g = game;
  switch (g.phase){
    case 'play': return g.turn;
    case 'preEvent': case 'postEvent': return g.eventTurnSeat;
    case 'discard': return g.discardSeat;
    case 'reveal': return g.revealPending ? g.revealPending.owner : -1;
    case 'count': return g.swapPending ? g.swapPending.owner : -1;
    default: return -1;
  }
}

function canClickHand(card){
  if (!game) return false;
  const g = game;
  if (g.phase === 'play' && g.turn === mySeat && !g.seats[mySeat].playDone) return true;
  if (g.phase === 'discard' && g.discardSeat === mySeat && !g.seats[mySeat].keepDone){
    return selected.indexOf(card.uid) >= 0 || selected.length < keepMax();
  }
  return false;
}
function keepMax(){
  const s = game.seats[mySeat];
  return 2 + (s.char && s.char.skill && s.char.skill.type === 'keepPlus' ? s.char.skill.v : 0);
}
function isEventUsable(ev){
  if (!game || ev.used) return false;
  if (game.eventTurnSeat !== mySeat) return false;   // 非我方回合事件牌不可点（避免误引导）
  const s = game.seats[mySeat];
  if (s.eventPassed || s.eventCount >= 2) return false;
  if ((game.phase === 'preEvent' && ev.timing !== 'pre') || (game.phase === 'postEvent' && ev.timing !== 'post')) return false;
  return ev.lv <= ElectionCore.eventLvMax(game.round);
}

  ctx.beginPath(); ctx.moveTo(-12, -100); ctx.lineTo(-9, -106); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12, -100); ctx.lineTo(9, -106); ctx.stroke();

// #13 战绩复制：纯文本战报 → 剪贴板（clipboard API + execCommand 兜底）
function buildReportSP(g){
  const seats = g.seats;
  const order = seats.slice().sort((a, b) => b.support - a.support || a.seat - b.seat);
  const win = order[0];
  const winSide2 = win.side ? (win.side === 'prosecutor' ? '检方' : '辩护方') : '';
  const wt = g.winType === 'precedent' ? '⚖️ 先例胜利' : (g.winType === 'juryNull' ? '🕊️ 陪审团否决' : '最终陪审团倾向');
  const lines = [
    '【合理怀疑 · 世纪审判】战报',
    '胜诉方：' + win.name + (winSide2 ? '（' + winSide2 + '）' : ''),
    '胜诉方式：' + wt,
    '进行轮次：' + (g.round != null ? g.round : '-') + ' / 5',
    '种子码：' + (g.seedRaw != null ? g.seedRaw : (g.seed != null ? g.seed : '随机')),
    '—— 最终陪审团倾向 ——'
  ];
  order.forEach((s, i) => lines.push((i + 1) + '. ' + s.name + ' — ' + s.support));
  return lines.join('\n');
}
function copyReport(){
  if (!game) return;
  const txt = buildReportSP(game);
  const done = () => flash('✅ 战绩已复制，可粘贴分享');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) done(); else flash('复制失败，请手动复制');
    } catch (e) { flash('复制失败，请手动复制'); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(fallback);
  } else fallback();
}

function toInternal(e){
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function onMouseMove(e){
  const p = toInternal(e);
  mouse.x = p.x; mouse.y = p.y;
  const wasHover = hover;
  hover = findButton(p.x, p.y);
  if (hover && hover !== wasHover && performance.now() - hoverTickT > 180){ hoverTickT = performance.now(); sfx('hover'); }  // 悬停滴答（节流）
}
function findButton(x, y){
  // P1：触屏命中目标最小 44×44（以目标中心扩展——相邻小目标不会因双向扩张而重叠）（超级更新#38）
  const hit = b => {
    if (isMobile){
      const tw = Math.max(44, b.w), th = Math.max(44, b.h);
      return x >= b.x - (tw - b.w) / 2 && x <= b.x + b.w + (tw - b.w) / 2 &&
             y >= b.y - (th - b.h) / 2 && y <= b.y + b.h + (th - b.h) / 2;
    }
    return inBtn(b, x, y);
  };

    if (hit(buttons[i])) return buttons[i];
  }
  return null;
}
function onClick(e){

  const p = e && e.clientX !== undefined ? toInternal(e) : { x: mouse.x, y: mouse.y };
  const b = findButton(p.x, p.y);

function maybeAskSecondEvent(){
  if (!game) return;
  const me = game.seats[mySeat];
  if (!me) return;
  if ((game.phase !== 'preEvent' && game.phase !== 'postEvent')) return;
  if (game.eventTurnSeat !== mySeat) return;
  if (me.eventCount < 1 || me.eventCount >= 2 || me.eventPassed) return;
  const usable = me.events.filter(e => !e.used && e.timing === (game.phase === 'preEvent' ? 'pre' : 'post'));
  if (!usable.length) return;
  secondEventAsk = true;
  sfx('click');

        // 新增被移除 → 爆炸
        if (r.removed && ps && !ps.includes(':R')){

          const it = lay.items.find(x => x.card.uid === r.card.uid);
          if (it){
            addFx({ type: 'boom', x: it.x, y: it.y, w: it.w, h: it.h });

  // —— 市场新卡 ——
  game.seats.forEach((s, i) => {
    const sig = s.market.map(c => c.uid).join(',');
    if (lastMarketSig[i] !== undefined && sig !== lastMarketSig[i]){
      const old = new Set(lastMarketSig[i] ? lastMarketSig[i].split(',') : []);
      s.market.forEach(c => { if (!old.has(String(c.uid))) addFx({ type: 'cardIn', area: 'market', uid: c.uid, dur: 420 }); });
    }

  // —— 手牌新增（购买） ——

    lastHandN[i] = s.hand.length;
  });
  // —— 事件牌新增 ——
  game.seats.forEach((s, i) => {
    if (lastEventsN[i] !== undefined && s.events.length > lastEventsN[i] && i === mySeat){
      s.events.forEach(ev => addFx({ type: 'cardIn', area: 'events', uid: ev.uid, dur: 420 }));
    }
    lastEventsN[i] = s.events.length;
  });
  // —— 行牌新增（暗置落下） ——
  if (game.row.length){
    const lay = rowLayout();
    game.row.forEach(r => {
      const isNew = !(lastRowSigBefore && lastRowSigBefore.includes(r.card.uid));
      // 简化：phase==='play' 时新增
      if (game.phase === 'play' && isNewRow(r)) {
        const it = lay.items.find(x => x.card.uid === r.card.uid);
        if (it) addFx({ type: 'cardIn', area: 'row', uid: r.card.uid, dur: 380 });

  // —— 事件打出（AI）→ 新闻 ——（自己的事件由点击处理器 fireNews，避免双触发）
  if (game.logs.length !== lastLogN){
    const meName = game.seats[mySeat].name;
    for (let i = lastLogN; i < game.logs.length; i++){
      const lg = game.logs[i] || '';
      if (lg.indexOf(meName) === 0) continue;   // 跳过自己的日志
      const m = lg.match(/打出事件【(.+?)】/);
      const m2 = lg.match(/法庭黑天鹅事件触发：【(.+?)】/);
      if (m || m2){
        const nm = m ? m[1] : m2[1];
        const evT = (ElectionCore.data.EVENT_TEMPLATES || []).find(t => t.name === nm);
        fireNews(nm, evT ? evT.desc : '', !!m2);
      }
    }
    lastLogN = game.logs.length;
  }
  // —— 游戏结束 ——
  if (game.gameOver && !overFxDone){
    overFxDone = true;
    sfx('win');
    const ws2 = game.seats[game.winner];
    const ws2side = ws2 && ws2.side ? (ws2.side === 'prosecutor' ? '检方' : '辩护方') : '';
    let winTitle = '🏆 胜诉！', winSub = ws2.name + (ws2side ? '（' + ws2side + '）' : '');

    else if (game.winType === 'juryNull') winSub = '🕊️ 陪审团否决 · ' + ws2.name + (ws2side ? '（' + ws2side + '）' : '');
    addFx({ type: 'news', dur: 2400, title: winTitle, sub: winSub });
    addFx({ type: 'confetti', x: W/2, y: 60, dur: 2000, seed: 9, n: 90 });
  }
}
let lastRowSigBefore = '';
function isNewRow(r){
  if (!lastRowSigBefore) return false;
  return !lastRowSigBefore.split(',').some(s2 => s2.split(':')[0] === String(r.card.uid));
}
/* C1：查找某张手牌在底部手牌区的当前位置（用于飞牌轨迹起点） */
function handCardPos(uid){
  if (!game) return null;
  const lay = handLayout();
  const it = lay.find(x => x.card.uid === uid);
  return it || null;
}
function SKILLS_LV(skill){
  const sk = ElectionCore.data.SKILLS[skill];

}

/* ============================ 12. 游戏流程控制 ============================ */
function startGame(){
  selected = []; eventPick = null; showRules = false; showAbout = false; buyMode = 'buy'; overTimer = 0;
  overFxDone = false; FX.length = 0; shakeAmp = 0; waitUntil = 0;
  // 重置上一局残留状态（D1/D2/D3 遮罩与 AI 队列）
  thinkSeat = -1; settleOverlay = 0; secondEventAsk = false;
  aiQueue = []; aiTimer = 0; logExpanded = true;
  const names = ['你', 'AI·公诉', 'AI·被告', 'AI·第三方'];
  const aiMask = names.map((_, i) => i !== 0);
  // #13 种子码：留空=随机（同种子=同一对局可复现）；仅在有输入时记住，避免空串覆盖上次记忆（P1 修复）
  const seedVal = seedInput.trim();
  if (seedVal) { try { localStorage.setItem('elec_seed', seedVal); } catch (err) { /* 忽略 */ } }
  game = ElectionCore.createGame({ seatCount, names: names.slice(0, seatCount), aiMask: aiMask.slice(0, seatCount), seed: seedVal || Math.floor(Math.random() * 1e9) });
  lastV = game.version; lastPhase = game.phase;
  lastRowSig = sigOf(game.row); lastVotesSig = ''; lastRankSig = '';
  lastMoney = game.seats.map(s => s.money);
  lastSupport = game.seats.map(s => s.support);
  lastHandN = game.seats.map(s => s.hand.length);
  lastEventsN = game.seats.map(s => s.events.length);
  lastMarketSig = game.seats.map(s => s.market.map(c => c.uid).join(','));

function toMenu(){
  game = null; FX.length = 0;
  screen = 'menu';
}
function pumpAI(){
  if (!game || screen !== 'game') return;
  if (performance.now() < waitUntil) return;
  if (aiQueue.length === 0){
    const need = ElectionCore.needsAIAction(game);
    if (need.length){ aiQueue = need; }
    else { ElectionCore.advance(game); return; }
  }
  aiTimer++;
  if (aiTimer < 8) return;
  aiTimer = 0;
  const seat = aiQueue.shift();
  // D2：AI 行动前设置思考锁屏（仅当是 AI 且非自己）
  if (game.seats[seat] && game.seats[seat].isAI && seat !== mySeat) thinkSeat = seat;
  ElectionCore.aiAct(game, seat);
  // D2：AI 行动完成后清锁屏（短暂保留让玩家看到是谁在行动）
  const stillNeed = ElectionCore.needsAIAction(game).includes(seat);
  if (!stillNeed){
    const keep = thinkSeat;
    setTimeout(() => { if (thinkSeat === keep) thinkSeat = -1; }, 650);
  }
}
function update(dt){
  updateFx(dt);
  if (screen === 'game' && game){
    if (settleOverlay > 0) settleOverlay -= dt;
    checkFxDiffs();
    pumpAI();
    if (game.gameOver){
      overTimer++;
      if (overTimer > 30) screen = 'over';
    }
  }
  if (screen === 'draft' && game){
    if (game.phase === 'pickChar'){
      const need = ElectionCore.needsAIAction(game);
      need.forEach(seat => {
        // AI 揭晓动画：翻牌
        const cands = game.draftCandidates[seat] || [];
        const cw = 170, ch = 230;
        const total = game.seatCount * cw + (game.seatCount - 1) * 30;
        const cx0 = (W - total) / 2;
        const x = cx0 + seat * (cw + 30);
        ElectionCore.aiAct(game, seat);
        addFx({ type: 'shatter', x: x - 20, y: H*0.28, w: cw + 40, h: ch, col: '#FFFFFF', seed: seat * 7 + 2, delay: 300 });
      });
      ElectionCore.advance(game);
    }
    if (game.seats.every(s => s.char)){
      overTimer++;
      if (overTimer > 10){ screen = 'game'; overTimer = 0; }
    }
  }
}

/* 诊断日志黑匣子（程序意见3）：记录阶段流转，渲染异常时输出快照 */
const DIAG = [];
const DIAG_MAX = 200;
function diagLog(ev){ DIAG.push(Object.assign({ t: Date.now() }, ev)); if (DIAG.length > DIAG_MAX) DIAG.shift(); }
function diagOut(reason){
  try { console.warn('[diag] ' + reason + '\n' + DIAG.slice(-40).map(d => '[' + new Date(d.t).toISOString().slice(11, 23) + '] ' + (d.msg || d.type || '')).join('\n')); } catch(e){ /* 忽略 */ }
}
let lastDiagPhase = null;
let lastT = 0;
function loop(t){
  if (!lastT) lastT = t;
  const dt = Math.min(50, t - lastT);
  lastT = t;
  try {
    if (game && game.phase !== lastDiagPhase){ lastDiagPhase = game.phase; diagLog({ type: 'phase', msg: 'phase→' + game.phase + ' round ' + (game.round || 0) }); }
    update(dt);
    render();
  } catch (e){
    if (console && console.error) console.error('[render]', e);
    diagOut('渲染异常，最近事件黑匣子：');
  }
  requestAnimationFrame(loop);
}
/* 自适应：桌面/竖屏等比缩放（不变形）；横屏手机铺满窗口（逻辑坐标=窗口尺寸，文字 1:1 清晰）+ 横屏提示

}
/* 自适应（P1-5 统一坐标系）：画布尺寸 = 真实视口（含安全区），四档断点调 HUD/底栏，
 * 与联机版同一套逻辑——不再等比缩放 1000×700 逻辑画布 */
function resize(){
  SAFE = safeArea();
  const vv = window.visualViewport;
  const vw = Math.round(vv ? vv.width : window.innerWidth);
  const vh = Math.round(vv ? vv.height : window.innerHeight);
  const portrait = vh > vw;
  compact = isMobile && !portrait;
  portraitMode = isMobile && portrait;
  W = Math.max(340, vw - SAFE.left - SAFE.right);
  H = Math.max(480, vh - SAFE.top - SAFE.bottom);
  // 画布 CSS 尺寸跟随逻辑尺寸并平移到安全区内（刘海/Home 条不再遮 HUD 与底栏按钮）
  canvas.style.position = 'fixed';
  canvas.style.left = SAFE.left + 'px';
  canvas.style.top = SAFE.top + 'px';
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  applyUI();
}
window.addEventListener('resize', resize);
canvas.addEventListener('mousemove', onMouseMove);
canvas.addEventListener('click', e => {
  if (Date.now() - lastTouchTime < 600) return;   // 触屏合成 click：touchend 已处理
  onClick(e);
});
let touchStart = null;   // 触摸起点（touchstart 记录，位移>10px 或长按取消点击）
let lastTouchTime = 0;   // 最近一次 touchend 时间 → 屏蔽系统随后合成的 click
canvas.addEventListener('touchstart', e => {
  const touch = e.touches && e.touches[0];
  if (!touch) return;
  const r = canvas.getBoundingClientRect();
  touchStart = { x: touch.clientX, y: touch.clientY, t: Date.now() };
  mouse.x = (touch.clientX - r.left) * W / r.width;
  mouse.y = (touch.clientY - r.top) * H / r.height;
  const b = findButton(mouse.x, mouse.y);
  if (b) sfx('click');
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const touch = e.touches && e.touches[0];
  if (!touch || !touchStart) return;
  const dy = touch.clientY - touchStart.y;
  const dx = touch.clientX - touchStart.x;
  if (Math.hypot(dx, dy) > 10){
    // 竖屏手牌抽屉：纵向滑动翻页（超级更新#37）；普通点击流程取消
    if (portraitMode && Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 24){
      const me0 = game && game.seats && game.seats[mySeat];
      const showHand = game && (game.phase === 'play' || game.phase === 'discard') && me0 && me0.hand && me0.hand.length;
      if (showHand){
        const maxPage = Math.max(0, Math.ceil(me0.hand.length / PORTRAIT_PER_PAGE) - 1);
        if (dy < 0) handScroll = Math.min(maxPage, handScroll + 1);
        else handScroll = Math.max(0, handScroll - 1);
        touchStart = null;   // 已作为滑动处理，不触发点击
        return;
      }
    }
    touchStart = null;
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const wasTap = !!touchStart;   // 滑动过（touchmove 已置 null）→ 不算点击
  const dt = wasTap ? Date.now() - touchStart.t : 0;
  touchStart = null;
  lastTouchTime = Date.now();    // 滑动后也更新 → 屏蔽系统随后合成的 click（滑动不再误触）
  if (!wasTap) return;
  if (dt > 700) return;          // 长按：留给系统手势
  onClick();
}, { passive: false });
// P1：长按禁用系统菜单
canvas.addEventListener('contextmenu', e => e.preventDefault());
// iOS 系统手势（双击缩放/捏合）禁用
if ('ongesturestart' in window){
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
}
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
